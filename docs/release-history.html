<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬研究所｜公開履歴・旧バージョン復元</title><link rel="stylesheet" href="assets/style.css">
<style>body{font:13px/1.7 Meiryo,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f8;color:#252b34}.shell{max-width:900px;margin:0 auto;padding:24px 15px 48px}h1{font-size:22px}h2{font-size:17px}.release{background:#fff;border:1px solid #dce1e8;border-radius:10px;padding:13px;margin:12px 0}.pill{font-size:11px;padding:2px 7px;border-radius:5px;background:#f1f2f4}.sub{font-size:12px;color:#677381}.grid{display:grid;grid-template-columns:1fr auto;gap:8px}.small{font-size:12px;color:#556476;line-height:1.65}.link{color:#1d527b}.boundary{background:#fff7ef;padding:10px;border-left:3px solid #bd8852}</style></head><body><main class="shell">
<a class="link" href="index.html">← 研究所トップ</a><h1>サイト公開履歴</h1>
<p class="sub">画面の公開版とレース予想・結果データは独立管理しています。復元は画面ファイルだけに適用し、過去の予想や最新レース台帳を変更しません。</p>
<div id="versions" aria-live="polite"><p>公開履歴を読み込み中…</p></div>
<h2>リリースの運用</h2><p class="small">改修はステージングで表示とテストを確認し、明示承認後に正式版へ切り替えます。各正式公開版にはGitの不変タグを付けます。旧版への復元は別の承認リクエストでそのタグから画面を再現し、公開HTTPを照合します。</p>
<p class="boundary small">正式な購入候補を変更する場合は、画面だけでなく別途予測モデルの版管理・新規レースでのE2E監査が必要です。未承認の検証版を実購入指示として公開しません。</p>
</main><script>
const list=document.getElementById('versions');const el=(t,s)=>{let e=document.createElement(t);e.textContent=s;return e};
fetch('data/jra-site-ui-history.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{
list.textContent='';const h=el('p','現在の正式画面：'+d.current_version);h.className='sub';list.append(h);
for(const r of [...d.versions].reverse()){const b=el('section','');b.className='release';let head=el('div',r.version+(r.version===d.current_version?'　現在公開中':'　保管済み'));head.style.fontWeight='700';b.append(head,el('div',r.description||''));b.append(el('p','タグ：'+r.tag));list.append(b)}
if(d.events?.length){const h=el('h2','公開・復元の操作履歴');list.append(h);for(const x of [...d.events].reverse().slice(0,30)){const p=el('p',x.at+' ／ '+x.action+' ／ '+x.version);p.className='sub';list.append(p)}}
}).catch(()=>{list.textContent='';list.append(el('div','現在の正式画面は v1.00。初回の承認済みリリース時に公開台帳が作成されます。'))});
</script></body></html>

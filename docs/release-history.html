<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>正式サイト公開履歴｜AI競馬予想研究所</title><link rel="stylesheet" href="assets/style.css?v=20261006-red1">
<style>body{font:13px/1.7 "Meiryo UI",Meiryo,sans-serif;background:#f5f6f8;color:#252b34}.wrap{width:min(860px,calc(100% - 30px));margin:0 auto;padding:20px 0 40px}h1{font-size:21px;margin:15px 0}h2{font-size:16px}.release{margin:10px 0;padding:13px;background:#fff;border:1px solid #dbe1e7;border-radius:10px}.release strong{font-size:15px}.current{border-left:3px solid #b5172a}.muted{color:#687382;font-size:12px}.note{margin-top:7px}.safe{background:#fff9f1;border-left:3px solid #bd8852;padding:11px}.link{color:#22577a}</style></head><body>
<main class="wrap"><a class="link" href="index.html">← トップページ</a><h1>正式サイトの公開履歴</h1>
<p class="muted">実際に公開・検証済みの画面版だけを表示します。ステージングは履歴に含めません。</p>
<div id="current" class="muted">正式版を読み込み中…</div><div id="history" aria-live="polite"></div>
<h2>過去版に戻すとき</h2>
<p>復元したい版を指定してください。記録されたGitの公開断面から<strong>画面のみ</strong>を復元し、現行のレース予想・結果・払戻・発走前証跡・データ更新を維持したまま、公開後に実体を照合します。</p>
<p class="safe">例：「競馬サイトの正式画面をv1.00へ戻して」。誤操作を防ぐため、ウェブ上にワンクリックの復元ボタンは設けていません。</p>
</main><script>
const container=document.getElementById('history'),current=document.getElementById('current');
const make=(name,txt)=>{const e=document.createElement(name);e.textContent=txt;return e};
fetch('data/production-releases.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
 if(!Array.isArray(d.releases)||!d.releases.length)throw Error('履歴未登録');
 current.textContent='現在の正式公開版：v'+d.current_public_version;
 container.textContent='';
 for(const v of [...d.releases].reverse()){
  const card=make('section','');card.className='release'+(v.public_version===d.current_public_version?' current':'');
  card.append(make('strong','v'+v.public_version+(v.public_version===d.current_public_version?' ／ 現在公開中':'')));
  const day=make('div',v.deployed_at?'公開確認：'+v.deployed_at.replace('T',' ').slice(0,16):'公開日：記録なし（既存版）');day.className='muted';card.append(day);
  const notes=make('div',v.note||'公開版の保存断面');notes.className='note';card.append(notes);
  const code=make('div','復元用：'+(v.rollback_branch||v.branch||v.release_id||'保存断面未登録'));code.className='muted';card.append(code);
  container.append(card);
 }
}).catch(e=>{current.textContent='公開履歴の読み込みに失敗しました';container.textContent=e.message});
</script>  <script src="assets/visitor-counter.js?v=20261006-1" defer></script>
</body></html>

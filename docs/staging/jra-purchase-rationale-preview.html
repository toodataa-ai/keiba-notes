<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JRA 買い目の判断理由・妙味解説｜ステージング</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ecf0;color:#263143;font-family:"Meiryo UI","Meiryo","Yu Gothic",sans-serif;line-height:1.55}
header{background:#19243a;color:white;padding:13px 18px}header strong{font-size:17px}header span{font-size:11px;margin-left:12px;color:#d6dfed}
main{max-width:930px;margin:22px auto;padding:0 12px 32px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
select{font:inherit;padding:9px 12px;border-radius:8px;max-width:100%;border:1px solid #aab4c2;background:#fff}
.notice{font-size:12px;color:#5d6b7d;margin:6px 0 14px}
.paper{background:#fff;border:1px solid #ced5df;box-shadow:0 7px 24px #22344a1c;min-height:860px;padding:28px 35px;margin:auto;max-width:800px}
.kicker{color:#a32e49;font-size:12px;font-weight:800;letter-spacing:.03em}
h1{font-size:25px;margin:5px 0 5px}h2{font-size:17px;margin:20px 0 8px;border-bottom:1px solid #c9d0d9;padding-bottom:4px}
.meta{font-size:12px;color:#637182}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}
.stat{border:1px solid #d6dde6;border-radius:9px;padding:10px;background:#f8fafc}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.stat small{font-size:11px;color:#5d6b7d}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #d9dfe7;padding:6px;text-align:left;vertical-align:top}th{background:#f0f3f6;font-size:12px}
td:last-child,th:last-child{text-align:right}
.column{margin-top:12px;padding:13px 16px 14px;background:#fbf8f5;border-left:4px solid #9b4059}
.column h2{border:none;margin:0 0 7px;padding:0;color:#74223e;font-size:17px}
.column dl{margin:0}.column dt{font-size:12px;font-weight:bold;color:#74223e;margin:9px 0 1px}
.column dd{font-size:13px;margin:0;line-height:1.55}
.footnote{font-size:11px;color:#59687b;margin-top:12px}
.link{font-size:12px;margin-top:9px}
.link a{color:#275b98}
.error{padding:12px;background:#fff4ee;color:#873e16;border:1px solid #eac0a7}
@media(max-width:620px){main{margin-top:12px}.paper{padding:20px 15px;min-height:unset}h1{font-size:22px}.stat b{font-size:14px}.stat{padding:8px}.column{padding:12px}.stat small{font-size:10px}}
@media print{@page{size:A4 portrait;margin:12mm 13mm 13mm}body{background:white}header,.controls,.notice{display:none}.paper{border:0;box-shadow:none;min-height:0;padding:0;max-width:none}main{margin:0;padding:0}.column{break-inside:avoid}}
</style>
</head>
<body>
<header><strong>JRA 買い目の判断理由・妙味解説</strong><span>STAGING / 表示案・未承認</span></header>
<main>
<div class="controls"><label for="race">表示するレース：</label><select id="race"><option>公開データを確認中…</option></select></div>
<p class="notice">現在公開中の発走前固定データをもとにしたコラムのプレビューです。結果・払戻・回顧情報は生成に使用しません。正式HTML・PDFや買い目は変更していません。</p>
<section class="paper" id="paper"><p>読み込み中…</p></section>
</main>
<script>
(function(){
"use strict";
var raceSelect=document.getElementById("race"),paper=document.getElementById("paper"),rows=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function yen(n){return Number(n).toLocaleString("ja-JP")+"円"}
function odds(n){return Number(n).toLocaleString("ja-JP",{maximumFractionDigits:1})+"倍"}
function percent(n){return (Number(n)*100).toFixed(1)+"%"}
function line(t){return t.type+" "+(t.selection||[]).join(t.type==="馬単"||t.type==="三連単"?"→":"－")}
function valid(r){return r&&r.scope==="jra-main"&&r.purchase_decision==="buy"&&Array.isArray(r.final_bets)&&r.final_bets.length>0&&/^[a-f0-9]{40}$/.test(r.proof_commit||"")&&r.e2e_prediction&&r.purchase_risk_metrics&&r.date}
function render(r){
var bets=r.final_bets,invest=bets.reduce(function(s,t){return s+Number(t.stake_yen||0)},0);
var risk=r.purchase_risk_metrics||{};
if(invest!==Number(risk.stake_yen)||bets.some(function(b){return !b.quote_verified||!Array.isArray(b.selection)||!b.selection.length||!Number.isFinite(Number(b.stake_yen))})){
 paper.innerHTML='<p class="error">表示を中止しました。発走前の固定買い目・購入金額・実測オッズの監査条件を満たしていません。</p>';return;
}
var bought=bets.filter(function(b){return b.market_odds!=null&&Number.isFinite(Number(b.market_odds))&&Number(b.market_odds)>0});
var main=bets.slice().sort(function(a,b){return b.stake_yen-a.stake_yen})[0];
var leadNo=main.selection[0];
var nameMap=r.marks||{};
var marks=["◎","○","▲"].map(function(sym,i){return sym+String(nameMap[["win","second","third"][i]]||"—")}).join(" ／ ");
var topBuy=bets.filter(function(b){return b.selection.includes(leadNo)}).length;
var big=bought.slice().sort(function(a,b){return Number(b.market_odds)-Number(a.market_odds)})[0];
var statHtml='<div class="statrow">'+
'<div class="stat"><small>購入予定額</small><b>'+yen(invest)+'</b></div>'+
'<div class="stat"><small>推定・1点以上の的中確率</small><b>'+(risk.modeled_union_hit_probability==null?"未評価":percent(risk.modeled_union_hit_probability))+'</b></div>'+
'<div class="stat"><small>推定・実損確率</small><b>'+(risk.modeled_net_loss_probability==null?"未評価":percent(risk.modeled_net_loss_probability))+'</b></div></div>';
var preview=bets.slice(0,8).map(function(b){return '<tr><td>'+esc(b.type)+'</td><td>'+esc(b.selection.join(b.type==="馬単"||b.type==="三連単"?"→":"－"))+'</td><td>'+(b.market_odds==null?"未評価":esc(odds(b.market_odds)))+'</td><td>'+yen(b.stake_yen)+'</td></tr>'}).join("");
var remaining=bets.length>8?'<p class="footnote">残り'+(bets.length-8)+'点の正式な組番と購入金額は既存レポートに掲載しています。省略分を購入対象外とは扱いません。</p>':"";
var highOdds=big?line(big)+"（確認オッズ "+odds(big.market_odds)+"）":"実測価格が確認できる買い目なし";
var allocation=invest&&main.stake_yen>100?"最も厚く配分したのは"+line(main)+"の"+yen(main.stake_yen)+"。他の採用買い目と差をつけています。":"買い目ごとの配分は原則100円で、検証条件を満たさない増額はしていません。";
var profit=risk.modeled_expected_net_profit_yen==null?"未評価":yen(risk.modeled_expected_net_profit_yen);
var riskText=risk.modeled_net_loss_probability==null?"損失確率は未評価です。":"モデル上の実損確率は"+percent(risk.modeled_net_loss_probability)+"。";
var report=r.report?'<p class="link"><a href="../'+encodeURI(r.report)+'" target="_blank" rel="noopener">既存の正式な買い目・全頭診断レポートを見る</a></p>':"";
paper.innerHTML='<div class="kicker">JRA 正式購入セット／判断理由表示案</div>'+
'<h1>'+esc(r.venue)+' '+esc(r.race)+'</h1><div class="meta">'+esc(r.date)+'　発走前固定買い目を使用／事後結果は参照しない</div>'+
statHtml+'<h2>買い目（正式な固定データ）</h2>'+
'<table><thead><tr><th>券種</th><th>馬番</th><th>実測オッズ</th><th>購入額</th></tr></thead><tbody>'+preview+'</tbody></table>'+remaining+
'<aside class="column"><h2>AIの馬券戦略・妙味解説</h2><dl>'+
'<dt>能力評価と購入判断</dt><dd>STEP1の上位評価は '+esc(marks)+'。印は実オッズで変更していません。一方、購入額が最大の買い目は'+esc(line(main))+'です。能力順位と購入順位は同じとは限らず、STEP2ではオッズと期待値を別途比較しています。</dd>'+
'<dt>どこに妙味を見たか</dt><dd>採用した組番のうち、実測オッズが最も高いのは'+esc(highOdds)+'。ただし高配当だけで妙味があるとは断定せず、正式な採否は確率モデルと市場価格の比較結果に従います。購入セット全体のモデル期待純利益は'+esc(profit)+'です（未校正の推定値）。</dd>'+
'<dt>買い方・資金配分</dt><dd>'+esc(allocation)+' '+leadNo+'番を含む買い目は全'+bets.length+'点中'+topBuy+'点です。総額'+yen(invest)+'に抑え、券種・点数・配分のバランスを判断しました。</dd>'+
'<dt>今回のリスク</dt><dd>'+esc(riskText)+' 特定の馬に購入が集中した場合、その馬が崩れる展開に弱くなります。発走前オッズは変動し、推定的中確率・期待利益は保証値ではありません。</dd>'+
'</dl></aside>'+
'<p class="footnote">編集ルール：発走前にGitHubで固定された組番・オッズ・購入額・STEP1印と購入セット指標だけを要約。個別の馬券に確率根拠がない場合は「割安」「プラス期待値」と断言しない。結果を見て文章や買い目を後付け変更しない。</p>'+report;
}
fetch("../data/races.json",{cache:"no-store"}).then(function(res){if(!res.ok)throw Error("HTTP "+res.status);return res.json()}).then(function(doc){
 rows=(doc.races||[]).filter(valid).sort(function(a,b){return b.date.localeCompare(a.date)||String(a.id).localeCompare(String(b.id))}).slice(0,12);
 if(!rows.length)throw Error("対象の発走前固定データが見つかりません");
 raceSelect.innerHTML=rows.map(function(r,i){return '<option value="'+i+'">'+esc(r.date+" "+r.venue+" "+r.race)+'</option>'}).join("");
 raceSelect.addEventListener("change",function(){render(rows[Number(raceSelect.value)])});render(rows[0]);
}).catch(function(err){paper.innerHTML='<p class="error">データを読み込めませんでした：'+esc(err.message)+'</p>';raceSelect.innerHTML='<option>表示不可</option>'});
})();
</script>
</body>
</html>

name: Audit JRA staging identity against exact production baseline and LAB redirects
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/**'
      - 'docs/lab/**'
      - '!docs/lab/change-board.json'
      - '.github/scripts/staging-baseline-v2.py'
      - '.github/workflows/validate-jra-staging-identity-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: jra-staging-identity, cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check exact 11 page staging baseline with only uniform marker and noindex
        run: |
          set -euo pipefail
          python3 .github/scripts/staging-baseline-v2.py --check
          python3 - <<'PY'
          from pathlib import Path
          import json
          import importlib.machinery
          root=Path('docs')
          g=importlib.machinery.SourceFileLoader('stage','./.github/scripts/staging-baseline-v2.py').load_module()
          for name in g.PAGES:
              p=root/'staging'/name
              text=p.read_text()
              assert 'data-stage="preview"' in text,(name,'missing marker attribute')
              assert text.count('class="staging-shell-marker"')==1,(name,'missing stage badge')
              assert 'noindex,nofollow' in text and 'staging/stage-indicator.css' in text
              assert text==g.render((root/name).read_text())
          for name in ('race-simulator.html','race-course-catalog.html',
             'weekend-main-course-review.html','purchase-preview.html',
             'jra-v315-20261012/index.html'):
              path=root/'staging'/name
              text=path.read_text()
              assert 'location.replace(' in text and 'lab/' in text and 'noindex' in text,name
          data=json.loads((root/'lab/change-board.json').read_text())
          assert len(data['features'])==8
          assert sum(x['preview_path'].startswith('lab/') for x in data['features'])==7
          assert any(x['phase']=='released' for x in data['features'])
          assert (root/'lab/archive/staging-prebaseline/this-week.html').is_file()
          assert (root/'lab/archive/staging-prebaseline/results.html').is_file()
          print('PASS_11_JRA_STAGING_PAGES_EXACT_PROD_UI_LAB_REDIRECTS_NO_DATA_CHANGE')
          PY
      - name: Live staging and LAB gateway exact HTTP bytes
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30);do
            good=1
            for file in staging/index.html staging/this-week.html staging/results.html staging/experience-regime.html lab/index.html lab/change-board.json;do
              if ! curl -fsSL --max-time 22 "https://toodataa-ai.github.io/keiba-notes/$file?identity=$GITHUB_RUN_ID-$attempt" -o /tmp/jra-stage-lab-http ||
                 ! cmp -s "docs/$file" /tmp/jra-stage-lab-http;then good=0;break;fi
            done
            if [[ $good == 1 ]];then echo PASS_STAGING_LAB_HTTP_BYTES_MATCH;exit 0;fi
            sleep 8
          done
          echo '::error::Public staging or LAB content mismatch';exit 1

name: Probe JRA race links

on:
  push:
    branches: ['feature/tokyo-kyoto-stage-b-labels-v1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect one historical JRA result page
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0108202504020820251109%2F25'
          r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
          print('status',r.status_code,'final',r.url,'chars',len(r.text))
          r.raise_for_status()
          s=BeautifulSoup(r.text,'html.parser')
          for a in s.find_all('a',href=True):
              text=' '.join(a.stripped_strings)
              href=a['href']
              if 'JRADB' in href or 'CNAME=' in href or 'レース選択' in text or '開催選択' in text:
                  print(repr(text), '=>', href)
          PY

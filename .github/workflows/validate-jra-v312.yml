name: Validate JRA v3.12 staged quote coverage and portfolio comparison
on:
  pull_request:
    paths:
      - '.github/scripts/*v312*'
      - '.github/workflows/*v312*'
      - 'docs/data/jra_v312_purchase_coverage_policy.json'
      - '競馬予想_完全版プロンプト_v3.12.txt'
      - 'e2e_validation/manifests/v3.12.json'
      - 'docs/data/latest_prompt.json'
      - 'docs/data/jra_ci_supersession_v312.json'
      - '.github/workflows/e2e-validation.yml'
      - '.github/workflows/validate-jra-balanced-v311.yml'
  push:
    branches: [feature/jra-v312-odds-portfolio-audit, main]
    paths:
      - '.github/scripts/*v312*'
      - '.github/workflows/*v312*'
      - '.github/workflows/validate-jra-balanced-v311.yml'
      - '.github/workflows/e2e-validation.yml'
      - 'docs/data/latest_prompt.json'
      - 'docs/data/jra_ci_supersession_v312.json'
      - 'e2e_validation/manifests/v3.12.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax and price-coverage contracts
        run: |
          set -euo pipefail
          node --check .github/scripts/jra-purchase-audit-v312.mjs
          node --check .github/scripts/jra-prestart-pipeline-v312.mjs
          node --check .github/scripts/validate-jra-portfolio-v312.mjs
          node --check .github/scripts/test-jra-purchase-audit-v312.mjs
          python -m pip install -q beautifulsoup4 requests
          python .github/scripts/test-jra-odds-recovery-v312.py
          python -m py_compile .github/scripts/validate-jra-pdf-layout-v312.py .github/scripts/jra-odds-recovery-v312.py .github/scripts/jra-render-live-v312.py .github/scripts/validate-jra-pdf-content-v312.py .github/scripts/jra-publish-live-v312.py
          node .github/scripts/test-jra-purchase-audit-v312.mjs
          node .github/scripts/test-jra-prestart-pipeline-v312.mjs
          node .github/scripts/test-jra-balanced-v311.mjs
          node .github/scripts/test-jra-portfolio-v311.mjs
          node .github/scripts/test-jra-prestart-pipeline-v311.mjs
          node .github/scripts/validate-prompt-history.mjs
          node .github/scripts/validate-jra-prompt-v312.mjs
          node .github/scripts/validate-jra-prerace-v312.mjs
          node .github/scripts/validate-bet-type-coverage-v312.mjs
          node .github/scripts/validate-jra-ci-forward-v312.mjs .github/scripts/validate-jra-balanced-prompt-v311.mjs .github/scripts/validate-jra-portfolio-prompt-v310.mjs .github/scripts/validate-jra-reader-v37.mjs
          node .github/scripts/validate-jra-archived-compact-v312.mjs .github/scripts/validate-purchase-gate-v34.mjs
          node .github/scripts/validate-jra-archived-compact-v312.mjs .github/scripts/validate-multi-candidate-v35.mjs
          python3 e2e_validation/validate_experience_history_v312.py
      - name: Protect historical SHA pins and approved reader CSS
        run: |
          set -euo pipefail
          python3 e2e_validation/validate_manifests.py
      - name: PDF invariants, A4 and no lost candidate rows
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
          python -m pip install -q 'weasyprint==68.0' 'pymupdf==1.26.4'
          python .github/scripts/test-jra-pdf-dynamic-v311.py
          python .github/scripts/test-jra-v312-pdf.py

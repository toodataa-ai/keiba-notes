name: Admin visitor analytics read-only diagnostic
on:
  push:
    paths:
      - '.github/workflows/admin-counter-readonly-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe deployed admin and read-only CounterAPI from GitHub runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import datetime,json,urllib.request,urllib.error
          from zoneinfo import ZoneInfo
          date=datetime.datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y-%m-%d')
          base='https://counterapi.com/api/toodataa-ai-keiba-notes/visit'
          urls=[
            ('admin-page','https://toodataa-ai.github.io/keiba-notes/admin.html'),
            ('all-time',base+'/all-time?readOnly=true&unique=true'),
            ('today',base+'/day-'+date+'?readOnly=true&unique=true'),
          ]
          diagnostics=[]
          for name,url in urls:
            try:
              req=urllib.request.Request(url,headers={'Origin':'https://toodataa-ai.github.io','User-Agent':'keiba-notes-readonly-diagnostic/1.0'})
              with urllib.request.urlopen(req,timeout=16) as r:
                raw=r.read(40000)
                cors=r.headers.get('Access-Control-Allow-Origin','(missing)')
                info={'target':name,'http_status':r.status,'cors':cors,'bytes':len(raw),'content_type':r.headers.get('Content-Type','')}
                if name!='admin-page':
                  try:
                    obj=json.loads(raw)
                    info['has_numeric_value']=isinstance(obj.get('value'),(int,float)) if isinstance(obj,dict) else False
                    info['keys']=list(obj)[:12] if isinstance(obj,dict) else []
                    # An opaque count is not logged to avoid creating misleading results.
                  except (ValueError,TypeError):
                    info['json_error']=raw[:180].decode('utf-8','replace')
                else:
                  info['admin_source_found']=b'Counter API' in raw or b'counterapi.com' in raw
                diagnostics.append(info)
            except urllib.error.HTTPError as e:
              diagnostics.append({'target':name,'http_status':e.code,'cors':e.headers.get('Access-Control-Allow-Origin','(missing)'),'error_body':e.read(300).decode('utf-8','replace')})
            except Exception as e:
              diagnostics.append({'target':name,'network_error':str(e)[:300]})
          print('ADMIN_READONLY_DIAGNOSTIC='+json.dumps(diagnostics,ensure_ascii=False))
          # Do not fail: reports are useful even when upstream fails.
          PY

name: JRA 2026-10-25 three-race fresh v3.16 strict prestart release gate
on:
  pull_request:
    paths:
      - '.github/scripts/jra-build-today-fresh-v316.mjs'
      - '.github/scripts/jra-promote-formal-stake-v316.py'
      - '.github/workflows/jra-v316-today-fresh.yml'
      - '.github/workflows/validate-jra-v316-three-today-fresh.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Immutable source and complete eight-market historical pseudo-requote baseline
        run: |
          set -euo pipefail
          node --check .github/scripts/jra-build-today-fresh-v316.mjs
          python3 -m py_compile .github/scripts/jra-promote-formal-stake-v316.py
          node .github/scripts/test-jra-stake-v316-shadow.mjs
          node .github/scripts/validate-jra-v313-current-e2e-v1.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {buildTodayFreshV316} from './.github/scripts/jra-build-today-fresh-v316.mjs';
          import {expandStrategy,ticketKey} from './.github/scripts/jra-strategy-engine-v39.mjs';
          for(const [slug,src,base] of [
            ['kikka-sho','v3.13-run40141962432-attempt1.json','v3.15-run40142524663-attempt1-sealed.json'],
            ['kannazuki-stakes','v3.13-run40142225062-attempt1.json','v3.15-run40142746599-attempt1-sealed.json'],
            ['lumiere-autumn-dash','v3.13-run40141955617-attempt1.json','v3.15-run40142205087-attempt1-sealed.json']
          ]){
            const race='2026-10-25-'+slug;
            const sourceBytes=fs.readFileSync('e2e_validation/predictions/'+race+'/'+src);
            const priorBytes=fs.readFileSync('e2e_validation/predictions/'+race+'/'+base);
            const originalInputBytes=fs.readFileSync('e2e_validation/inputs/v313/'+race+'.json');
            const source=JSON.parse(sourceBytes),prior=JSON.parse(priorBytes),input=JSON.parse(originalInputBytes);
            const now_iso=new Date(Date.parse(prior.final_bets_fixed_at)+3000).toISOString();
            // The historical partially priced input is NOT a complete current market.
            // Assert the complete-catalog blocker, then synthesize only for test.
            assert.throws(()=>buildTodayFreshV316({source,sourceBytes,prior,priorBytes,
              originalInput:input,originalInputBytes,
              freshInput:input,freshBytes:originalInputBytes,now_iso}),/full catalog quotes are incomplete/);
            const originalQuotes=new Map(input.market_quotes.map(q=>[ticketKey(q.type,q.selection),q]));
            const baselineQuote=input.market_quotes[0];
            const all=new Map();
            for(const st of input.strategies)for(const selection of expandStrategy(st.type,st.strategy_kind,st.definition)){
              const k=ticketKey(selection.type,selection.selection);
              const row=originalQuotes.get(k)||{
                ...baselineQuote,type:selection.type,selection:selection.selection,
                market_selection_id:k,market_odds:5.0,
                observed_at:baselineQuote.observed_at
              };
              all.set(k,row);
            }
            const testFresh={...input,market_quotes:[...all.values()]};
            console.log('SYNTHETIC_ONLY_FULL_MARKET_TEST',race,
              'preexisting',input.market_quotes.length,'expanded',all.size);
            const actual=buildTodayFreshV316({source,sourceBytes,prior,priorBytes,
              originalInput:input,originalInputBytes,
              freshInput:testFresh,freshBytes:Buffer.from(JSON.stringify(testFresh)),now_iso});
            const p=actual.plan;
            assert.equal(p.purchase_strategy_version,'v3.16');
            assert.equal(p.status,'pending_git_proof');
            assert.equal(p.full_refresh_odds.quote_count,testFresh.market_quotes.length);
            assert.equal(p.source_prediction_sha256,prior.source_prediction_sha256);
            assert.equal(p.source_purchase_proof,prior.proof_commit);
            assert(p.total_stake_yen>=prior.total_stake_yen&&p.total_stake_yen<=6000);
            assert.deepEqual(p.formal_bets.map(x=>x.market_selection_id),
              prior.formal_bets.map(x=>x.market_selection_id));
            assert(actual.comparison.candidate.scenarios.central.loss_probability<=
              actual.comparison.baseline.scenarios.central.loss_probability+1e-7);
            console.log('PASS_V316_TODAY_COMPATIBILITY_'+slug,p.total_stake_yen,
              input.market_quotes.length,'all catalog quotations matched');
          }
          NODE

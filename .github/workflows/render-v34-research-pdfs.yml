name: Render isolated v3.4 JRA research PDFs
on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/v3.4-2026-10-10-*.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-v34-20261010
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python3 -m pip install 'weasyprint==68.0'
      - name: Validate reports and render isolated PDFs
        run: |
          set -eu
          mkdir -p /tmp/v34-pdfs
          for f in docs/reports/v3.4-2026-10-10-*.html; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .html)
            node - "$f" <<'NODE'
          const fs=require('node:fs');
          const f=process.argv[2],s=fs.readFileSync(f,'utf8');
          const slug=f.includes('mimuro')?'kyoto':'tokyo';
          const horses=(s.match(/class="page horse"/g)||[]).length;
          const pages=(s.match(/<section class="page/g)||[]).length;
          const want=slug==='kyoto'?13:11;
          if(horses!==want||pages!==want+6||/undefined|NaN|\[object Object\]/.test(s)||!s.includes('A4 portrait')){
            throw new Error('Source full-report validation failed: '+f);
          }
          console.log('Validated '+f+' '+horses+' horse pages '+pages+' total pages');
          NODE
            python3 -m weasyprint "$f" "/tmp/v34-pdfs/$base.pdf"
            pdfinfo "/tmp/v34-pdfs/$base.pdf" | grep -E 'Pages:|Page size:'
            pages=$(pdfinfo "/tmp/v34-pdfs/$base.pdf" | awk '/^Pages:/ {print $2}')
            case "$base" in
              *mimuro*) expected=19 ;;
              *saudi-arabia*) expected=17 ;;
              *) echo "Unknown PDF $base"; exit 1;;
            esac
            [ "$pages" = "$expected" ] || { echo "Unexpected pages $pages, expected $expected"; exit 1; }
            if pdftotext "/tmp/v34-pdfs/$base.pdf" - | grep -F -e undefined -e NaN -e "[object Object]"; then
              echo "::error::Unresolved placeholder in PDF: $base"
              exit 1
            fi
          done
      - name: Commit only new research PDFs
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/pdfs
          cp -a /tmp/v34-pdfs/. docs/pdfs/
          git add docs/pdfs/v3.4-2026-10-10-*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render standalone pre-race v3.4 research PDFs without changing legacy artifacts"
            git push origin HEAD:main
          fi

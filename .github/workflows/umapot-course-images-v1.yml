name: Umapot course images (private, for checking/aligning course shapes)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: toodataa-ai/keiba-notes-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
          ref: course-diagrams
      - name: Fetch category pages and the main course images
        run: |
          set -u
          mkdir -p private/umapot && cd private/umapot
          for c in 76 77 78 79 80 81 82 83 84 85; do
            curl -sSL -A "Mozilla/5.0 (research; keiba-notes)" "https://umapot.com/?cat=$c" -o cat_$c.html; sleep 2
            grep -oE 'https://umapot.com/\?p=[0-9]+' cat_$c.html | sort -u > posts_$c.txt
            while read -r u; do
              id=${u##*=}; [ -f post_$id.html ] || { curl -sSL -A "Mozilla/5.0 (research; keiba-notes)" "$u" -o post_$id.html; sleep 2; }
            done < posts_$c.txt
          done
          cat post_*.html | grep -oE 'https://umapot.com/web_sozai/[^"'"'"' ]+\.(jpg|png|gif|svg)' | sort -u > imgs.txt
          wc -l imgs.txt
          # 距離の付いていない（コースだけの）画像を優先して取る
          grep -vE '_[sd][0-9]{3,4}\.' imgs.txt > base.txt || true
          wc -l base.txt; cat base.txt
          mkdir -p img
          while read -r u; do f=$(echo "$u" | sed 's#https://umapot.com/web_sozai/##; s#/#__#g'); curl -sSL -A "Mozilla/5.0 (research; keiba-notes)" "$u" -o "img/$f"; sleep 1; done < base.txt
          ls -la img | head -60
      - name: Push to the private branch
        run: |
          set -eu
          cd private
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add umapot && git commit -qm "うまぽっと コース画像（確認・位置合わせ用・非公開）" && git push -q origin HEAD:course-diagrams && echo pushed

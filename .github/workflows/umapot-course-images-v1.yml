name: Umapot course images (private, for checking/aligning course shapes)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: toodataa-ai/keiba-notes-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
          ref: course-diagrams
      - name: Fetch blank course images and PowerPoint templates (all 10 venues)
        run: |
          set -u
          mkdir -p private/umapot/blank private/umapot/pptx && cd private/umapot
          for v in tky nkm kyt hsn cky ngt fsm kkr spr hdt; do curl -sSL -A "Mozilla/5.0 (research; keiba-notes)" "https://umapot.com/web_sozai/lace2/$v.jpg" -o blank/$v.jpg; sleep 1; done
          for v in chukyo fukushima hakodate hanshin kokura kyoto nakayama nigata sapporo tokyo; do
            curl -sSL -A "Mozilla/5.0 (research; keiba-notes)" "https://umapot.com/data/powerpoint/${v}_couse/${v}_couse.zip" -o pptx/$v.zip; sleep 2
            (cd pptx && mkdir -p $v && unzip -o -q $v.zip -d $v || true)
          done
          find pptx -type f | head -40; ls -la blank
      - name: Convert PowerPoint to SVG and PNG (LibreOffice)
        run: |
          set -u
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y libreoffice-impress >/dev/null
          cd private/umapot/pptx
          find . -name "*.pptx" | while read -r f; do d=$(dirname "$f"); soffice --headless --convert-to svg --outdir "$d" "$f" >/dev/null 2>&1 || true; soffice --headless --convert-to png --outdir "$d" "$f" >/dev/null 2>&1 || true; done
          find . -name "*.svg" -o -name "*.png" | head -40
      - name: Push to the private branch
        run: |
          set -eu
          cd private
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add umapot && git commit -qm "うまぽっと コース画像・パワーポイント素材（確認・位置合わせ用・非公開）" && git push -q origin HEAD:course-diagrams && echo pushed

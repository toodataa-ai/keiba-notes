name: Validate reader-v1 multiple full audit pages for all JRA 2026-11-15 main races
on:
  push:
    branches: [fix/jra-reader-v1-dynamic-audit-20261115]
permissions:
  contents: read
jobs:
  reader-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify all source manifest SHAs including historically anchored reader and legacy E2E files
        run: |
          set -euo pipefail
          node .github/scripts/validate-jra-v313-current-e2e-v1.mjs
          python3 -m py_compile .github/scripts/validate-jra-pdf-layout.py e2e_validation/validate_manifests.py
      - name: Install approved reader-v1 exact renderer environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
          python3 -m pip install -q weasyprint==68.0 pymupdf==1.26.4
      - name: Actually render and inspect all three 11/15 reader-v1 A4 PDFs without publishing
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            'fukushima-minyu-cup:43661398158' \
            'oro-cup:43661504718' \
            'elizabeth-queen-cup:43661467448'; do
            IFS=: read -r race run <<< "$pair"
            SOURCE="e2e_validation/snapshots/2026-11-15-$race/v3.13-run$run-attempt1.json"
            test -s "$SOURCE"
            JSON="/tmp/$race-prediction.json"
            HTML="/tmp/$race-report.html"
            PDF="/tmp/$race-reader-v1.pdf"
            python3 - "$SOURCE" "$JSON" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert p['stage']=='pending_git_proof' and p['prompt_version']=='v3.13'
          p['stage']='formal_prestart'
          p['proof_commit']='a'*40
          Path(sys.argv[2]).write_text(json.dumps(p,ensure_ascii=False))
          PY
            JRA_SELECTED_ROWS_PER_PAGE=14 JRA_REJECTED_ROWS_PER_PAGE=12 JRA_AUDIT_ROWS_PER_PAGE=14 \
              python3 .github/scripts/jra-render-live-v313.py "$JSON" "$HTML"
            JRA_COVER_BETS_PER_TYPE=6 python3 .github/scripts/jra-pdf-presentation-overlay-v1.py "$HTML" --prediction "$JSON"
            python3 -m weasyprint "$HTML" "$PDF"
            python3 .github/scripts/validate-jra-pdf-content-v313.py --html "$HTML" --pdf "$PDF" --prediction "$JSON"
            python3 .github/scripts/validate-jra-pdf-layout.py --html "$HTML" --pdf "$PDF" \
              --policy docs/data/jra_pdf_layout_policy_v1.json
            echo "PASS_STRICT_READER_V1_MULTIPAGE_AUDIT $race"
          done

name: Backfill official JRA E012 postrace research reviews
on:
  push:
    branches: [main]
    paths:
      - 'experience_regime_v1/review_backfill_v1.py'
      - '.github/workflows/experience-regime-postrace-backfill-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: experience-regime-postrace-backfill-v1
  cancel-in-progress: false
jobs:
  official-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official JRA HTML parser
        run: python -m pip install -q requests beautifulsoup4
      - name: Validate immutable collection and create official postrace research rows
        id: review
        shell: bash
        run: |
          set +e
          python -m experience_regime_v1.review_backfill_v1 --week-id 2026-10-17 --dates 2026-10-17 2026-10-18
          rc=$?
          echo "review_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit only new E012 reviews and independently derived summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experience_regime_v1/reviews/2026-10-17 docs/data/experience_regime_review_status.json
          if git diff --cached --quiet;then
            echo NO_E012_REVIEW_CHANGE
          else
            git commit -m 'Backfill proof-verified E012 research official results and outcome diagnostics'
            for i in 1 2 3 4;do
              git pull --rebase origin main
              if git push origin HEAD:main;then break;fi
              if [[ "$i" == 4 ]];then exit 1;fi
              sleep 3
            done
          fi
      - name: Require all 21 selected races reviewed; keep blockers visible if incomplete
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='docs/data/experience_regime_review_status.json'
          s=json.load(open(p))
          assert not s['production_effect']
          assert s['selected_races']==21,s
          print("E012_POSTRACE_FINAL", s['reviewed_races'], "/", s['selected_races'], "blockers", s['blockers'])
          assert s['reviewed_races']==21 and not s['blockers'], "Missing JRA official results; see committed blockers"
          PY

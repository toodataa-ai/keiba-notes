name: JRA PDF reader layout guard
on:
  pull_request:
    paths:
      - '.github/scripts/validate-jra-pdf-layout.py'
      - '.github/scripts/test-jra-pdf-layout.py'
      - '.github/workflows/jra-pdf-reader-guard.yml'
      - '.github/scripts/render-pdfs.mjs'
      - '.github/workflows/render-pdfs.yml'
      - 'docs/assets/jra-pdf-reader-v1.css'
      - 'docs/data/jra_pdf_layout_policy_v1.json'
      - 'docs/reports/**'
      - 'docs/data/races.json'
  push:
    branches: [main]
    paths:
      - '.github/scripts/validate-jra-pdf-layout.py'
      - '.github/scripts/test-jra-pdf-layout.py'
      - '.github/workflows/jra-pdf-reader-guard.yml'
      - '.github/scripts/render-pdfs.mjs'
      - 'docs/assets/jra-pdf-reader-v1.css'
      - 'docs/data/jra_pdf_layout_policy_v1.json'
      - 'docs/reports/**'
      - 'docs/data/races.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF engine and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python -m pip install 'weasyprint==68.0' 'pymupdf==1.26.4'
      - name: Validate reference template plus deliberate bad-PDF cases
        run: python .github/scripts/test-jra-pdf-layout.py
      - name: Render and validate all new eligible JRA reports without publishing
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          policy=json.loads(Path('docs/data/jra_pdf_layout_policy_v1.json').read_text())
          races=json.loads(Path('docs/data/races.json').read_text())['races']
          out=Path('/tmp/jra-pdf-reader-check');out.mkdir(exist_ok=True)
          checked=0
          for race in races:
              if race.get('scope')!='jra-main' or race.get('date','') < policy['effective_jra_race_date_from']:
                  continue
              source=Path('docs') / race['report'] if race.get('report') else None
              if not source or not source.exists():
                  raise SystemExit('Missing authored HTML for eligible new JRA report: '+race['id'])
              # v3.12 immutable published PDFs are validated AS SAVED with
              # their dedicated pinned v3.12 pagination contract, not by
              # generic v3.7 rerender which falsely rejects v3.12 tail pages.
              # Never regenerate or mutate a post-start PDF during review.
              if race.get('prompt_version')=='v3.12':
                  pdf=Path('docs') / race['pdf']
                  prediction=Path(race['e2e_prediction'])
                  if not pdf.is_file() or not prediction.is_file():
                      raise SystemExit('Missing immutable v3.12 PDF / prediction: '+race['id'])
                  subprocess.run([sys.executable,'.github/scripts/validate-jra-pdf-content-v312.py',
                      '--html',str(source),'--pdf',str(pdf),'--prediction',str(prediction)],check=True)
                  checked+=1
                  continue
              # v3.15 uses its own sealed, source-pinned renderer and full A4 validator.
              # Re-running a reader-v1 validator on it rejects legitimate technical
              # references and would rewrite historical evidence after the off.
              if race.get('purchase_strategy_version')=='v3.15':
                  import fitz
                  pdf=Path('docs') / race['pdf']
                  prediction=Path(race['e2e_prediction'])
                  if not pdf.is_file() or not prediction.is_file() or not race.get('proof_commit'):
                      raise SystemExit('Missing sealed formal v3.15 PDF/prediction/proof: '+race['id'])
                  with fitz.open(pdf) as document:
                      expected=1+race['field_size']
                      if len(document)!=expected or race.get('full_report_pages')!=expected:
                          raise SystemExit('Sealed v3.15 A4 horse-page mismatch: '+race['id'])
                      text=' '.join(page.get_text() for page in document)
                      if 'v3.15' not in document[0].get_text() or not all(
                          mark in text for mark in ('◎','○','▲','△','×')):
                          raise SystemExit('Sealed v3.15 report content incomplete: '+race['id'])
                  print('PASS_SEALED_FORMAL_V315_A4_PDF',race['id'])
                  checked+=1
                  continue
              dest=out / (race['id']+'.pdf')
              subprocess.run([sys.executable,'-m','weasyprint',str(source),str(dest)],check=True)
              subprocess.run([sys.executable,'.github/scripts/validate-jra-pdf-layout.py',
                  '--html',str(source),'--pdf',str(dest)],check=True)
              checked+=1
          print('Validated future JRA PDF sources:',checked,'(new reports are required to use the approved template)')
          PY

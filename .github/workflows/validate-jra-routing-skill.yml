name: Validate permanent JRA UI routing skill
on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/skills/keiba-site-change-routing/**'
      - '.github/lab/README.md'
      - '.github/scripts/check-jra-routing-skill.py'
      - '.github/workflows/validate-jra-routing-skill.yml'
      - 'docs/operations/JRA_UI_APPROVAL_DATA_AUTO_RELEASE.md'
      - 'docs/operations/jra_site_staging_release_v1.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate discoverable rule and real repository routing
        run: |
          set -euo pipefail
          python3 .github/scripts/check-jra-routing-skill.py
      - name: Enforce governance-only edits and no race/PDF/proof changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines())
          allowed={'AGENTS.md','.github/skills/keiba-site-change-routing/SKILL.md',
            '.github/skills/keiba-site-change-routing/references/release-checklist.md',
            '.github/lab/README.md','.github/scripts/check-jra-routing-skill.py',
            '.github/workflows/validate-jra-routing-skill.yml',
            'docs/operations/JRA_UI_APPROVAL_DATA_AUTO_RELEASE.md',
            'docs/operations/jra_site_staging_release_v1.md'}
          assert paths and paths.issubset(allowed),('unexpected modifications',sorted(paths-allowed))
          for path in ('docs/data','docs/reports','docs/pdfs','e2e_validation','local_racing_shadow_v1'):
            old=subprocess.check_output(['git','rev-parse','HEAD^:'+path],text=True).strip()
            new=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
            assert old==new,('protected tree changed',path)
          print('PASS_GOVERNANCE_ONLY_NO_OFFICIAL_PREDICTION_OR_PDF_CHANGES')
          PY

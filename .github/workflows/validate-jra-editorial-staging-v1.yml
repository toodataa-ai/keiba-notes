name: Validate JRA editorial staging is an exact production UI baseline
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/index.html'
      - 'docs/staging/methodology.html'
      - 'docs/staging/roadmap.html'
      - '.github/scripts/staging-baseline-v2.py'
      - '.github/workflows/validate-jra-editorial-staging-v1.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit editorial baseline, anchors and production untouched
        run: |
          set -euo pipefail
          python3 .github/scripts/staging-baseline-v2.py --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Tags(HTMLParser):
            def __init__(self):
              super().__init__();self.ids=set();self.duplicates=set();self.anchors=[]
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if 'id' in a:
                if a['id'] in self.ids:self.duplicates.add(a['id'])
                self.ids.add(a['id'])
              if a.get('href','').startswith('#'):self.anchors.append(a['href'][1:])
          for name in ('index.html','methodology.html','roadmap.html'):
            src=Path('docs',name).read_text()
            stage=Path('docs/staging',name).read_text()
            p,s=Tags(),Tags();p.feed(src);s.feed(stage)
            assert not s.duplicates,(name,s.duplicates)
            assert p.ids==s.ids,(name,'canonical IDs must match')
            assert set(s.anchors).issubset(s.ids),(name,'bad fragment anchors')
            assert 'href="staging/' in stage,(name,'stage links absent')
          print('PASS_EDITORIAL_STAGE_SAME_PRODUCTION_CONTENT_WITH_STAGE_NAV')
          PY
      - name: Verify current public HTML bytes
        run: |
          set -euo pipefail
          base=https://toodataa-ai.github.io/keiba-notes/staging
          for i in $(seq 1 30);do
            ok=1
            for name in index.html methodology.html roadmap.html;do
              if ! curl -fsSL --max-time 20 "$base/$name?editorial=$GITHUB_RUN_ID-$i" -o /tmp/editorial-html ||
                 ! cmp -s "docs/staging/$name" /tmp/editorial-html;then ok=0;break;fi
            done
            if [[ $ok == 1 ]];then echo PASS_EDITORIAL_STAGE_ALL_PUBLIC_BYTES;exit 0;fi
            sleep 8
          done
          echo '::error::Stage editorial public bytes mismatch';exit 1

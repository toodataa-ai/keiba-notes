name: Maintain JRA this-week staging as production-appearance mirror
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/jra-build-staging-week-mirror-v1.py'
      - '.github/workflows/jra-staging-week-mirror-publish.yml'
      - 'docs/this-week.html'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: jra-stage-week-mirror-sync
  cancel-in-progress: false
jobs:
  sync-staging-presentation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0, persist-credentials: true}
      - name: Validate shared production template, no staging-only controls
        run: |
          set -euo pipefail
          python3 .github/scripts/jra-build-staging-week-mirror-v1.py
          python3 .github/scripts/jra-build-staging-week-mirror-v1.py --check
          python3 - <<'PY'
          from pathlib import Path
          prod=Path('docs/this-week.html').read_text()
          stage=Path('docs/staging/this-week.html').read_text()
          for k in ('id="weekPredictions"','id="weekSchedule"','class="race-list"'):
            assert prod.count(k)==stage.count(k),(k,prod.count(k),stage.count(k))
          assert 'stagingJraReports' not in stage
          assert stage.count('id="jra-staging-report-link-override"')==1
          assert 'jra-staging-report-link-override' not in prod
          assert 'noindex' not in prod
          assert 'noindex' in stage
          print('PASS_JRA_STAGE_EXACT_PROD_TEMPLATES')
          PY
      - name: Idempotent stage-only sync if future production template changes
        run: |
          set -euo pipefail
          git add -- docs/staging/this-week.html
          if git diff --cached --quiet -- docs/staging/this-week.html;then
            echo 'PASS_JRA_STAGE_ALREADY_SAME_AS_PRODUCTION'
          else
            test "$(git diff --cached --name-only)" = "docs/staging/this-week.html"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Synchronize exact JRA production UI template to staging'
            for try in 1 2 3 4 5;do
              if git push origin HEAD:main;then break;fi
              test "$try" -lt 5 || exit 1
              git fetch origin main
              git rebase origin/main || { git rebase --abort;exit 1; }
              python3 .github/scripts/jra-build-staging-week-mirror-v1.py --check
              sleep 3
            done
          fi
      - name: Verify public staging HTTP byte-match
        run: |
          set -euo pipefail
          url='https://toodataa-ai.github.io/keiba-notes/staging/this-week.html'
          for try in $(seq 1 35);do
            if curl -LfsS --max-time 20 "$url?stage-mirror=$GITHUB_RUN_ID" -o /tmp/jra-stage-week-mirror &&
               cmp -s docs/staging/this-week.html /tmp/jra-stage-week-mirror;then
              echo "PASS_JRA_THIS_WEEK_EXACT_PROD_APPEARANCE_STAGING_HTTP $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging mirror saved but public bytes not verified";exit 1

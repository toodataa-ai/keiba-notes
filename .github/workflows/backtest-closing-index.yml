name: Backtest closing index v1.1

on:
  push:
    branches: [main]
    paths:
      - 'closing_index_v1/**'
      - '.github/workflows/backtest-closing-index.yml'
  pull_request:
    paths:
      - 'closing_index_v1/**'
      - '.github/workflows/backtest-closing-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pytest kagglehub

      - name: Unit tests
        working-directory: closing_index_v1
        run: pytest -q

      - name: Run leakage-safe ACI v1.1 next-start backtest
        run: |
          python closing_index_v1/backtest_v1_1.py \
            --data-start-year 2014 \
            --fit-start-year 2015 \
            --fit-end-year 2018 \
            --test-start-year 2019 \
            --test-end-year 2021 \
            --output closing_index_v1/backtest_result_v1_1.json \
            --model-output closing_index_v1/model_params_v1_1.json

      - name: Upload ACI v1.1 backtest result and fitted model
        uses: actions/upload-artifact@v4
        with:
          name: closing-index-v1-1-backtest
          path: |
            closing_index_v1/backtest_result_v1_1.json
            closing_index_v1/model_params_v1_1.json
          if-no-files-found: error

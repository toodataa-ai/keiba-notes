name: Baba research - list JMA stations near Nakayama (Chiba) and Hanshin (Hyogo) racecourses (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Test candidate stations on three dates
        run: |
          python - <<'PY'
          import time, requests
          from bs4 import BeautifulSoup
          UA={'User-Agent':'keiba-notes track-condition research/1.0'}
          cands=[('船橋',45,'1236','a1'),('西宮',63,'1588','a1'),('芦屋',63,'1449','a1'),('名塩',63,'0622','a1'),('三田',63,'0969','a1'),('神戸空港',63,'1587','a1'),('大阪',62,'47772','s1'),('千葉',45,'47682','s1')]
          for name,prec,block,kind in cands:
              for d in ('2018-06-10','2021-06-10','2025-06-10'):
                  y,m,dd=d.split('-')
                  url=f'https://www.data.jma.go.jp/stats/etrn/view/hourly_{kind}.php?prec_no={prec}&block_no={block}&year={y}&month={int(m)}&day={int(dd)}&view='
                  time.sleep(1)
                  r=requests.get(url,headers=UA,timeout=30); r.encoding=r.apparent_encoding
                  s=BeautifulSoup(r.text,'html.parser')
                  rows=[[td.get_text(' ',strip=True) for td in tr.find_all('td')] for tr in s.find_all('tr')]
                  rows=[c for c in rows if c and c[0].isdigit() and len(c)>=9]
                  blank=sum(1 for c in rows for x in c[1:] if '///' in x)
                  print('RES',name,block,d,'rows',len(rows),'ncols',len(rows[0]) if rows else 0,'missing-cells',blank,'noon',rows[12][:10] if len(rows)>12 else '')
          PY

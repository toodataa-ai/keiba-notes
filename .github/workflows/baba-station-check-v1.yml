name: Baba research - list JMA stations near Nakayama (Chiba) and Hanshin (Hyogo) racecourses (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: List stations and test one day each
        run: |
          python - <<'PY'
          import re, time, requests
          from bs4 import BeautifulSoup
          UA={'User-Agent':'keiba-notes track-condition research/1.0'}
          for name,prec in (('千葉',45),('兵庫',63)):
              url=f'https://www.data.jma.go.jp/stats/etrn/select/prefecture.php?prec_no={prec}&block_no=&year=&month=&day=&view='
              r=requests.get(url,headers=UA,timeout=30); r.encoding=r.apparent_encoding
              s=BeautifulSoup(r.text,'html.parser'); print('=====',name,prec,r.status_code)
              for a in s.select('area'):
                  href=a.get('href',''); m=re.search(r'prec_no=(\d+)&block_no=(\d+)',href)
                  kind='s1' if 'hourly_s1' in href else ('a1' if 'hourly_a1' in href else '?')
                  if m: print(' ',a.get('alt'),m.group(1),m.group(2),kind)
          PY

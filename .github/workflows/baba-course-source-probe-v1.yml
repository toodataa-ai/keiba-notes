name: Baba research - where is the turf course (A-D) setting published? (read only, few requests)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Find baba overview pages and their course tables
        working-directory: baba_models_v2
        run: |
          python - <<'PY'
          import re, time, requests
          from bs4 import BeautifulSoup
          import jra_observations as j
          H={'User-Agent':j.UA}
          def get(u):
              time.sleep(2); r=requests.get(u,headers=H,timeout=40); r.encoding=r.apparent_encoding; return r
          for y in (2018,2020,2024):
              r=get(j.archive_url(y)); print('####archive',y,r.status_code,r.url)
              s=BeautifulSoup(r.text,'html.parser')
              hs=sorted({a['href'] for a in s.find_all('a',href=True) if 'overview' in a['href']})
              print('  overview links',len(hs),hs[:12])
          for u in ['https://www.jra.go.jp/keiba/baba/overview/','https://www.jra.go.jp/keiba/baba/overview/2024_2-3_tokyo.html','https://www.jra.go.jp/keiba/baba/overview/2018_1-2_tokyo.html','https://www.jra.go.jp/keiba/baba/overview/2019_1-2_tokyo.html']:
              r=get(u); print('####',u,r.status_code,len(r.text))
              if r.status_code!=200: continue
              s=BeautifulSoup(r.text,'html.parser')
              for a in sorted({a['href'] for a in s.find_all('a',href=True) if 'overview' in a['href']})[:12]: print('  LINK',a)
              k=r.text.find('使用コース'); print('  RAW',re.sub(r'\s+',' ',r.text[k-100:k+1400]))
              print('  TITLE',s.title.get_text(strip=True) if s.title else '')
          PY

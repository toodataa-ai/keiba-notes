name: Sim v2 upcoming races (LAB research; abilities for today's 11R, no odds, no formal prediction)
on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated YYYY-MM-DD (default: today JST)'
        required: false
  schedule:
    # 土日月 09:05 JST（出馬表の保存 08:40 のあと）。Claude の T2 からも起動する
    - cron: '5 0 * * 6,0,1'
permissions:
  contents: write
concurrency:
  group: sim-v2-upcoming
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check private data token
        env:
          T: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: test -n "$T" || { echo 'PRIVATE_DATA_TOKEN is not set'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toodataa-ai/keiba-notes-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - name: Build upcoming abilities
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.dates }}"
          [ -n "$D" ] || D=$(TZ=Asia/Tokyo date +%F)
          python3 -m sim_v2.upcoming --data private/data_v2 --dates "$D"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lab/sim-v2/upcoming.json 2>/dev/null || true
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -m "LAB: シミュレータv2 当日のレースの能力値を更新"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

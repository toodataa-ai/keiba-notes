name: Probe JRA v3.10 official and odds sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-jra-live-v310.yml'
      - '.github/scripts/probe-jra-live-v310.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python .github/scripts/probe-jra-live-v310.py

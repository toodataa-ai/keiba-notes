name: Collection status v1 (count collected data for the public status page, no Claude usage)
on:
  workflow_dispatch:
  schedule:
    # 6時間おき（取得処理 sire-db-crawl / race-pages-crawl の少しあと）。GitHub の定時は遅れることがある
    - cron: '53 */6 * * *'
permissions:
  contents: write
concurrency:
  group: collection-status
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check private data token
        env:
          T: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: test -n "$T" || { echo 'PRIVATE_DATA_TOKEN is not set'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toodataa-ai/keiba-notes-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test
        run: python3 -m unittest sire_db_v1.test_collection_stats -v
      - name: Count, refresh the research-status numbers, commit (numbers only; no names or records are written)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -m sire_db_v1.collection_stats --data private/data_v2
            # 「予想の改善状況」ページの取得数も同じ数字に合わせる（件数だけ更新。検証結果の文はそのまま）
            python3 -m sire_db_v1.research_status --data private/data_v2
            python3 e2e_validation/improvement_pipeline_v1.py
            git add docs/data/collection_status_v1.json docs/data/collection_history_v1.json docs/data/sire_research_status_v1.json docs/data/jra_improvement_pipeline_v1.json
            if git diff --cached --quiet; then echo 'no change'; exit 0; fi
            git commit -q -m "データ収集の状況：件数を更新（改善状況ページの取得数も同じ数字に）"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i*3))
          done
          echo 'Could not push'; exit 1

name: Collection status v1 (count collected data for the public status page, no Claude usage)
on:
  workflow_dispatch:
  schedule:
    # 6時間おき（取得処理 sire-db-crawl / race-pages-crawl の少しあと）。GitHub の定時は遅れることがある
    - cron: '53 */6 * * *'
permissions:
  contents: write
concurrency:
  group: collection-status
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check private data token
        env:
          T: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: test -n "$T" || { echo 'PRIVATE_DATA_TOKEN is not set'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toodataa-ai/keiba-notes-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test
        run: python3 -m unittest sire_db_v1.test_collection_stats -v
      - name: Count (numbers only; no names or records are written)
        run: python3 -m sire_db_v1.collection_stats --data private/data_v2
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/collection_status_v1.json docs/data/collection_history_v1.json
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -m "データ収集の状況：件数を更新"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

name: JRA v3.10 prestart forecast plus complete approved PDF
on:
  push:
    branches: [main]
    paths:
      - 'e2e_validation/inputs/*.json'
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Audited prereace STEP1 + exact odds catalog (e2e_validation/inputs/*.json)'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: jra-v310-prestart-proof
  cancel-in-progress: false
jobs:
  prestart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v3.10 new + inherited regression tests
        run: |
          node .github/scripts/test-jra-prestart-pipeline-v310.mjs
          node .github/scripts/test-jra-portfolio-v310.mjs
          node .github/scripts/test-jra-strategy-v39.mjs
          node .github/scripts/validate-jra-portfolio-prompt-v310.mjs
      - name: Validate path and reserve immutable snapshot names
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t NEW_FILES < <(git diff --diff-filter=A --name-only "$BEFORE_SHA" "$AFTER_SHA" -- e2e_validation/inputs)
            if [[ ${#NEW_FILES[@]} -ne 1 ]]; then
              echo "::error::Exactly one newly created JRA input JSON is required per push, got ${#NEW_FILES[@]}"; exit 1
            fi
            INPUT_PATH="${NEW_FILES[0]}"
          fi
          case "$INPUT_PATH" in e2e_validation/inputs/*.json) ;; *) echo "::error::Input must be a tracked prereace JSON under e2e_validation/inputs"; exit 1;; esac
          if [[ "$INPUT_PATH" == *..* ]] || [[ ! -f "$INPUT_PATH" ]] || [[ -L "$INPUT_PATH" ]]; then
            echo "::error::Unsafe or missing race input"; exit 1
          fi
          RACE_ID=$(node -e "const o=require('./'+process.argv[1]);if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$/.test(o.race_id||''))process.exit(1);console.log(o.race_id)" "$INPUT_PATH")
          REL="v3.10-run${RUN_ID}-attempt${ATTEMPT}.json"
          SNAPSHOT="e2e_validation/snapshots/${RACE_ID}/${REL}"
          PREDICTION="e2e_validation/predictions/${RACE_ID}/${REL}"
          REPORT="docs/reports/$RACE_ID.html"
          PDF="docs/pdfs/$RACE_ID.pdf"
          if [[ -e "$REPORT" || -e "$PDF" ]];then echo "::error::Prior official report/PDF exists; cannot overwrite";exit 1;fi
          python3 - "$RACE_ID" <<'PY'
          import json,sys
          from pathlib import Path
          registry=json.loads(Path('docs/data/races.json').read_text())
          if any(r['id']==sys.argv[1] for r in registry['races']):raise SystemExit('BLOCKER: race already published')
          PY
          if [[ -e "$SNAPSHOT" || -e "$PREDICTION" ]]; then
            echo "::error::Immutable snapshot/prediction path already occupied"; exit 1
          fi
          {
            echo "INPUT_PATH=$INPUT_PATH"
            echo "SNAPSHOT=$SNAPSHOT"
            echo "PREDICTION=$PREDICTION"
            echo "REPORT=$REPORT"
            echo "PDF=$PDF"
          } >> "$GITHUB_ENV"
      - name: Install exactly approved JRA PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
          python -m pip install -q weasyprint==68.0 pymupdf==1.26.4
      - name: Generate and audit the complete unsealed betting snapshot
        run: |
          set -euo pipefail
          node .github/scripts/jra-prestart-pipeline-v310.mjs --input "$INPUT_PATH" --output "$SNAPSHOT"
          node -e "const p=require('./'+process.argv[1]);if(p.stage!=='pending_git_proof'||p.proof_commit!==null||p.prompt_version!=='v3.10')process.exit(1)" "$SNAPSHOT"
      - name: Test full original HTML/PDF against approved reader-v1 layout before freezing
        run: |
          set -euo pipefail
          python3 - "$SNAPSHOT" /tmp/jra-v310-layout-only.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));d['stage']='formal_prestart';d['proof_commit']='a'*40
          with open(sys.argv[2],'w') as f:json.dump(d,f,ensure_ascii=False)
          PY
          python3 .github/scripts/jra-render-live-v310.py /tmp/jra-v310-layout-only.json "$REPORT"
          python -m weasyprint "$REPORT" /tmp/jra-v310-layout-only.pdf
          python3 .github/scripts/validate-jra-pdf-layout.py --html "$REPORT" --pdf /tmp/jra-v310-layout-only.pdf --policy docs/data/jra_pdf_layout_policy_v1.json
      - name: Freeze snapshot in a real Git commit before race start
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SNAPSHOT"
          git commit -m "Freeze prereace JRA v3.10 audit and final_bets snapshot"
          git push origin HEAD:main
          PROOF=$(git rev-parse HEAD)
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          echo "Recorded immutable prereace snapshot $SNAPSHOT in $PROOF"
      - name: Seal final prediction with existing Git proof
        run: |
          set -euo pipefail
          node .github/scripts/jra-prestart-pipeline-v310.mjs --seal "$SNAPSHOT" --proof-commit "$PROOF" --output "$PREDICTION"
          node .github/scripts/validate-jra-portfolio-v310.mjs
          node .github/scripts/validate-jra-portfolio-prompt-v310.mjs
      - name: Generate final PDF from immutable proof, validate every page and append public registry
        run: |
          set -euo pipefail
          python3 .github/scripts/jra-render-live-v310.py "$PREDICTION" "$REPORT"
          python -m weasyprint "$REPORT" "$PDF"
          python3 .github/scripts/validate-jra-pdf-layout.py --html "$REPORT" --pdf "$PDF" --policy docs/data/jra_pdf_layout_policy_v1.json
          python3 .github/scripts/jra-publish-live-v310.py "$PREDICTION"
      - name: Commit only new prediction PDF HTML and appended race registry
        run: |
          set -euo pipefail
          git add -- "$PREDICTION" "$REPORT" "$PDF" docs/data/races.json
          python3 - "$PREDICTION" "$REPORT" "$PDF" <<'PY'
          import subprocess,sys
          expected=set(sys.argv[1:])|{'docs/data/races.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual!=expected:raise SystemExit('BLOCKER: unexpected historical file changes: '+str(actual^expected))
          PY
          git commit -m "Publish validated v3.10 full JRA original prediction HTML PDF and public registry"
          git push origin HEAD:main
          echo "PUBLISHED_JRA_V310_JSON_HTML_PDF $RACE_ID proof=$PROOF"

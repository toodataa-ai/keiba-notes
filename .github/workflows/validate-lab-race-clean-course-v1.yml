name: LAB Umapot SVG turf mask and uniform direct-running numbers acceptance
on:
  push:
    branches: [main]
    paths:
      - 'docs/lab/race-clean-course-*'
      - 'docs/lab/race-clean-turf-mask-v1.js'
      - 'docs/lab/assets/kyoto-umapot-course-clean-v8.svg'
      - 'tools/test_race_clean_course_v1.cjs'
      - '.github/workflows/validate-lab-race-clean-course-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Data untouched, geometry/lane/layout tests
        run: |
          set -euo pipefail
          for f in docs/lab/race-clean-course*.js;do node --check "$f";done
          node tools/test_race_clean_course_v1.cjs
          python3 .github/scripts/staging-baseline-v2.py --check
          python3 - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines())
          for p in files:
            assert not p.startswith(('docs/data/','docs/reports/','docs/pdfs/','docs/staging/','e2e_validation/','local_racing_shadow_v1/')),p
          print('PASS_CLEAN_LAB_UI_ONLY_NO_STAGING_NO_FORMAL_BETS')
          PY
      - name: Playwright
        run: |
          python3 -m pip install playwright==1.56.0
          command -v google-chrome || command -v chromium
      - name: Verify readable true-position 18 horse numbers at nine race sections on mobile and desktop
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-lab
          python3 -m http.server 8765 --directory docs >/tmp/clean-lab-server.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          import shutil
          from playwright.sync_api import sync_playwright
          exe=shutil.which('google-chrome') or shutil.which('chromium')
          assert exe
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=exe,args=['--no-sandbox'])
            for width in (390,1024):
              for d in (0,100,310,478,530,900,909,1270,1672,1900):
                page=browser.new_page(viewport={'width':width,'height':900},device_scale_factor=2)
                errors=[]
                page.on('pageerror',lambda error:errors.append(str(error)))
                page.goto(f'http://127.0.0.1:8765/lab/race-clean-course-v1.html?checkpoint={d}',wait_until='load')
                page.wait_for_function('window.CleanLab?.getState()?.horses?.length===18',timeout=12000)
                page.wait_for_function("() => {const a=window.CleanLab?.inspect?.();return a?.turfReady || a?.turfError}",timeout=15000)
                diagnostic=page.evaluate("() => {const a=CleanLab.inspect();return {turfReady:a.turfReady,turfError:a.turfError,turfStats:a.turfStats,source:a.originalImageSrc}}")
                print('TURF_MASK_BOOT_AUDIT',width,d,diagnostic)
                assert not diagnostic['turfError'],('TURF_IMAGE_REGISTRATION_FAILED',width,d,diagnostic)
                read=page.evaluate("""() => {
                  const a=CleanLab.inspect(),c=RaceCleanCourse;
                  const sim=CleanLab.getState();
                  const live=document.getElementById('broadcast');
                  const full=document.getElementById('overview');
                  return {count:a.positions.length,sourceCalls:a.imageCalls,
                    leader:a.leader,courseSeg:a.section,straightSpans:a.fixedSegments,
                    running:sim.horses.length,inside:sim.horses.filter(h=>h.lane<=3.45).length,
                    live:live.width,full:full.width,canvasCSS:live.getBoundingClientRect().width,
                    imageElements:document.querySelectorAll('img').length,
                    liveImageLoaded:a.liveImageLoaded,liveImageSrc:a.liveImageSrc,
                    vectorReady:a.vectorReady,highResolutionMode:a.highResolutionMode,
                    severeOverlapPairs:a.severeOverlapPairs,touchingPairs:a.touchingPairs,
                    actualNumberCircles:a.actualNumberCircles,
                    paintedTrack:a.paintedTrack,leaderLines:a.leaderLines,
                    originalImageSrc:a.originalImageSrc,
                    originalLoaded:a.originalLoaded,mapAspect:a.mapAspect,zoom:a.zoom,
                    selectedVisible:a.selectedVisible,selectedScreen:a.selectedScreen,
                    labelCoords:a.liveLabelPositions,selectedHorse:a.selectedHorse,
                    inwardMoves:a.inwardMoves,commonLaneController:a.commonLaneController,
                    directMarkerMaxError:a.directMarkerMaxError,
                    turfReady:a.turfReady,turfError:a.turfError,
                    turfBadCenters:a.turfBadCenters,turfBadDiscs:a.turfBadDiscs,
                    uniformMarkerRadiusPx:a.uniformMarkerRadiusPx,
                    markerRadiusSpreadPx:a.markerRadiusSpreadPx,
                    focusedMarkerRadiusPx:a.focusedMarkerRadiusPx};
                }""")
                assert not errors,(width,d,errors)
                assert read['count']==read['running']==18,(width,d,read)
                assert read['selectedVisible'],('FOCUSED_HORSE_OFF_CAMERA',width,d,read)
                assert read['leader']+3>=d,(width,d,read)
                assert read['sourceCalls']==1 and read['imageElements']==2,(width,d,read)
                assert read['liveImageLoaded'] and read['vectorReady'] and read['turfReady'],('VECTOR_TURF_MASK_NOT_READY',width,d,read)
                assert read['turfBadCenters']==0,('HORSE_CENTER_OFF_GREEN_SOURCE',width,d,read)
                assert read['turfBadDiscs']==0,('HORSE_BADGE_PARTLY_OFF_GREEN_SOURCE',width,d,read)
                assert read['highResolutionMode']=='publisher-original-svg-not-resampled-jpeg',(width,d,read)
                assert read['originalImageSrc']==read['liveImageSrc'],('TWO_DIFFERENT_COURSE_IMAGES',width,d,read)
                assert read['actualNumberCircles'] and not read['paintedTrack'] and not read['leaderLines']
                assert read['originalLoaded'],('UMAPOT_ORIGINAL_IMAGE_UNAVAILABLE',width,d,read)
                assert 'assets/kyoto-umapot-course-clean-v8.svg' in read['originalImageSrc']
                assert abs(read['mapAspect']-620/430)<.03,(width,d,read)
                assert 2.25<=read['zoom']<=9.65,(width,d,read)
                assert read['live']>=read['canvasCSS'],(width,d,read)
                assert read['inside']>=8 if d>=100 else True,(width,d,read)
                assert read['commonLaneController'],('SHARED_KYOTO1400_ENGINE_MISSING',width,d)
                assert read['inwardMoves']>=5 if d>=100 else True,(width,d,read)
                labels=read['labelCoords']
                assert len(labels)>=1,('NO_MOVING_NUMBERS',width,d)
                error=max((((a['x']-a['anchorX'])**2+
                    (a['y']-a['anchorY'])**2)**.5 for a in labels),default=0)
                assert error<1e-6,('NUMBER_MUST_BE_AT_HORSE_POSITION',width,d,error)
                focused=[a for a in labels if a['number']==read['selectedHorse']]
                assert len(focused)==1,('FOCUSED_HORSE_NUMBER_HIDDEN',width,d)
                assert read['markerRadiusSpreadPx']<1e-7,('UNEQUAL_NUMBER_DIAMETERS',width,d,read)
                assert abs(focused[0]['r']-read['uniformMarkerRadiusPx'])<1e-7,('FOCUSED_NUMBER_OVERSIZED',width,d,read)
                assert abs(read['focusedMarkerRadiusPx']-read['uniformMarkerRadiusPx'])<1e-7,('GOLD_OUTLINE_ENLARGED_NUMBER',width,d,read)
                if d>=310:
                  assert read['severeOverlapPairs']<=7,('SEVERE_BADGE_OCCLUSION',width,d,read['severeOverlapPairs'])
                print('PASS_SOURCE_IMAGE_TURF_GREEN_AND_UNIFORM_NUMBER',width,d,'error',error,
                    'radius',read['uniformMarkerRadiusPx'],
                    'spread',read['markerRadiusSpreadPx'],
                    'severe',read['severeOverlapPairs'],'touching',read['touchingPairs'])
                page.locator('#broadcast').screenshot(path=f'/tmp/clean-lab/live-{width}-{d}.png')
                page.locator('#overview').screenshot(path=f'/tmp/clean-lab/overview-{width}-{d}.png')
                print('PASS_ORIGINAL_BITMAP_AND_NUMBER_RUNNERS_REAL_BROWSER_18',width,d,read['inside'])
                page.close()
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-green-boundary-v10-mobile-desktop
          path: /tmp/clean-lab/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Live Pages bytes reflect this commit
        run: |
          set -euo pipefail
          base=https://toodataa-ai.github.io/keiba-notes/lab
          for i in $(seq 1 28);do
            ok=1
            for f in race-clean-course-v1.html race-clean-course-v1.js race-clean-course-app-v1.js race-clean-turf-mask-v1.js race-clean-course-v1.css assets/kyoto-umapot-course-clean-v8.svg;do
              if ! curl -fLsS --max-time 20 "$base/$f?ci=$GITHUB_RUN_ID-$i" -o /tmp/clean-file ||
                ! cmp -s "docs/lab/$f" /tmp/clean-file;then ok=0;break;fi
            done
            if [[ "$ok" == 1 ]];then echo PASS_CLEAN_LAB_PUBLIC_BYTES;exit 0;fi
            sleep 8
          done
          echo '::error::Published LAB clean course has not caught up';exit 1

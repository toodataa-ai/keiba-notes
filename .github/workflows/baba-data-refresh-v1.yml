name: Baba data refresh v1 (weather / moisture / course / training table / going status, weekly; no Claude usage)
on:
  workflow_dispatch:
  schedule:
    # 毎週水曜 06:50 JST（週末の開催が出そろったあと。日々のレース一覧の追加（06:10）のあと）
    - cron: '50 21 * * 2'
permissions:
  contents: write
concurrency:
  group: baba-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf numpy==2.5.3 pandas==3.0.5 scikit-learn==1.9.1 scipy==1.18.1   # 判定の境目に近い競馬場が、ライブラリの版の違いで入れ替わらないよう、結果を確かめた版に固定
      - name: Unit tests
        working-directory: baba_models_v2
        run: python -m unittest test_refresh_baba_data test_jra_observations test_jra_course_overview test_jma_weather test_jra_going_labels
      - name: Refresh (gets only the recent part, merges it, rebuilds the training table and the going status)
        id: rb
        working-directory: baba_models_v2
        run: |
          set +e
          python refresh_baba_data.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baba_models_v2/weather baba_models_v2/observations baba_models_v2/going_labels baba_models_v2/stage_b baba_models_v2/model_registry.json docs/data/baba_model_registry.json docs/data/derived_refresh_v1.json
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -q -m "馬場の学習データと馬場予測の判定を最新のデータで作り直し（自動）"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i*3)); done
      - name: Fail if the refresh failed (the failure is recorded in derived_refresh_v1.json)
        if: ${{ steps.rb.outputs.code != '0' }}
        run: exit 1

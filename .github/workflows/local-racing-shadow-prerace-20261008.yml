name: Local Racing Shadow Pre-race Snapshot (2026-10-08)
on:
  schedule:
    - cron: '12,27,42 0 8 10 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-racing-shadow-publish
  cancel-in-progress: false
jobs:
  official-prerace-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Freeze all official pre-race snapshots (no JRA data)
        run: |
          if [ "$(TZ=Asia/Tokyo date +%F)" != "2026-10-08" ]; then
            echo "One-day 2026-10-08 research run only"; exit 0
          fi
          python local_racing_shadow_v1/generate_daily.py
      - name: Commit immutable snapshots BEFORE publishing audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_racing_shadow_v1/predictions
          if ! git diff --cached --quiet; then
            git commit -m "Freeze official local Shadow pre-race snapshots for 2026-10-08"
            git push
          fi
      - name: Verify committed proof, publish public mirror and manifest
        run: python local_racing_shadow_v1/publish_audit.py
      - name: Commit only audited local Shadow public artifacts
        run: |
          git add docs/data/local-racing-shadow docs/data/local_racing_shadow_public.json docs/data/local_racing_shadow_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish audited local Shadow snapshots for 2026-10-08"
            git push
          fi

name: Baba research - collect turf course (A-D) per meeting day from JRA baba overview pages (manual, low rate)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baba-course-overview-v1
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest test_jra_course_overview
        working-directory: baba_models_v2
      - name: Collect
        working-directory: baba_models_v2
        run: python jra_course_overview.py --labels-dir going_labels --out going_labels/turf_course_by_day.csv
      - name: Commit research data
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baba_models_v2/going_labels
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "馬場研究: 芝のA〜Dコースを開催日ごとにJRAの馬場概要ページから取得（研究用データ）"
          git pull --rebase origin main && git push origin HEAD:main

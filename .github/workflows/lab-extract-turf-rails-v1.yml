name: LAB extract actual Kyoto turf-inner/outer rail coordinates
on:
  push:
    branches: [main]
    paths:
      - 'tools/extract_turf_band_v1.py'
      - 'tools/audit_turf_band_pixels_v049.py'
      - 'docs/lab/race-turf-rails-kyoto-inner-2000-v1.json'
      - '.github/workflows/lab-extract-turf-rails-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract and print derived nonimage turf boundary coordinates
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tools/extract_turf_band_v1.py --output /tmp/kyoto-inner-rails.json --log-json
          python3 tools/audit_turf_band_pixels_v049.py
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/kyoto-inner-rails.json'))
          b=json.load(open('docs/lab/race-turf-rails-kyoto-inner-2000-v1.json'))
          assert a['rail_offsets']==b['rail_offsets'], 'linked source image changed; regenerate rail registry'
          print('PASS_LAB_RAIL_REGISTRY_EQUALS_CURRENT_SOURCE_EXTRACTION')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: derived-kyoto-inner-rails
          path: /tmp/kyoto-inner-rails.json
          retention-days: 14

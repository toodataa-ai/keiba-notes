name: Guard JRA stage-approved UI and auto-published race data
on:
  push:
    branches: [main, feature/jra-ui-approved-data-auto-v101]
    paths:
      - '.github/production-releases.json'
      - 'docs/data/production-releases.json'
      - 'docs/data/jra_release_channel_policy_v1.json'
      - 'docs/release-history.html'
      - '.github/workflows/validate-jra-release-channels-v1.yml'
      - '.github/scripts/jra-release-guard-v1.py'
  pull_request:
permissions:
  contents: read
jobs:
  release-channel-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce verified UI versions, approval boundary and independent auto JRA data updates
        run: |
          set -euo pipefail
          # Generic invariants for every approved release + pinned historical facts.
          python3 .github/scripts/jra-release-guard-v1.py
      - name: Verify publicly deployed latest release registry and its scope files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(python3 -c "import json;d=json.load(open('.github/production-releases.json'));print(' '.join(['docs/data/production-releases.json','docs/index.html','docs/staging/index.html','docs/release-history.html']+[f for f in d['releases'][-1]['scope_files'] if f not in ('docs/index.html',)]))")
          for attempt in $(seq 1 35);do
            ok=1
            for f in $FILES;do
              url="https://toodataa-ai.github.io/keiba-notes/${f#docs/}"
              if ! curl -LfsS --max-time 20 "$url" -o /tmp/jra-ui-release-http ||
                 ! cmp -s "$f" /tmp/jra-ui-release-http;then
                ok=0;break
              fi
            done
            if [[ $ok == 1 ]];then
              echo 'PASS_JRA_LATEST_PRODUCTION_RELEASE_HISTORY_AND_UI_HTTP_BYTES'
              exit 0
            fi
            sleep 10
          done
          echo '::error::Approved JRA UI/history did not match GitHub Pages bytes'
          exit 1

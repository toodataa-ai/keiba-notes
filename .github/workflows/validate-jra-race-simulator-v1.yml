          JS
      - name: Test one-runner Shuka demo in existing stage UI
        run: |
          set -euo pipefail
          node tools/test_race_sim_stage_v041_ui.cjs
      - name: Verify all simulator assets publicly match GitHub source bytes
        run: |
          set -euo pipefail
          files=(
            docs/staging/race-simulator.html
            docs/staging/race-simulator.css
            docs/staging/race-simulator.js
            docs/staging/race-sim-engine.js
            docs/staging/race-course-geometry-v1.js
            docs/staging/race-lane-ai-v1.js
            docs/staging/race-runner-style-v1.js
            docs/staging/race-ability-model-v1.js
            docs/staging/race-umapot-overlay-v1.js
            docs/staging/race-sim-manifest-v1.json
            docs/staging/stage-week-preview.js
            docs/staging/index.html
          )
          for attempt in $(seq 1 45);do
            ok=1
            for f in "${files[@]}";do
              url="https://toodataa-ai.github.io/keiba-notes/${f#docs/}"
              if ! curl -LfsS --max-time 20 "$url?sim=$GITHUB_RUN_ID" -o /tmp/jra-sim-stage-byte ||
                 ! cmp -s "$f" /tmp/jra-sim-stage-byte;then
                ok=0;break
              fi
            done
            if [[ "$ok" == 1 ]];then
              echo "PASS_SIM_TWELVE_PUBLIC_STAGE_ASSET_BYTE_MATCH"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Simulation UI is not byte-verified on public Pages'
          exit 1

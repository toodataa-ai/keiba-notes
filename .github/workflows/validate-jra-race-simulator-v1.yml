name: Validate stage JRA visual race simulator
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/race-sim-*'
      - 'docs/staging/race-lane-ai-v1.js'
      - 'docs/staging/race-course-geometry-v1.js'
      - 'docs/staging/race-simulator.*'
      - 'docs/staging/stage-week-preview.js'
      - 'docs/staging/index.html'
      - '.github/workflows/validate-jra-race-simulator-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: jra-race-simulator-stage, cancel-in-progress: true}
jobs:
  source-simulation-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax, existing source immutability
        run: |
          set -euo pipefail
          node --check docs/staging/race-course-geometry-v1.js
          node --check docs/staging/race-lane-ai-v1.js
          node --check docs/staging/race-sim-engine.js
          node --check docs/staging/race-simulator.js
          node --check docs/staging/stage-week-preview.js
          python3 .github/scripts/jra-build-staging-week-mirror-v1.py --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          data=json.loads(Path('docs/staging/race-sim-manifest-v1.json').read_text())
          assert data['schema_version']==1 and data['status']=='STAGING_RESEARCH_ONLY'
          assert len(data['races'])==2
          registry=json.loads(Path('docs/data/races.json').read_text())
          rows={r['id']:r for r in registry['races']}
          for item in data['races']:
            r=rows[item['id']]
            assert r['scope']=='jra-main' and r['date']==item['date']
            assert r['venue']==item['venue'] and r['field_size']==item['field_size']
            assert r['proof_commit'] and r['step1_fixed_at']
            assert Path('docs',item['report']).exists()
            assert item['field_size']==18
            assert item['course_variant']=='A'
            assert item['course_id'] in ('tokyo_turf_2000','kyoto_turf_outer_1400')
          for path,sha in {
            'docs/this-week.html':'c59b56117b0f46ff4cb2a756a51baf4b62b5c689',
            'docs/assets/week.js':'ad22854774a5a10626436bd938a661ba8261611d',
          }.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert actual==sha,(path,'production modified',actual)
          assert 'STAGING' in Path('docs/staging/race-simulator.html').read_text()
          assert 'Stage v0.6' in Path('docs/staging/race-simulator.html').read_text()
          assert 'race-simulator.js?v=20261012-6' in Path('docs/staging/race-simulator.html').read_text()
          assert 'race-simulator.html?race=' in Path('docs/staging/stage-week-preview.js').read_text()
          assert 'staging/race-simulator.html' in Path('docs/staging/index.html').read_text()
          print('PASS_SIM_STAGE_ONLY_TWO_SOURCE_VERIFIED_RACES_PROD_FROZEN')
          PY
      - name: Run deterministic engine and real-report DOM interaction tests
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26 >/dev/null
          node <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {JSDOM}=require('jsdom');
          const read=p=>fs.readFileSync(p,'utf8');
          const manifest=JSON.parse(read('docs/staging/race-sim-manifest-v1.json'));
          const db=JSON.parse(read('docs/data/races.json'));
          function mockCanvas(){
            const obj={};
            return new Proxy(obj,{get(target,key){
              if(key in target)return target[key];
              if(key==='canvas')return null;
              return (...args)=>{};
            },set(target,key,value){target[key]=value;return true;}});
          }
          async function testRace(entry){
            const html=read('docs/staging/race-simulator.html');
            const dom=new JSDOM(html,{url:'https://toodataa-ai.github.io/keiba-notes/staging/race-simulator.html?race='+entry.id,runScripts:'outside-only'});
            const w=dom.window;
            let tick=null;
            w.requestAnimationFrame=fn=>{tick=fn;return 1};
            w.cancelAnimationFrame=()=>{tick=null};
            w.HTMLCanvasElement.prototype.getContext=mockCanvas;
            w.HTMLElement.prototype.scrollIntoView=function(){};
            w.fetch=async path=>{
              const p=String(path);
              let data;
              if(p==='race-sim-manifest-v1.json')data=manifest;
              else if(p==='../data/races.json')data=db;
              else if(p==='../'+entry.report)data=read('docs/'+entry.report);
              else throw Error('Unapproved request '+p);
              return {ok:true,status:200,json:async()=>data,text:async()=>data};
            };
            w.eval(read('docs/staging/race-course-geometry-v1.js'));
            w.eval(read('docs/staging/race-lane-ai-v1.js'));
            const course=w.RaceCourseGeometry.get(entry.course_id);
            assert.ok(course,'official layout required');
            assert.equal(course.distance_m,entry.distance_m);
            assert.equal(course.turn,entry.turn);
            assert.ok(Math.abs(course.segments.at(-1).to-course.segments.at(-1).from-course.straight_m)<1e-7);
            const p0=w.RaceCourseGeometry.point(course,0,0);
            const p1=w.RaceCourseGeometry.point(course,course.distance_m,0);
            assert.ok(Math.hypot(p0.x-p1.x,p0.y-p1.y)>20);
            const heights=course.profile.map(q=>q[1]);
            assert.ok(Math.abs(Math.max(...heights)-Math.min(...heights)-course.elevation_range_m)<1e-6);
            const sampledHeadings=[0,.26,.54,.73,.92,1].map(frac=>w.RaceCourseGeometry.heading(course,frac*course.distance_m,0));
            assert.ok(sampledHeadings.some(x=>Math.abs(x-sampledHeadings[0])>1.1),'The sprite must rotate on bends');
            for(const d of [0,.22*course.distance_m,.66*course.distance_m,course.distance_m]){
              const p=w.RaceCourseGeometry.point(course,d,0);
              const p2=w.RaceCourseGeometry.point(course,d,w.RaceLaneAI.config(course).maxLane);
              assert.ok(Math.hypot(p.x-p2.x,p.y-p2.y)<=Math.min(...course.track_width_m),'all mapped lanes lie on published turf width');
            }
            assert.equal(w.document.getElementById('cameraSelect').value,'follow');
            const stages=course.segments.map(x=>x.kind);
            assert.ok(stages.includes('turn')&&stages.includes('straight'));
            const straightPos=course.distance_m-course.straight_m+3;
            assert.equal(w.RaceCourseGeometry.metrics(course,straightPos,0).isFinalStraight,true);
            const bendPos=course.segments.find(x=>x.kind==='turn').from+2;
            assert.ok(w.RaceCourseGeometry.metrics(course,bendPos,7).pathStretch>
              w.RaceCourseGeometry.metrics(course,bendPos,0).pathStretch);
            w.eval(read('docs/staging/race-sim-engine.js'));
            w.eval(read('docs/staging/race-simulator.js'));
            await new Promise(resolve=>setTimeout(resolve,80));
            assert.ok(w.RaceSimNumbers,'runner positions must be rendered as moving numbers');
            const raw=Array.from({length:entry.field_size},(_,i)=>({number:i+1,d:120+i*1.85,lane:i%8}));
            const origin=w.RaceCourseGeometry.point(course,raw[0].d,raw[0].lane);
            const projected=w.RaceSimNumbers.project(raw,course,origin,9.8,1000,470,5,1);
            assert.equal(projected.length,entry.field_size);
            assert.equal(new Set(projected.map(p=>p.number)).size,entry.field_size);
            for(const p of projected){
              const h=raw.find(r=>r.number===p.number);
              const actual=w.RaceCourseGeometry.point(course,h.d,h.lane);
              assert.ok(Math.abs(p.x-(500+9.8*(actual.x-origin.x)))<1e-7,'number exactly follows horse x');
              assert.ok(Math.abs(p.y-(470*.52+9.8*(actual.y-origin.y)))<1e-7,'number exactly follows horse y');
            }
            const renderedNumbers=[];
            const ctx=mockCanvas();
            let connectorCount=0;
            ctx.moveTo=()=>{connectorCount++};
            ctx.fillText=value=>{renderedNumbers.push(String(value))};
            const screenPoints=raw.map((h,i)=>({
              number:h.number,x:50+(i%9)*100,y:160+Math.floor(i/9)*100,
              focused:i===4,leading:i===0
            }));
            const painted=w.RaceSimNumbers.draw(ctx,screenPoints,1000,470,1000);
            assert.equal(painted.length,entry.field_size,'all 18 onscreen numbers must be drawn');
            assert.deepEqual(renderedNumbers.sort((a,b)=>+a- +b),raw.map(x=>String(x.number)));
            assert.equal(connectorCount,0,'no leader lines pointing to distant number labels');
            painted.forEach(p=>{
              const original=screenPoints.find(h=>h.number===p.number);
              assert.equal(p.x,original.x);
              assert.equal(p.y,original.y);
            });
            assert.equal(w.RaceSimNumbers.draw(ctx,[{number:18,x:-200,y:-200}],
              1000,470,355).length,0,'never relocate offscreen horse numbers');
            const center=w.RaceSimNumbers.marker(ctx,12,275,225,1,true,false);
            assert.equal(center.x,275);assert.equal(center.y,225);
            const closeCamera=w.RaceSimCamera.viewCamera('follow',1000,1000);
            const wideCamera=w.RaceSimCamera.viewCamera('followWide',1000,1000);
            const fullCamera=w.RaceSimCamera.viewCamera('overview',1000,1000);
            assert.ok(closeCamera.zoom>wideCamera.zoom && wideCamera.zoom>fullCamera.zoom,
              'follow must be closer than wide/overview');
            assert.ok(closeCamera.zoom>=13,'near camera magnifies exact horse number positions');
            assert.ok(Math.abs(45*closeCamera.zoom*closeCamera.spriteScale-closeCamera.horsePx)<1e-8);
            assert.ok(closeCamera.horsePx>=80,'desktop horses must be visible');
            const mobileCamera=w.RaceSimCamera.viewCamera('follow',375,1000);
            assert.ok(mobileCamera.zoom>30,'mobile chase camera enlarges spacing between actual runner coordinates');
            assert.ok(Math.abs(mobileCamera.spriteScale*45*mobileCamera.zoom*375/1000-51)<1e-7);
            const mobileOriginal=w.innerWidth;
            w.innerWidth=375;
            w.dispatchEvent(new w.Event('resize'));
            assert.equal(w.document.getElementById('raceCanvas').height,730,
              'mobile broadcast must show a taller viewport');
            w.innerWidth=mobileOriginal;
            w.dispatchEvent(new w.Event('resize'));
            assert.equal(w.document.getElementById('raceCanvas').height,470);
            const race=w.document.getElementById('raceSelect');
            const start=w.document.getElementById('startBtn');
            const ranks=w.document.querySelectorAll('.standing-row');
            assert.equal(race.value,entry.id);
            assert.equal(ranks.length,entry.field_size);
            assert.equal(start.disabled,false,'Start enabled after sealed source parsed');
            assert.match(w.document.getElementById('sourceInfo').textContent,/proof/);
            assert.match(w.document.getElementById('raceMeta').textContent,new RegExp(entry.distance_m));
            assert.equal(w.document.getElementById('meterFill').style.width,'0%');
            start.click();
            assert.equal(start.disabled,true);
            const camera=w.document.getElementById('cameraSelect');
            camera.value='overview';
            camera.dispatchEvent(new w.Event('change',{bubbles:true}));
            camera.value='followWide';
            camera.dispatchEvent(new w.Event('change',{bubbles:true}));
            camera.value='follow';
            camera.dispatchEvent(new w.Event('change',{bubbles:true}));
            assert.equal(typeof tick,'function');
            // Trigger browser animation frames; track progress must move.
            let t=1000;
            for(let k=0;k<175;k++){const f=tick;assert.equal(typeof f,'function');f(t);t+=34}
            assert.ok(Number.parseFloat(w.document.getElementById('meterFill').style.width)>2);
            const pause=w.document.getElementById('pauseBtn');
            pause.click();assert.equal(pause.textContent,'▶ 再開');
            const still=w.document.getElementById('meterFill').style.width;
            assert.equal(tick,null);
            assert.equal(w.document.getElementById('meterFill').style.width,still);
            pause.click();assert.equal(pause.textContent,'一時停止');
            const restart=w.document.getElementById('restartBtn');restart.click();
            assert.equal(start.disabled,true);
            assert.equal(Number.parseFloat(w.document.getElementById('meterFill').style.width),0);
            const engine=w.RaceSimEngine;
            const horses=[...ranks].map(x=>{
              const number=Number(x.querySelector('.saddle').textContent);
              const name=x.querySelector('.standing-name').textContent;
              return {number,name,mark:x.querySelector('.standing-mark').textContent,win_pct:6,pace_grade:'B'};
            });
            const source={...entry,horses};
            assert.equal(w.document.getElementById('courseMeasurements').textContent.includes(String(course.straight_m)),true);
            assert.equal(w.document.getElementById('courseMeasurements').textContent.includes(String(course.elevation_range_m)),true);
            engine.validData(source);
            const a=engine.create(source,{seed:18,pace:'M',bias:'neutral'});
            const b=engine.create(source,{seed:18,pace:'M',bias:'neutral'});
            const c=engine.create(source,{seed:56,pace:'H',bias:'outer'});
            for(let n=0;n<5000;n++){
              if(!a.state.finished)a.step(.05);
              if(!b.state.finished)b.step(.05);
              if(!c.state.finished)c.step(.05);
            }
            assert.ok(a.state.firstFinishTime>70 && a.state.firstFinishTime<175,'race duration physical plausibility');
            assert(a.state.finished&&b.state.finished&&c.state.finished);
            assert.deepEqual(a.standings().map(x=>[x.number,x.finishTime]),b.standings().map(x=>[x.number,x.finishTime]));
            assert.notDeepEqual(a.state.horses.map(x=>x.lane),c.state.horses.map(x=>x.lane));
            assert.equal(new Set(a.state.horses.map(x=>x.number)).size,entry.field_size);
            assert.ok(a.state.events.length>0);
            const lc=w.RaceLaneAI.config(course);
            for(const h of a.state.horses){
              assert.ok(h.lane>=-1e-6&&h.lane<=lc.maxLane+1e-6,'horse must stay between inside rail and outside limit');
              assert.ok(Number.isFinite(h.laneVelocity),'lane direction remains continuous');
            }
            assert.ok(a.state.totalInsideMoves>0,'at least one horse must find an inside racing line');
            assert.ok(a.state.totalLaneChanges>=a.state.totalInsideMoves,'lane changes counted');
            assert.ok(a.state.trafficHolds>=0);
            const dummies=[
              {number:1,d:250,lane:3,finished:false},
              {number:2,d:251,lane:2.1,finished:false},
              {number:3,d:242,lane:1.5,finished:false}
            ];
            assert.equal(w.RaceLaneAI.laneSafe(dummies[0],dummies,2,lc),false,'cannot cut across occupied adjacent lane');
            assert.equal(w.RaceLaneAI.laneSafe(dummies[0],dummies,4,lc),true,'can move into clear outside space');
            assert.ok(w.RaceLaneAI.throttle({d:250,lane:3},[{d:252,lane:3,finished:false}],1,.05,lc).held,
              'following runner must brake rather than pass through leader');
            w.close();
            console.log('PASS_SIM_' +entry.id+' _18_HORSES_PLAY_PAUSE_RESET_SEEDED_PHYSICS');
          }
          (async()=>{
            for(const item of manifest.races)await testRace(item);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify all simulator assets publicly match GitHub source bytes
        run: |
          set -euo pipefail
          files=(
            docs/staging/race-simulator.html
            docs/staging/race-simulator.css
            docs/staging/race-simulator.js
            docs/staging/race-sim-engine.js
            docs/staging/race-course-geometry-v1.js
            docs/staging/race-lane-ai-v1.js
            docs/staging/race-sim-manifest-v1.json
            docs/staging/stage-week-preview.js
            docs/staging/index.html
          )
          for attempt in $(seq 1 45);do
            ok=1
            for f in "${files[@]}";do
              url="https://toodataa-ai.github.io/keiba-notes/${f#docs/}"
              if ! curl -LfsS --max-time 20 "$url?sim=$GITHUB_RUN_ID" -o /tmp/jra-sim-stage-byte ||
                 ! cmp -s "$f" /tmp/jra-sim-stage-byte;then
                ok=0;break
              fi
            done
            if [[ "$ok" == 1 ]];then
              echo "PASS_SIM_NINE_PUBLIC_STAGE_ASSET_BYTE_MATCH"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Simulation UI is not byte-verified on public Pages'
          exit 1

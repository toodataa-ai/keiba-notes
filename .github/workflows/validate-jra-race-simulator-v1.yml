name: Validate LAB JRA visual simulator with immutable staging compatibility
on:
  push:
    branches: [main]
    paths:
      - 'docs/lab/race-*'
      - 'docs/lab/weekend-main-course-*'
      - 'docs/lab/jra-v315-20261012/**'
      - 'docs/staging/race-simulator.html'
      - 'docs/staging/weekend-main-course-review.html'
      - 'tools/test_race_sim_lab_kyoto_inner_v045.cjs'
      - 'tools/test_kyoto_broadcast_shared_map_v047.cjs'
      - 'tools/test_kyoto_inner_18_lane_v048.cjs'
      - '.github/workflows/validate-jra-race-simulator-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  code-and-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate LAB source JS, JSON and immutable production prediction data
        run: |
          set -euo pipefail
          for script in docs/lab/race-*.js docs/lab/weekend-main-course-review-v1.js docs/lab/stage-week-preview.js;do
            node --check "$script"
          done
          node --check tools/test_race_sim_lab_kyoto_inner_v045.cjs
          node --check docs/lab/race-broadcast-map-v1.js
          node --check tools/test_kyoto_broadcast_shared_map_v047.cjs
          node tools/test_kyoto_broadcast_shared_map_v047.cjs
          node tools/test_race_sim_lab_kyoto_inner_v045.cjs
          node --check tools/test_kyoto_inner_18_lane_v048.cjs
          node tools/test_kyoto_inner_18_lane_v048.cjs
          node --check docs/lab/race-turf-corridor-v1.js
          python3 .github/scripts/staging-baseline-v2.py --check
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          l=Path('docs/lab');s=Path('docs/staging')
          assert 'location.replace(' in (s/'race-simulator.html').read_text()
          assert 'LAB' in (l/'race-simulator.html').read_text()
          assert 'race-simulator.js' in (l/'race-simulator.html').read_text()
          assert 'race-umapot-overlay-v1.js' in (l/'race-simulator.html').read_text()
          assert 'race-simulator.html' not in Path('docs/staging/index.html').read_text()
          for name in ('race-course-geometry-v1.js',
            'race-sim-engine.js','race-lane-ai-v1.js',
            'weekend-main-course-blueprints-20261017.json'):
            assert (l/name).read_bytes()==(s/name).read_bytes(),name
          # LAB overlay is intentionally newer than the frozen legacy staging geometry.
          assert (l/'race-umapot-overlay-v1.js').read_bytes()!=(s/'race-umapot-overlay-v1.js').read_bytes()
          assert 'race-umapot-overlay-v1.js?v=20261018-49' in (l/'race-simulator.html').read_text()
          assert 'race-turf-corridor-v1.js?v=20261018-49' in (l/'race-simulator.html').read_text()
          assert (l/'race-turf-rails-kyoto-inner-2000-v1.json').is_file()
          assert 'race-broadcast-map-v1.js?v=20261018-47' in (l/'race-simulator.html').read_text()
          assert 'RaceSimBroadcastMap.draw({' in (l/'race-simulator.js').read_text()
          assert 'LAB_SYNTHETIC_NOT_OFFICIAL' in (l/'race-lab-18-fixture-v1.js').read_text()
          assert 'race-lab-18-fixture-v1.js?v=20261018-48' in (l/'race-simulator.html').read_text()
          for name in ('2026-10-12-october-stakes-three-plus-ana.pdf',
                       '2026-10-12-swan-stakes-three-plus-ana.pdf'):
            assert (l/'pdfs'/name).read_bytes()==(s/'pdfs'/name).read_bytes(),name
          for name in ('tokyo11.pdf','kyoto11.pdf'):
            assert (l/'jra-v315-20261012'/name).read_bytes()==(s/'jra-v315-20261012'/name).read_bytes()
          plan=json.loads((l/'weekend-main-course-blueprints-20261017.json').read_text())
          assert plan['safe_for_live_simulator'] is False
          assert plan['restrictions']['require_human_visual_acceptance'] is True
          assert (l/'data/three-plus-ana/2026-10-12-october-stakes.json').is_file()
          main=json.loads(Path('docs/data/races.json').read_text())
          assert len([r for r in main['races'] if r['id'].startswith('2026-10-17')])==3
          print('PASS_LAB_SIM_INDEPENDENT_GEOMETRY_PDF_PROOFS_PRODUCTION_RACE_REGISTRY_INTACT')
          PY
      - name: Ensure live LAB simulator exists at canonical URL
        run: |
          set -euo pipefail
          for i in $(seq 1 30);do
            if curl -fsSL --max-time 22 "https://toodataa-ai.github.io/keiba-notes/lab/race-simulator.html?audit=$GITHUB_RUN_ID-$i" -o /tmp/lab-simulator &&
              cmp -s docs/lab/race-simulator.html /tmp/lab-simulator;then
              echo PASS_LAB_SIM_PUBLIC_HTML_EXACT
              exit 0
            fi
            sleep 8
          done
          echo '::error::Public LAB simulator does not match GitHub source';exit 1

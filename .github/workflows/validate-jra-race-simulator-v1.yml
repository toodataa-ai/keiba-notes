name: Validate stage JRA visual race simulator
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/race-sim-*'
      - 'docs/staging/race-lane-ai-v1.js'
      - 'docs/staging/race-runner-style-v1.js'

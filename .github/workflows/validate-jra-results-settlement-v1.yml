name: Validate JRA results staging ticket settlement
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/results.html'
      - 'docs/staging/assets/results.js'
      - '.github/scripts/test-jra-results-settlement-v1.mjs'
      - '.github/workflows/validate-jra-results-settlement-v1.yml'
      - 'docs/data/races.json'
  pull_request:
    paths:
      - 'docs/staging/results.html'
      - 'docs/staging/assets/results.js'
      - '.github/scripts/test-jra-results-settlement-v1.mjs'
      - '.github/workflows/validate-jra-results-settlement-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settlement-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JRA outcome matching and historic settlement regressions
        run: node .github/scripts/test-jra-results-settlement-v1.mjs
      - name: Check preview isolation and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/staging/assets/results.js
          node --check .github/scripts/test-jra-results-settlement-v1.mjs
          grep -q 'staging/assets/results.js?v=20261013-readable-results-v105stage' docs/staging/results.html
          grep -q 'assets/results.js?v=' docs/results.html
          test -f docs/data/races.json
          echo PASS_JRA_PREVIEW_ISOLATION
      - name: Verify actual published staging HTML and JavaScript bytes
        shell: bash
        run: |
          set -euo pipefail
          base=https://toodataa-ai.github.io/keiba-notes
          # Pages deployment is asynchronous to push validation.
          for attempt in $(seq 1 45); do
            ok=1
            for file in staging/results.html staging/assets/results.js; do
              if ! curl -fLsS --max-time 15 "$base/$file" -o /tmp/jra-staging-results-http ||
                 ! cmp -s "docs/$file" /tmp/jra-staging-results-http; then
                ok=0
                break
              fi
            done
            if [[ "$ok" == 1 ]]; then
              echo PASS_JRA_STAGING_RESULTS_HTTP_BYTES
              exit 0
            fi
            sleep 10
          done
          echo '::error::Staging results deployment is not yet byte-identical to the approved GitHub preview'
          exit 1

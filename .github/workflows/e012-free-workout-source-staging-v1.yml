name: E012 free workout STAGING proof and prospective comparison QA (offline)
on:
  push:
    branches: [staging/e012-free-workout-source-v1]
    paths:
      - 'experience_regime_v1/free_workout_evidence_v1.py'
      - 'experience_regime_v1/test_free_workout_evidence_v1.py'
      - 'experience_regime_v1/workout_prestart_proof_v1.py'
      - 'experience_regime_v1/test_workout_prestart_proof_v1.py'
      - 'experience_regime_v1/workout_prospective_comparison_v1.py'
      - 'experience_regime_v1/test_workout_prospective_comparison_v1.py'
      - 'experience_regime_v1/workout_source_permission_v1.json'
      - '.github/workflows/e012-free-workout-source-staging-v1.yml'
      - '.github/workflows/e012-free-workout-prerace-research-v1.yml'
      - '.github/workflows/e012-free-workout-prestart-git-proof-v1.yml'
      - 'experience_regime_v1/FREE_WORKOUT_SOURCE_V1.md'
  pull_request:
    branches: [main]
    paths:
      - 'experience_regime_v1/**'
      - '.github/workflows/e012-free-workout-*.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  proof-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Show exactly which staging source files changed and reject production changes
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess
          modified=subprocess.check_output(
              ['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines()
          allowed={
             'experience_regime_v1/free_workout_evidence_v1.py',
             'experience_regime_v1/test_free_workout_evidence_v1.py',
             'experience_regime_v1/workout_prestart_proof_v1.py',
             'experience_regime_v1/test_workout_prestart_proof_v1.py',
             'experience_regime_v1/workout_prospective_comparison_v1.py',
             'experience_regime_v1/test_workout_prospective_comparison_v1.py',
             'experience_regime_v1/workout_source_permission_v1.json',
             '.github/workflows/e012-free-workout-source-staging-v1.yml',
             '.github/workflows/e012-free-workout-prerace-research-v1.yml',
             '.github/workflows/e012-free-workout-prestart-git-proof-v1.yml',
             'experience_regime_v1/FREE_WORKOUT_SOURCE_V1.md'
          }
          assert set(modified).issubset(allowed),('protected_racing_data_or_production_UI_modified',modified)
          print('PASS_ONLY_RESEARCH_STAGE_FILES_CHANGED',modified)
          PY
      - name: Parser, permission, future-prediction proofs (zero publisher network fetches)
        run: |
          set -euo pipefail
          python -m pip install -q beautifulsoup4 requests
          python -m py_compile \
             experience_regime_v1/free_workout_evidence_v1.py \
             experience_regime_v1/workout_prestart_proof_v1.py \
             experience_regime_v1/workout_prospective_comparison_v1.py
          python -m unittest -v \
             experience_regime_v1.test_free_workout_evidence_v1 \
             experience_regime_v1.test_workout_prestart_proof_v1 \
             experience_regime_v1.test_workout_prospective_comparison_v1 \
             experience_regime_v1.test_step1_factors_evidence_v1
      - name: Verify rights remain explicitly UNVERIFIED and automated Git proof is closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from experience_regime_v1.workout_prestart_proof_v1 import permission_gate
          p=json.loads(Path('experience_regime_v1/workout_source_permission_v1.json').read_text())
          assert p['default_decision']=='block_automated_git_commit_until_explicit_reuse_grant'
          assert p['sources'][0]['automatic_reuse']=='permission_unverified'
          try:
              permission_gate('https://umasiru.com/archives/22113',p)
          except PermissionError:
              print('PASS_RIGHTS_UNVERIFIED_NO_AUTOMATED_REUSE_OR_PUBLIC_CLOCK_EXPORT')
          else:
              raise AssertionError('permission_gate_bypassed')
          PY
      - name: Verify primary original JRA research audit still passes offline
        run: |
          set -euo pipefail
          python -m unittest -q experience_regime_v1.test_model
          echo "PASSED_OFFLINE_WITH_NO_RACE_MODEL_OR_RESULTS_MODIFICATION"

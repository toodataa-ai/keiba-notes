name: Inspect public geospatial track data (stage research)
on:
  push:
    paths:
      - '.github/workflows/staging-course-source-survey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect official JRA course images and OSM vector boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time,re
          targets=[
             ('tokyo',(35.657,139.473,35.671,139.501),'https://www.jra.go.jp/facilities/race/tokyo/course/img/pic_course_heimenzu.gif'),
             ('kyoto',(34.897,135.722,34.918,135.744),'https://www.jra.go.jp/facilities/race/kyoto/course/img/pic_course_heimenzu.gif')]
          for name,bbox,image in targets:
            print('VENUE',name,flush=True)
            try:
              with urllib.request.urlopen(urllib.request.Request(image,headers={'User-Agent':'course-staging-validation/1.0'}),timeout=12) as response:
                data=response.read(120)
              print('OFFICIAL_RASTER_GIF',image,'head',data[:16].hex(),'image_dims',int.from_bytes(data[6:8],'little'),int.from_bytes(data[8:10],'little'),flush=True)
            except Exception as ex: print('RASTER_FETCH_FAILED',str(ex)[:190],flush=True)
            bounds=','.join(str(v) for v in bbox)
            query='[out:json][timeout:23];(way["leisure"="track"]('+bounds+');way["sport"="horse_racing"]('+bounds+');way["landuse"="grass"]('+bounds+'););out geom;'
            endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass.private.coffee/api/interpreter']
            for server in endpoints:
              try:
                u=server+'?'+urllib.parse.urlencode({'data':query})
                with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'GitHubAction-CourseGeometryResearch/1.0'}),timeout=38) as response:
                  content=response.read(2800000)
                out=json.loads(content)
                results=out.get('elements',[])
                print('OSM_WAYS',name,server,len(results),flush=True)
                for r in results[:55]:
                  tag=r.get('tags',{});g=r.get('geometry',[])
                  if len(g)<4:continue
                  xs=[p['lon'] for p in g];ys=[p['lat'] for p in g]
                  span=[round(min(xs),6),round(min(ys),6),round(max(xs),6),round(max(ys),6)]
                  print('WAY',r.get('id'),'NODES',len(g),'TAGS',json.dumps(tag,ensure_ascii=False)[:200],'BBOX',span,flush=True)
                  if tag.get('sport')=='horse_racing' or tag.get('leisure')=='track':
                    print('SAMPLE_POINTS',json.dumps([[round(p['lon'],7),round(p['lat'],7)] for p in g[:120]]),flush=True)
                break
              except Exception as ex:print('OSM_FETCH_FAILED',name,server,str(ex)[:170],flush=True)
          PY

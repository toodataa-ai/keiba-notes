name: Validate JRA v3.11 balanced purchases and unlimited PDF pagination
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/validate-jra-balanced-v311.yml'
      - '.github/workflows/jra-prestart-pipeline-v311.yml'
      - 'docs/data/latest_prompt.json'
      - 'docs/data/prompt_history.json'
      - 'docs/data/jra_balanced_portfolio_policy_v1.json'
      - 'e2e_validation/manifests/v3.11.json'
      - '競馬予想_完全版プロンプト_v3.11.txt'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/validate-jra-balanced-v311.yml'
      - '.github/workflows/jra-prestart-pipeline-v311.yml'
      - 'docs/data/latest_prompt.json'
      - 'docs/data/prompt_history.json'
      - 'docs/data/jra_balanced_portfolio_policy_v1.json'
      - 'e2e_validation/manifests/v3.11.json'
      - '競馬予想_完全版プロンプト_v3.11.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balanced-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact approved A4 renderer and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python -m pip install -q 'weasyprint==68.0' 'pymupdf==1.26.4'
      - name: Check append-only prompt and all historical SHA pins
        run: |
          node .github/scripts/validate-jra-balanced-prompt-v311.mjs
          node .github/scripts/validate-prompt-history.mjs
          node .github/scripts/validate-jra-portfolio-prompt-v310.mjs
      - name: New v3.11 risk-and-profit selection test and inherited regression
        run: |
          node .github/scripts/test-jra-balanced-v311.mjs
          node .github/scripts/test-jra-prestart-pipeline-v311.mjs
          node .github/scripts/test-jra-portfolio-v310.mjs
          node .github/scripts/test-jra-strategy-v39.mjs
          node .github/scripts/test-jra-strategy-v38.mjs
          node .github/scripts/validate-jra-reader-v37.mjs
      - name: Stress unlimited A4 pages and exact candidate row completeness
        run: |
          python .github/scripts/test-jra-pdf-layout.py
          python .github/scripts/test-jra-pdf-dynamic-v311.py

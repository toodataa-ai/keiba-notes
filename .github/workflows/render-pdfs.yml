name: Render prediction PDFs

on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/**.html'
      - 'docs/assets/**'
      - '.github/scripts/render-pdfs.mjs'
      - '.github/workflows/render-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Render PDFs
        run: node .github/scripts/render-pdfs.mjs
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdfs
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Render prediction PDFs"
            git push
          fi

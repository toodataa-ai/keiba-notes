name: Render prediction PDFs

on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/**.html'
      # v3.3 snapshots use an isolated renderer; do not regenerate legacy PDFs.
      - '!docs/reports/v3.3-2026-10-10-*.html'
      - '!docs/reports/v3.4-2026-10-10-*.html'
      - 'docs/styled-report-sources/**'
      - 'docs/full-reports/**'
      - 'docs/data/races.json'
      - 'docs/assets/**'
      - '.github/scripts/render-pdfs.mjs'
      - '.github/scripts/validate-jra-pdf-layout.py'
      - 'docs/data/jra_pdf_layout_policy_v1.json'
      - '.github/workflows/render-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-pdfs-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before rendering
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python3 -m pip install 'weasyprint==68.0' 'pymupdf==1.26.4'
          python3 -m weasyprint --version
      - name: Restore, validate and render authored reports
        run: node .github/scripts/render-pdfs.mjs
      - name: Commit authored reports and PDFs safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/generated-reports /tmp/generated-pdfs
          mkdir -p /tmp/generated-reports /tmp/generated-pdfs
          cp -a docs/reports/. /tmp/generated-reports/
          cp -a docs/pdfs/. /tmp/generated-pdfs/
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/reports docs/pdfs
          # Stage ONLY newly created eligible reports and PDFs. Historical
          # predictions and prior PDFs must never be replaced by this job.
          python3 - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          races = json.loads(Path('docs/data/races.json').read_text())['races']
          policy = json.loads(Path('docs/data/jra_pdf_layout_policy_v1.json').read_text())
          for race in races:
              if race.get('scope') != 'jra-main' or race.get('date','') < policy['effective_jra_race_date_from']:
                  continue
              for key, temp in [('report','/tmp/generated-reports'),('pdf','/tmp/generated-pdfs')]:
                  rel = race.get(key)
                  if not rel:
                      raise RuntimeError('Missing '+key+' path for '+race['id'])
                  source = Path(temp) / Path(rel).relative_to('reports' if key=='report' else 'pdfs')
                  target = Path('docs') / rel
                  if not source.exists():
                      raise RuntimeError('Generated file missing: '+str(source))
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(source,target)
                  subprocess.run(['git','add','--',str(target)],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No authored report/PDF changes"
          else
            git commit -m "Render authored prediction reports and PDFs"
            git push origin HEAD:main
          fi

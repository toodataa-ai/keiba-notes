name: Render prediction PDFs

on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/**.html'
      - 'docs/full-reports/**'
      - 'docs/data/races.json'
      - 'docs/assets/**'
      - '.github/scripts/render-pdfs.mjs'
      - '.github/workflows/render-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-pdfs-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before rendering
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Restore, validate and render complete reports
        run: node .github/scripts/render-pdfs.mjs
      - name: Commit complete reports and PDFs safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/generated-reports /tmp/generated-pdfs
          mkdir -p /tmp/generated-reports /tmp/generated-pdfs
          cp -a docs/reports/. /tmp/generated-reports/
          cp -a docs/pdfs/. /tmp/generated-pdfs/
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/reports docs/pdfs
          cp -a /tmp/generated-reports/. docs/reports/
          cp -a /tmp/generated-pdfs/. docs/pdfs/
          git add docs/reports docs/pdfs
          if git diff --cached --quiet; then
            echo "No complete report/PDF changes"
          else
            git commit -m "Render complete prediction reports and PDFs"
            git push origin HEAD:main
          fi

name: E012 user-instructed one free workout source (research artifact only)
on:
  workflow_dispatch:
    inputs:
      week_id: {description: "Frozen week YYYY-MM-DD", required: true, type: string}
      race_id: {description: "Git-frozen race YYYY-MM-DD-venue-NN", required: true, type: string}
      start_at: {description: "Official start YYYY-MM-DDTHH:MM:SS+09:00", required: true, type: string}
      source_url: {description: "One public free workout article URL", required: true, type: string}
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require explicit workflow_dispatch, one URL and robots/attribution safeguards
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from experience_regime_v1.workout_prestart_proof_v1 import user_requested_single_article_gate
          policy=json.loads(Path('experience_regime_v1/workout_source_permission_v1.json').read_text())
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_ACTOR']
          user_requested_single_article_gate(os.environ['SOURCE_URL'],policy,
                                              request_id=os.environ['GITHUB_RUN_ID'])
          print('PASS_USER_TRIGGERED_ONE_PUBLIC_ARTICLE_NOT_SCHEDULED_HARVEST')
          PY
      - name: Install free parser dependencies
        run: python -m pip install -q requests beautifulsoup4
      - name: Capture one authorized prestart factual workout source without production changes
        shell: bash
        env:
          WEEK_ID: ${{ inputs.week_id }}
          RACE_ID: ${{ inputs.race_id }}
          START_AT: ${{ inputs.start_at }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          python -m unittest -q experience_regime_v1.test_free_workout_evidence_v1
          python -m experience_regime_v1.free_workout_evidence_v1 \
            --week-id "$WEEK_ID" --race-id "$RACE_ID" --start-at "$START_AT" \
            --source-url "$SOURCE_URL" --outdir /tmp/e012-free-workout
          python - <<'PY'
          import glob,json,os
          p=glob.glob('/tmp/e012-free-workout/*.json')
          assert len(p)==1
          x=json.load(open(p[0]))
          assert x['race_id']==os.environ['RACE_ID'] and x['before_post']
          assert x['no_odds_or_results_used'] and not x['production_effect']
          assert x['prediction_rank_grade_bets_unchanged']
          assert x['workout_factor_grades'] is None and not x['workout_score_calibrated']
          assert x['verified_horses']>0
          assert len(x['source']['html_sha256'])==64
          print('FREE_WORKOUT_RESEARCH_CAPTURE_PASS',x['race_id'],x['verified_horses'],x['roster_horses'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: free-workout-research-${{ github.run_id }}
          path: /tmp/e012-free-workout/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Explicit note on proof and production boundaries
        run: |
          echo 'RESEARCH ONLY: No Git first-introduction proof for workout evidence.'
          echo 'Not a formal forecast. No grades, final_bets, score, PDF or settlement updates.'
          echo 'After approval, a separate immutable prestart commit workflow is required.'

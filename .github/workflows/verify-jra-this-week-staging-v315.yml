name: Verify JRA this-week staging is current production appearance
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/this-week.html'
      - 'docs/this-week.html'
      - '.github/scripts/staging-baseline-v2.py'
      - '.github/workflows/verify-jra-this-week-staging-v315.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Exactly compare safe stage render with current production HTML
        run: |
          set -euo pipefail
          python3 .github/scripts/staging-baseline-v2.py --check --only=this-week.html
          node --check docs/assets/week.js
          node --check docs/assets/jra-inline-report.js
          python3 - <<'PY'
          from pathlib import Path
          prod=Path('docs/this-week.html').read_text()
          stage=Path('docs/staging/this-week.html').read_text()
          assert 'id="weekPredictions"' in prod and 'id="weekPredictions"' in stage
          assert 'assets/jra-inline-report.js' in stage
          assert 'staging/stage-week-preview.js' not in stage
          assert 'staging/stage-week-preview.js' not in prod
          assert '<base href="../">' in stage
          assert 'data-stage="preview"' in stage
          print('PASS_THIS_WEEK_EXACT_SAME_PROD_TEMPLATE_SCRIPTS_COMMON_DATA')
          PY
      - name: Verify actual public page byte parity
        run: |
          set -euo pipefail
          url=https://toodataa-ai.github.io/keiba-notes/staging/this-week.html
          for i in $(seq 1 30);do
            if curl -fsSL --max-time 22 "$url?week-audit=$GITHUB_RUN_ID-$i" -o /tmp/week-current-stage &&
               cmp -s docs/staging/this-week.html /tmp/week-current-stage;then
              echo PASS_THIS_WEEK_STAGING_REAL_HTTP_BYTE_EQUALITY
              exit 0
            fi
            sleep 8
          done
          echo '::error::Stage this-week public URL stale';exit 1

name: Verify JRA staging shares production appearance
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/this-week.html'
      - '.github/scripts/jra-build-staging-week-mirror-v1.py'
      - '.github/workflows/verify-jra-this-week-staging-v315.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  staging-only:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Compare production and stage template byte-exact after approved exceptions
        run: |
          set -euo pipefail
          python3 .github/scripts/jra-build-staging-week-mirror-v1.py --check
          node --check docs/assets/week.js
          python3 - <<'PY'
          from pathlib import Path
          prod=Path('docs/this-week.html').read_text()
          stage=Path('docs/staging/this-week.html').read_text()
          assert 'stagingJraReports' not in stage
          assert stage.count('class="staging-shell-marker"')==1
          assert stage.count('stage-week-preview.js')==1
          assert 'stage-week-preview.js' not in prod
          assert 'jra-inline-report.js' in prod
          assert 'jra-inline-report.js' not in stage
          assert 'id="weekPredictions"' in prod and 'id="weekPredictions"' in stage
          print('PASS_NO_STAGE_ONLY_UI_CONTROLS')
          PY
      - name: Public stage HTTP equals approved mirror
        run: |
          set -euo pipefail
          url='https://toodataa-ai.github.io/keiba-notes/staging/this-week.html'
          for try in $(seq 1 35);do
            if curl -LfsS --max-time 20 "$url?run=$GITHUB_RUN_ID" -o /tmp/jra-stage-week-mirror &&
               cmp -s docs/staging/this-week.html /tmp/jra-stage-week-mirror;then
              echo "PASS_STAGE_HTTP_MATCH_AND_PROD_VISUAL_IDENTITY";exit 0
            fi
            sleep 10
          done
          echo "::error::stage URL did not match expected template";exit 1

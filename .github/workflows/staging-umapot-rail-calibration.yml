name: Stage Umapot rail pixel sampling
on:
  push:
    paths:
      - '.github/workflows/staging-umapot-rail-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sample infield edge and turf pixel colors without redistributing maps
        shell: bash
        run: |
          python3 -m pip install -q Pillow
          python3 - <<'PY'
          import urllib.request,io,math
          from PIL import Image
          images={
            'kyoto':('https://umapot.com/data/powerpoint/kyoto_couse/kyoto_couse_1.jpg',[
              ('backstretch',350,125,.99,-.14),
              ('thirdTurn',544,167,.17,.99),
              ('fourthTurn',516,287,-.75,.66),
              ('fourthExit',479,313,-.99,.06),
              ('homeStraight',371,317,-1,0)]),
            'tokyo':('https://umapot.com/data/powerpoint/tokyo_couse/tokyo_couse_1.jpg',[
              ('backstretch',295,127,-1,0),
              ('thirdTurn',105,216,-.15,.99),
              ('homeStraight',300,315,1,0),
              ('secondTurn',470,158,-.5,-.8)])}
          for name,(url,samples) in images.items():
            try:
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18).read()
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              print('IMAGE',name,'DIM',im.size,'BYTES',len(raw),flush=True)
              sx=im.width/620;sy=im.height/430
              for section,x,y,tx,ty in samples:
                mag=math.hypot(tx,ty);tx/=mag;ty/=mag
                turnSign=1 if name=='kyoto' else -1
                categories=[]
                for offset in range(-35,36,2):
                  xx=round((x+(-ty)*turnSign*offset)*sx)
                  yy=round((y+tx*turnSign*offset)*sy)
                  if 0<=xx<im.width and 0<=yy<im.height:
                    r,g,b=im.getpixel((xx,yy))
                    kind=('G' if g>80 and g>r*1.17 and g>b*1.08 else 
                     'B' if r>55 and r>g*1.16 and g>b*1.1 else
                     'W' if min(r,g,b)>202 else '.')
                  else:kind='?'
                  categories.append(kind)
                print('RAIL_SCAN',name,section,'orig',(x,y),'left=-35 RIGHT=+35 INSIDE',''.join(categories),flush=True)
            except Exception as ex:print('SCAN_FETCH_FAILED',name,str(ex),flush=True)
          PY
name: Baba going source probe (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python baba_models_v2/going_source_probe.py
      - name: Commit raw probe output
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baba_models_v2/probe
          git commit -m "Probe: JRA current going sources" || exit 0
          for i in 1 2 3; do git fetch origin main && git rebase origin/main && git push origin HEAD:main && break; sleep 3; done

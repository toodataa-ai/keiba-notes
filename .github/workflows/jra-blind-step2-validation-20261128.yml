name: JRA isolated STEP2 validation only - no publication or E012
on:
  push:
    branches: [chatgpt/jra-blind-intake-20261128]
    paths: ['.github/workflows/jra-blind-step2-validation-20261128.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jra-blind-intake-20261128
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests beautifulsoup4
      - name: Reuse only already-frozen plans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p validation-only/jra-blind-intake/2026-11-28/step2-retry1
          cp validation-only/jra-blind-intake/2026-11-28/step2/*-plan.json validation-only/jra-blind-intake/2026-11-28/step2-retry1/
      - name: Evaluate exact market coverage and run unsealed v3.13 pipeline, separately per race
        run: |
          python - <<'PY'
          import json,importlib.util,subprocess,hashlib,traceback
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          def mod(name,path):
            s=importlib.util.spec_from_file_location(name,path);o=importlib.util.module_from_spec(s);s.loader.exec_module(o);return o
          parser=mod('old','.github/scripts/jra-gather-live-20261011-v310.py')
          refresh=mod('refresh','.github/scripts/jra-odds-full-refresh-v313-exec.py')
          root=Path('validation-only/jra-blind-intake/2026-11-28/step2-retry1')
          evidence=Path('e2e_validation/quote-evidence/validation-20261128-retry1');evidence.mkdir(parents=True,exist_ok=True)
          for slug,url in [('tokyo','https://sports.yahoo.co.jp/keiba/race/odds/tfw/2605050711'),('kyoto','https://sports.yahoo.co.jp/keiba/race/odds/tfw/2608050711')]:
            d=dict(status='blocked',scope='validation only; never a formal prediction or final_bets',race=slug)
            try:
              inp=json.loads((root/f'{slug}-plan.json').read_text())
              r=requests.get(url,timeout=25);r.raise_for_status()
              data=parser.parse_odds('tfw',BeautifulSoup(r.content,'html.parser'))
              frame={str(sel[0]):v for (t,sel),v in data.items() if t=='_frame'}
              assert all(frame.get(k)==v for k,v in inp['frame_map'].items()),'source frame allocation mismatch'
              d['frame_verified']=True
              anchor_dir=evidence/f'{slug}-anchor';anchor_dir.mkdir()
              quotes,meta=refresh.capture(r.content,r.url,'tfw',parser,anchor_dir,1)
              assert quotes and meta,'no actual anchor quote'
              key=next(k for k in quotes if k[0]=='単勝' and str(k[1][0]) in inp['frame_map'])
              t,sel=key
              inp['market_quotes']=[dict(race_id=inp['race_id'],type=t,selection=list(sel),market_selection_id=t+':'+json.dumps(list(sel),separators=(',',':')),market_odds=quotes[key],source_url=meta['url'],observed_at=meta['at'],source_capture_path=meta['path'],source_capture_sha256=meta['sha'],quote_verified=True)]
              source=root/f'{slug}-anchor-input.json';source.write_text(json.dumps(inp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              recovered=root/f'{slug}-recovered.json'
              refresh.recover(source,recovered,evidence/f'{slug}-quotes',refresh_all=True,max_capture_spread_seconds=180)
              d['quote_count']=len(json.loads(recovered.read_text())['market_quotes'])
              gate=subprocess.run(['python','.github/scripts/jra-check-fresh-quotes-v313-exec.py','--input',str(recovered),'--fresh-seconds','600','--max-spread-seconds','180'],text=True,capture_output=True)
              d['fresh_gate_log']=gate.stdout+gate.stderr
              if gate.returncode: raise RuntimeError('fresh quote gate failed: '+gate.stderr)
              snapshot=root/f'{slug}-unsealed-snapshot.json'
              p=subprocess.run(['node','.github/scripts/jra-prestart-pipeline-v313.mjs','--input',str(recovered),'--output',str(snapshot)],text=True,capture_output=True)
              d['pipeline_log']=p.stdout[-1500:]+p.stderr[-1500:]
              if p.returncode: raise RuntimeError('official v3.13 pending snapshot gate failed: '+p.stderr[-500:])
              out=json.loads(snapshot.read_text());assert out['stage']=='pending_git_proof' and out['proof_commit'] is None
              d.update(status='unsealed_step2_validation_complete',stage=out['stage'],snapshot=str(snapshot),candidate_bets=out.get('final_bets'),audit=out.get('market_quote_audit'))
            except Exception as e:
              d['error']=str(e)[:1000];d['error_type']=type(e).__name__
              print(slug,repr(e))
            (root/f'{slug}-result.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Preserve validation evidence only
        if: always()
        run: |
          git add -- validation-only/jra-blind-intake/2026-11-28/step2-retry1/ e2e_validation/quote-evidence/validation-20261128-retry1/
          if ! git diff --cached --quiet; then
            git commit -m "Record actual STEP2 validation evidence; no seal or publication"
            git push origin HEAD:chatgpt/jra-blind-intake-20261128
          fi

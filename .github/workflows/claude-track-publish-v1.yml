name: Claude track publish v1 (scores + public data for Claude's predictions)
on:
  push:
    branches: [main]
    paths:
      - 'claude_track/predictions/**'
      - 'claude_track/reviews/**'
      - 'claude_track/results/**'
      - 'e2e_validation/results/**'
      - 'claude_track/build_public.py'
      - 'claude_track/score_claude.py'
      - 'claude_track/experiments.py'
      - 'claude_track/inputs/**'
  schedule:
    - cron: '47 10 * * *'   # 19:47 JST: picks up results committed by other bots
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: claude-track-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python3 -m unittest discover -s claude_track -t . -p 'test_*.py'
      - name: Commit derived Claude data only (regenerated on the latest main)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -m claude_track.score_claude
            python3 -m claude_track.build_public
            python3 -m claude_track.experiments
            git add claude_track/status_v1.json docs/data/predictors/claude_status_v1.json docs/data/predictors/claude_experiments_v1.json
            if git diff --cached --quiet; then echo 'no change'; exit 0; fi
            git commit -q -m 'Update Claude track scores and public data (derived only)'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*3))
          done
          exit 1
      - name: Open a notification Issue when a Claude-track experiment is ready (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create claude-experiment-ready --color 5319e7 --description "Claude single-track experiment reached its threshold" 2>/dev/null || true
          python3 claude_track/open_ready_issues.py

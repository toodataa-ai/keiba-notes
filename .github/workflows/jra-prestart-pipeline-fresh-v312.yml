name: JRA v3.12 FRESH ALL odds for brand-new races, sealed PDF and public proof
on:
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Audited prereace STEP1 + exact odds catalog (e2e_validation/inputs/v312/*.json)'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: jra-v312-prestart-proof
  cancel-in-progress: false
jobs:
  prestart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v3.12 balanced optimisation, history and regression CI
        run: |
          node .github/scripts/test-jra-balanced-v311.mjs
          node .github/scripts/test-jra-purchase-audit-v312.mjs
          python3 -m py_compile .github/scripts/jra-odds-recovery-v312.py .github/scripts/jra-render-live-v312.py .github/scripts/validate-jra-pdf-content-v312.py
          node .github/scripts/validate-jra-prompt-v312.mjs
          node .github/scripts/validate-prompt-history.mjs
          node .github/scripts/test-jra-prestart-pipeline-v312.mjs
          node .github/scripts/test-jra-portfolio-v311.mjs
          node .github/scripts/test-jra-strategy-v39.mjs
          node .github/scripts/validate-jra-prompt-v312.mjs
      - name: Validate path and reserve immutable snapshot names
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t NEW_FILES < <(git diff --diff-filter=A --name-only "$BEFORE_SHA" "$AFTER_SHA" -- e2e_validation/inputs)
            if [[ ${#NEW_FILES[@]} -ne 1 ]]; then
              echo "::error::Exactly one newly created JRA input JSON is required per push, got ${#NEW_FILES[@]}"; exit 1
            fi
            INPUT_PATH="${NEW_FILES[0]}"
          fi
          case "$INPUT_PATH" in e2e_validation/inputs/*.json) ;; *) echo "::error::Input must be a tracked prereace JSON under e2e_validation/inputs"; exit 1;; esac
          if [[ "$INPUT_PATH" == *..* ]] || [[ ! -f "$INPUT_PATH" ]] || [[ -L "$INPUT_PATH" ]]; then
            echo "::error::Unsafe or missing race input"; exit 1
          fi
          RACE_ID=$(node -e "const o=require('./'+process.argv[1]);if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$/.test(o.race_id||''))process.exit(1);console.log(o.race_id)" "$INPUT_PATH")
          REL="v3.12-run${RUN_ID}-attempt${ATTEMPT}.json"
          SNAPSHOT="e2e_validation/snapshots/${RACE_ID}/${REL}"
          PREDICTION="e2e_validation/predictions/${RACE_ID}/${REL}"
          REPORT="docs/reports/$RACE_ID.html"
          PDF="docs/pdfs/$RACE_ID.pdf"
          if [[ -e "$REPORT" || -e "$PDF" ]];then echo "::error::Prior official report/PDF exists; cannot overwrite";exit 1;fi
          python3 - "$RACE_ID" <<'PY'
          import json,sys
          from pathlib import Path
          registry=json.loads(Path('docs/data/races.json').read_text())
          if any(r['id']==sys.argv[1] for r in registry['races']):raise SystemExit('BLOCKER: race already published')
          PY
          if [[ -e "$SNAPSHOT" || -e "$PREDICTION" ]]; then
            echo "::error::Immutable snapshot/prediction path already occupied"; exit 1
          fi
          {
            echo "INPUT_PATH=$INPUT_PATH"
            echo "SNAPSHOT=$SNAPSHOT"
            echo "PREDICTION=$PREDICTION"
            echo "REPORT=$REPORT"
            echo "PDF=$PDF"
          } >> "$GITHUB_ENV"
      - name: Resolve exact live odds using only source-advertised forms
        env:
          RACE_INPUT: ${{ env.INPUT_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RACE_ID=$(node -e "console.log(require('./'+process.argv[1]).race_id)" "$RACE_INPUT")
          REPAIRED="e2e_validation/inputs/v312-recovered/${RACE_ID}-run${RUN_ID}.json"
          EVIDENCE="e2e_validation/quote-evidence/${RACE_ID}/v312-repair-run${RUN_ID}"
          python3 -m pip install -q requests beautifulsoup4
          python3 .github/scripts/jra-odds-full-refresh-v312-exec.py --refresh-all \
            --input "$RACE_INPUT" --output "$REPAIRED" --evidence-dir "$EVIDENCE" --max-capture-spread-seconds 180
          python3 .github/scripts/jra-check-fresh-quotes-v312-exec.py --input "$REPAIRED" --fresh-seconds 600 --max-spread-seconds 180
          echo "RECOVERED_INPUT=$REPAIRED" >> "$GITHUB_ENV"
          echo "RECOVERED_EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
      - name: Install exactly approved JRA PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
          python -m pip install -q weasyprint==68.0 pymupdf==1.26.4
      - name: Generate and audit the complete unsealed betting snapshot
        run: |
          set -euo pipefail
          node .github/scripts/jra-prestart-pipeline-v312.mjs --input "$RECOVERED_INPUT" --output "$SNAPSHOT"
          node -e "const p=require('./'+process.argv[1]);if(p.stage!=='pending_git_proof'||p.proof_commit!==null||p.prompt_version!=='v3.12')process.exit(1)" "$SNAPSHOT"
      - name: Adaptively paginate every selected/rejected candidate and verify PDF before freezing
        run: |
          set -euo pipefail
          python3 - "$SNAPSHOT" /tmp/jra-v311-layout-only.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));d['stage']='formal_prestart';d['proof_commit']='a'*40
          with open(sys.argv[2],'w') as f:json.dump(d,f,ensure_ascii=False)
          PY
          set +e
          VALIDATED=0
          # Each retry uses smaller rows per A4 page. Total pages are unrestricted.
          for ROWS in 14:12:14:6 12:10:14:6 10:9:14:6 10:8:14:6 10:7:14:6 8:5:10:4 6:4:8:3 4:3:6:2 2:2:4:1 1:1:2:1; do
            IFS=: read -r SELECTED_ROWS REJECTED_ROWS AUDIT_ROWS COVER_BETS <<< "$ROWS"
            echo "Rendering candidate rows/page selected=$SELECTED_ROWS excluded=$REJECTED_ROWS"
            JRA_SELECTED_ROWS_PER_PAGE="$SELECTED_ROWS" JRA_REJECTED_ROWS_PER_PAGE="$REJECTED_ROWS" JRA_AUDIT_ROWS_PER_PAGE="$AUDIT_ROWS" \
              python3 .github/scripts/jra-render-live-v312.py /tmp/jra-v311-layout-only.json "$REPORT" &&
             JRA_COVER_BETS_PER_TYPE="$COVER_BETS" python3 .github/scripts/jra-pdf-presentation-overlay-v1.py "$REPORT" --prediction /tmp/jra-v311-layout-only.json &&
            python3 -m weasyprint "$REPORT" /tmp/jra-v311-layout-only.pdf &&
            python3 .github/scripts/validate-jra-pdf-content-v312.py \
              --html "$REPORT" --pdf /tmp/jra-v311-layout-only.pdf --prediction /tmp/jra-v311-layout-only.json
            if [[ $? -eq 0 ]]; then
              VALIDATED=1; echo "SUCCESS chosen pagination: selected=$SELECTED_ROWS excluded=$REJECTED_ROWS"
              echo "JRA_SELECTED_ROWS_PER_PAGE=$SELECTED_ROWS" >> "$GITHUB_ENV"
              echo "JRA_REJECTED_ROWS_PER_PAGE=$REJECTED_ROWS" >> "$GITHUB_ENV"
               echo "JRA_AUDIT_ROWS_PER_PAGE=$AUDIT_ROWS" >> "$GITHUB_ENV"
              echo "JRA_COVER_BETS_PER_TYPE=$COVER_BETS" >> "$GITHUB_ENV"
              break
            fi
          done
          if [[ $VALIDATED -ne 1 ]]; then echo "::error::All per-page density variants failed detailed PDF audit"; exit 1; fi
          set -e
      - name: Freeze snapshot in a real Git commit before race start
        # Snapshot, evidence and every candidate quote are revalidated before proof.
        
        run: |
          set -euo pipefail
          python3 .github/scripts/jra-check-fresh-quotes-v312-exec.py --input "$RECOVERED_INPUT" --fresh-seconds 600 --max-spread-seconds 180
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SNAPSHOT" "$RECOVERED_INPUT"
          if [[ -d "$RECOVERED_EVIDENCE" ]] && find "$RECOVERED_EVIDENCE" -type f -print -quit | grep -q .; then git add -- "$RECOVERED_EVIDENCE"; fi
          git commit -m "Freeze prereace JRA v3.12 complete quote evidence, purchase audit and final_bets"
          git push origin HEAD:main
          PROOF=$(git rev-parse HEAD)
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          echo "Recorded immutable prereace snapshot $SNAPSHOT in $PROOF"
      - name: Seal final prediction with existing Git proof
        run: |
          set -euo pipefail
          python3 .github/scripts/jra-check-fresh-quotes-v312-exec.py --input "$RECOVERED_INPUT" --fresh-seconds 600 --max-spread-seconds 180
          node .github/scripts/jra-prestart-pipeline-v312.mjs --seal "$SNAPSHOT" --proof-commit "$PROOF" --output "$PREDICTION"
          node .github/scripts/validate-jra-portfolio-v312.mjs
          node .github/scripts/validate-jra-prompt-v312.mjs
      - name: Generate final PDF from immutable proof, validate every page and append public registry
        run: |
          set -euo pipefail
          python3 .github/scripts/jra-render-live-v312.py "$PREDICTION" "$REPORT"
           python3 .github/scripts/jra-pdf-presentation-overlay-v1.py "$REPORT" --prediction "$PREDICTION"
          python -m weasyprint "$REPORT" "$PDF"
          python3 .github/scripts/validate-jra-pdf-content-v312.py --html "$REPORT" --pdf "$PDF" --prediction "$PREDICTION"
          python3 .github/scripts/jra-publish-live-v312.py "$PREDICTION"
      - name: Commit only new prediction PDF HTML and appended race registry
        run: |
          set -euo pipefail
          git add -- "$PREDICTION" "$REPORT" "$PDF" docs/data/races.json
          python3 - "$PREDICTION" "$REPORT" "$PDF" <<'PY'
          import subprocess,sys
          expected=set(sys.argv[1:])|{'docs/data/races.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual!=expected:raise SystemExit('BLOCKER: unexpected historical file changes: '+str(actual^expected))
          PY
          git commit -m "Publish validated v3.12 full JRA original prediction HTML PDF and public registry"
          git push origin HEAD:main
          echo "PUBLISHED_JRA_V312_JSON_HTML_PDF $RACE_ID proof=$PROOF"

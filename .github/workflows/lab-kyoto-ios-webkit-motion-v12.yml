name: LAB Kyoto iOS WebKit GOAL-board switch and racing-finish presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lab-kyoto-ios-webkit-motion-v12.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  safari:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install iPhone-like WebKit browser
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps webkit
      - name: Verify user click on exact public LAB URL and local copy
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory docs >/tmp/kyoto-webkit-http.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          import time,traceback,json
          from playwright.sync_api import sync_playwright
          addresses=[
           'http://127.0.0.1:8765/lab/race-clean-course-v1.html?checkpoint=602&v=15',
           'https://toodataa-ai.github.io/keiba-notes/lab/race-clean-course-v1.html?checkpoint=602&v=15'
          ]
          with sync_playwright() as p:
           b=p.webkit.launch(headless=True)
           for url in addresses:
            context=b.new_context(viewport={'width':390,'height':844},
                device_scale_factor=3,is_mobile=True,has_touch=True,
                user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1',
                ignore_https_errors=True)
            page=context.new_page()
            exceptions=[]
            page.on('pageerror',lambda e:exceptions.append(str(e)))
            page.on('console',lambda m:print('SAFARI_JS_CONSOLE',m.type,m.text) if m.type=='error' else None)
            page.on('requestfailed',lambda request:print('SAFARI_FAILED_REQUEST',request.url,request.failure))
            page.on('response',lambda response:print('SAFARI_NETWORK',response.status,response.request.resource_type,response.url) if ('kyoto-umapot' in response.url or response.status>=400) else None)
            try:
             started=time.monotonic()
             page.goto(url,wait_until='domcontentloaded',timeout=35000)
             print('WEBKIT_DOCUMENT_LOADED',url,'seconds',round(time.monotonic()-started,2))
             page.wait_for_timeout(8000)
             before=page.evaluate("""() => ({
               start:document.getElementById('startBtn')?.textContent,
               progress:document.getElementById('progress')?.textContent,
               inspect:window.CleanLab?.inspect?.()&&({
                 leader:CleanLab.inspect().leader,vectorReady:CleanLab.inspect().vectorReady,
                 turfReady:CleanLab.inspect().turfReady,turfError:CleanLab.inspect().turfError
               })})""")
             images=page.evaluate("""() => [...document.images].map(e=>({
               id:e.id,src:e.src,complete:e.complete,naturalWidth:e.naturalWidth,
               naturalHeight:e.naturalHeight,currentSrc:e.currentSrc,
               crossOrigin:e.crossOrigin
             }))""")
             print('SAFARI_IMAGE_DETAIL',json.dumps(images,ensure_ascii=False))
             print('SAFARI_BEFORE_CLICK',json.dumps(before,ensure_ascii=False))
             page.locator('#startBtn').click(timeout=15000)
             page.wait_for_timeout(5000)
             after=page.evaluate("""() => ({
               start:document.getElementById('startBtn')?.textContent,
               progress:document.getElementById('progress')?.textContent,
               state:window.CleanLab?.getState?.()&&({
                leader:CleanLab.getState().leader,t:CleanLab.getState().t}),
               frame:window.CleanLab?.frameSample?.(),
               inspect:window.CleanLab?.inspect?.()&&({
                 vectorReady:CleanLab.inspect().vectorReady,
                 turfReady:CleanLab.inspect().turfReady,turfError:CleanLab.inspect().turfError
               })})""")
             print('SAFARI_AFTER_CLICK',json.dumps({
                 'start':after.get('start'),'progress':after.get('progress'),
                 'state':after.get('state'),'play':after.get('frame',{}).get('playing'),
                 'turf':after.get('inspect'),'numHorses':len(after.get('frame',{}).get('horses',[]))},ensure_ascii=False))
             print('SAFARI_JS_ERRORS',json.dumps(exceptions,ensure_ascii=False))
             print('SAFARI_IMAGE_DETAIL_AFTER',json.dumps(page.evaluate("""() => [...document.images].map(e=>({
               id:e.id,src:e.src,complete:e.complete,naturalWidth:e.naturalWidth,
               naturalHeight:e.naturalHeight
             }))"""),ensure_ascii=False))
             if not after.get('state') or not before.get('inspect') or not after.get('inspect'):
              raise AssertionError('LAB_SCRIPT_NOT_LOADED')
             if not before['inspect']['turfReady'] or not after['inspect']['turfReady']:
              raise AssertionError('LAB_TURF_INITIALIZATION_FAILURE')
             if not before['inspect']['vectorReady'] or not after['inspect']['vectorReady']:
              raise AssertionError('SAFARI_SOURCE_IMAGE_VIEWBOX_RESIZE_STILL_BLOCKED')
             if after['state']['leader']<before['inspect']['leader']+5:
              raise AssertionError('LAB_NOT_MOVING_AFTER_START')
             if exceptions:raise AssertionError('WEBKIT_JS_ERRORS')
             page.screenshot(path='/tmp/webkit-kyoto-'+('local' if '127.0.0.1' in url else 'public')+'.png')
             print('PASS_WEBKIT_IPHONE_START_AND_MOVEMENT',url)
             # Reuse exactly the same iPhone WebKit context through the wire.
             page.evaluate('() => CleanLab.advanceTo(1970)')
             board=page.evaluate("""() => ({
               displayed:CleanLab.inspect().goalBoardVisible,
               goal:CleanLab.inspect().goalFrame,
               boardCanvas:document.getElementById('goalCamera')?.getBoundingClientRect().width,
               stageWidth:document.getElementById('broadcastStage')?.getBoundingClientRect().width,
               originalEngineSame:Boolean(window.RaceSimEngine&&window.RaceLaneAI)
             })""")
             print('SAFARI_KYOTO1400_GOAL_CAMERA',url,json.dumps(board,ensure_ascii=False)[:1800])
             assert board['displayed'] and board['originalEngineSame'],('GOAL_BOARD_NOT_SHOWN',url,board)
             assert board['goal']['mode']=='kyoto1400-goal-camera'
             assert abs(board['goal']['goalX']-board['stageWidth']*.30)<2
             assert board['goal']['visible']>0
             assert all(
               board['goal']['top']+19 <= m['y'] <= board['goal']['bottom']-19
               for m in board['goal']['markers']),('WEBKIT_MARKERS_OFF_GOAL_TURF',url,board)
             page.locator('#speed').select_option('4')
             page.locator('#startBtn').click()
             page.wait_for_function('window.CleanLab?.inspect()?.finishSequenceDone===true',timeout=25000)
             finish=page.evaluate("""() => ({
               done:CleanLab.inspect().finishSequenceDone,
               ms:CleanLab.inspect().finishSequenceElapsedMs,
               visible:CleanLab.inspect().finishedBannerVisible,
               podium:document.getElementById('finishPodium')?.textContent,
               status:document.getElementById('finishHeading')?.textContent,
               count:CleanLab.frameSample().horses.length,
               playing:CleanLab.frameSample().playing,
               last:CleanLab.frameSample().horses.find(x=>x.number===1)?.d
             })""")
             print('SAFARI_GENTLE_FINISH',url,json.dumps(finish,ensure_ascii=False))
             assert page.evaluate('() => CleanLab.inspect().goalBoardVisible')
             assert finish['done'] and finish['visible']
             assert finish['ms']>=3150 and finish['count']==18
             assert '1着' in finish['podium'] and '3着' in finish['podium']
             assert not finish['playing']
             if exceptions:raise AssertionError('SAFARI_FINISH_JS_ERRORS')
             page.screenshot(path='/tmp/webkit-kyoto-finish-'+('local' if '127.0.0.1' in url else 'public')+'.png')
             print('PASS_WEBKIT_IPHONE_SMOOTH_FINISH',url)
            finally:
             context.close()
           b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-webkit-iphone-playback-diagnostic
          path: /tmp/webkit-kyoto-*.png
          if-no-files-found: warn

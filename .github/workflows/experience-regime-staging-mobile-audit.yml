name: Verify E0 E1 E2 staging mobile layout
on:
  push:
    branches: [main]
    paths:
      - 'docs/staging/experience-regime.html'
      - '.github/scripts/experience-regime-staging-mobile-audit.py'
      - '.github/workflows/experience-regime-staging-mobile-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Use an actual Chromium browser
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Verify mobile and desktop responsive staging DOM and historical proof
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory docs >/tmp/experience-regime-stage-server.log 2>&1 &
          sleep 2
          python .github/scripts/experience-regime-staging-mobile-audit.py
      - name: Save 320px 390px 768px screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e012-staging-responsive-screenshots
          path: /tmp/experience-regime-stage-*.png
          if-no-files-found: ignore
      - name: Verify exact deployed staging HTML bytes
        run: |
          set -euo pipefail
          url='https://toodataa-ai.github.io/keiba-notes/staging/experience-regime.html'
          for i in $(seq 1 30);do
            if curl -fsSL --max-time 25 "$url?qa=$GITHUB_RUN_ID-$i" -o /tmp/e012-public-stage.html &&
              cmp -s /tmp/e012-public-stage.html docs/staging/experience-regime.html; then
              echo "PASS_STAGE_PUBLIC_EXACT_BYTE_MATCH $url"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Staging HTML did not match public GitHub Pages content.'
          exit 1

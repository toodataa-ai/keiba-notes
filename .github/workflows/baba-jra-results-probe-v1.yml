name: Baba research - probe how JRA race-result pages can be read (read only, a few requests)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Walk results list -> meeting -> race result (POST like the site does)
        run: |
          python - <<'PY'
          import re, time, requests
          from bs4 import BeautifulSoup
          H={'User-Agent':'keiba-notes track-condition research/1.0 (low rate, research only)'}
          BASE='https://www.jra.go.jp'
          S=requests.Session(); S.headers.update(H)
          def post(path,cname):
              time.sleep(3)
              r=S.post(BASE+path,data={'cname':cname},timeout=40); r.encoding=r.apparent_encoding
              return r
          def acts(html):
              return re.findall(r"doAction\('([^']+)'\s*,\s*'([^']+)'\)",html)
          def show(tag,r):
              s=BeautifulSoup(r.text,'html.parser'); txt=s.get_text(' ',strip=True)
              print('####',tag,r.status_code,len(r.text))
              print('  title:',(s.title.get_text(strip=True) if s.title else '')[:80])
              a=acts(r.text); print('  doAction count',len(a))
              for p,c in a[:25]: print('   ',p,c)
              for m in list(re.finditer('馬場',txt))[:4]: print('  ...',txt[max(0,m.start()-30):m.end()+40])
              return a
          r=post('/JRADB/accessS.html','pw01sli00/AF'); a=show('list',r)
          # a meeting-level link (開催) : pick first accessS cname not equal to the list itself
          cand=[x for x in a if x[0].endswith('accessS.html') and x[1]!='pw01sli00/AF']
          if cand:
              r2=post(*cand[0]); a2=show('level2 '+cand[0][1],r2)
              c2=[x for x in a2 if x[0].endswith('accessS.html')]
              if c2:
                  r3=post(*c2[0]); a3=show('level3 '+c2[0][1],r3)
                  c3=[x for x in a3 if x[0].endswith('accessS.html')]
                  if c3:
                      r4=post(*c3[0]); show('level4 '+c3[0][1],r4)
          PY

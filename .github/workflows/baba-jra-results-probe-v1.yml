name: Baba research - probe how JRA race-result pages can be read (read only, a few requests)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Walk results list -> meeting -> race result (POST like the site does)
        run: |
          python - <<'PY'
          import re, time, requests
          from bs4 import BeautifulSoup
          H={'User-Agent':'keiba-notes track-condition research/1.0 (low rate, research only)'}
          BASE='https://www.jra.go.jp'
          S=requests.Session(); S.headers.update(H)
          def post(path,cname):
              time.sleep(3)
              r=S.post(BASE+path,data={'cname':cname},timeout=40); r.encoding=r.apparent_encoding
              return r
          def acts(html):
              return re.findall(r"doAction\('([^']+)'\s*,\s*'([^']+)'\)",html)
          def show(tag,r):
              s=BeautifulSoup(r.text,'html.parser'); txt=s.get_text(' ',strip=True)
              print('####',tag,r.status_code,len(r.text))
              print('  title:',(s.title.get_text(strip=True) if s.title else '')[:80])
              a=acts(r.text); print('  doAction count',len(a))
              for p,c in a[:25]: print('   ',p,c)
              for m in list(re.finditer('馬場',txt))[:4]: print('  ...',txt[max(0,m.start()-30):m.end()+40])
              return a
          def sacts(a): return [x for x in a if x[0].endswith('accessS.html')]
          def uniq(a): 
              seen=[];[seen.append(c) for p,c in sacts(a) if c not in seen]; return seen
          r=post('/JRADB/accessS.html','pw01skl10202502/00'); 
          print('#### month 2025-02 (checksum guess)',r.status_code,len(r.text))
          r=post('/JRADB/accessS.html','pw01skl10202511/EC'); a=acts(r.text)
          print('#### month 2025-11 cnames:',[c for c in uniq(a) if not c.startswith(('pw01sli','pw01skl0','pw01ide','pw03','pw01dli','pw15','pw01hli'))][:60])
          r=post('/JRADB/accessS.html','pw01srl10052026041120261101/E2'); a=acts(r.text)
          print('#### day page cnames:',[c for c in uniq(a) if not c.startswith(('pw01sli','pw01skl0','pw01ide','pw03','pw01dli','pw15','pw01hli'))][:40])
          rc=[c for c in uniq(a) if c.startswith('pw01sde')]
          if rc:
              r=post('/JRADB/accessS.html',rc[0]); t=BeautifulSoup(r.text,'html.parser').get_text(' ',strip=True)
              print('#### race page',r.status_code,len(t))
              for m in list(re.finditer(r'(芝|ダート)\s*[:：]?\s*(良|稍重|重|不良)|天候',t))[:6]: print('  ...',t[max(0,m.start()-30):m.end()+40])
          PY

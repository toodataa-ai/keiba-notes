name: Validate JRA v3.8 purchase strategies
on:
  push:
    branches: [main]
    paths:
      - '競馬予想_完全版プロンプト_v3.8.txt'
      - 'docs/data/ticket_portfolio_policy_v1.json'
      - 'docs/data/latest_prompt.json'
      - 'docs/data/prompt_history.json'
      - 'e2e_validation/manifests/v3.8.json'
      - '.github/scripts/validate-jra-strategy-v38.mjs'
      - '.github/scripts/test-jra-strategy-v38.mjs'
      - '.github/scripts/validate-jra-strategy-prompt-v38.mjs'
      - '.github/scripts/validate-purchase-gate-v34.mjs'
      - '.github/scripts/validate-multi-candidate-v35.mjs'
      - '.github/workflows/validate-jra-strategy-v38.yml'
      - 'e2e_validation/predictions/**'
  pull_request:
    paths:
      - '競馬予想_完全版プロンプト_v3.8.txt'
      - 'docs/data/ticket_portfolio_policy_v1.json'
      - 'docs/data/latest_prompt.json'
      - 'docs/data/prompt_history.json'
      - 'e2e_validation/manifests/v3.8.json'
      - '.github/scripts/**'
      - '.github/workflows/validate-jra-strategy-v38.yml'
      - 'e2e_validation/predictions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check SHA-pinned scope and formal pointer
        run: |
          node .github/scripts/validate-jra-strategy-prompt-v38.mjs
          node .github/scripts/validate-prompt-history.mjs
      - name: Verify multi-ticket portfolio and old one-point regressions
        run: |
          node .github/scripts/test-jra-strategy-v38.mjs
          node .github/scripts/validate-jra-strategy-v38.mjs
          node .github/scripts/test-multi-candidate-v35.mjs
          node .github/scripts/test-purchase-gate-v34.mjs
          node .github/scripts/test-jra-conditional-ticket-probability.mjs
      # Historical v3.6 prestart snapshots already fail the standalone v3.4/v3.5 file-scan workflows on main.
      # Do not edit or silently normalize those immutable predictions as part of v3.8; retain original synthetic regression tests above.
      - name: Preserve old PDF and execution contracts
        run: |
          node .github/scripts/validate-jra-reader-v37.mjs
          node .github/scripts/validate-jra-one-shot-v36.mjs

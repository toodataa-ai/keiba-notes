name: Baba research - inspect failing JRA PDFs and JMA table layouts (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Dump failing PDFs
        working-directory: baba_models_v2
        run: |
          python - <<'PY'
          import requests, sys
          import jra_observations as j
          for url in ['https://www.jra.go.jp/keiba/baba/archive/2018pdf/sapporo01.pdf','https://www.jra.go.jp/keiba/baba/archive/2021pdf/chukyo06.pdf','https://www.jra.go.jp/keiba/baba/archive/2021pdf/fukushima02.pdf']:
              r=requests.get(url,headers={'User-Agent':j.UA},timeout=60)
              print('#####',url,r.status_code,len(r.content))
              if r.status_code!=200: continue
              t=j.extract_pdf_text(r.content)
              print('\n'.join(t.splitlines()[:70]))
          PY
      - name: Dump JMA table layouts
        run: |
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          UA={'User-Agent':'keiba-notes track-condition research/1.0'}
          cands=[('札幌',14,'47412','s1'),('函館',23,'47430','s1'),('福島',36,'47595','s1'),('新潟',54,'47604','s1'),('名古屋',51,'47636','s1'),
                 ('小倉',82,'0781','a1'),('大府',51,'1638','a1'),('松浜',54,'1469','a1'),('北斗',23,'0148','a1'),('高松(渡島)',23,'1462','a1'),('西野幌',14,'1076','a1'),('東海',51,'0465','a1')]
          for name,prec,block,kind in cands:
              url=f'https://www.data.jma.go.jp/stats/etrn/view/hourly_{kind}.php?prec_no={prec}&block_no={block}&year=2026&month=5&day=10&view='
              r=requests.get(url,headers=UA,timeout=30); r.encoding=r.apparent_encoding
              soup=BeautifulSoup(r.text,'html.parser')
              rows=[[td.get_text(' ',strip=True) for td in tr.find_all(['td','th'])] for tr in soup.find_all('tr')]
              print('#####',name,kind,prec,block,r.status_code,'tables-rows',len(rows))
              for row in rows[:4]: print('HDR',row)
              n=0
              for row in rows:
                  if row and re.fullmatch(r'\d{1,2}',row[0].strip()):
                      print('ROW',row); n+=1
                      if n>=3: break
          PY

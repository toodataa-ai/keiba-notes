name: Stage Kyoto outer rail pixel analysis
on:
  push:
    paths:
      - '.github/workflows/staging-kyoto-outer-pixel-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare simulated overlays against source racing strips
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q Pillow
          node - <<'JS' > /tmp/kyoto_sample.json
          const fs=require('fs'),vm=require('vm'),W={},doc={getElementById(){return null},querySelector(){return null}};
          for(const file of ['race-course-geometry-v1.js','race-umapot-overlay-v1.js']){
             const code=fs.readFileSync('docs/staging/'+file,'utf8');
             vm.runInNewContext(code,{window:W,globalThis:W,document:doc});
          }
          const course=W.RaceCourseGeometry.get('kyoto_turf_outer_1400'),out=[];
          for(const d of [100,225,365,445,500,540,570,600,650,675,700,725,750,775,805,830,860,890,920,950,970,996.3,1100,1250]){
            const a=W.RaceUmapotOverlay.point(course,d,0),
              l=W.RaceUmapotOverlay.point(course,d,4),
              n=Math.hypot(l.x-a.x,l.y-a.y);
            out.push({d,x:+a.x.toFixed(2),y:+a.y.toFixed(2),
               nx:+((l.x-a.x)/n).toFixed(4),ny:+((l.y-a.y)/n).toFixed(4)});
          }
          process.stdout.write(JSON.stringify(out));
          JS
          python3 - <<'PY'
          from PIL import Image
          import json,urllib.request,io,collections,math
          url='https://umapot.com/data/powerpoint/kyoto_couse/kyoto_couse_1.jpg'
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18).read()
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          print('IMAGE',im.size,flush=True)
          def color(x,y):
            if x<0 or y<0 or x>=620 or y>=430:return '?'
            r,g,b=im.getpixel((int(round(x)),int(round(y))))
            if g>70 and g>r*1.16 and g>b*1.05:return 'G'
            if r>65 and r>g*1.17 and g>b*1.03:return 'B'
            if min(r,g,b)>185:return 'W'
            return '.'
          for d in json.load(open('/tmp/kyoto_sample.json')):
            arr=[];cols=[]
            for t in range(-58,61,2):
              v=color(d['x']+d['nx']*t,d['y']+d['ny']*t);arr.append(v)
            left=''.join(arr[:30]);right=''.join(arr[30:])
            # compress colors to intervals along signed normal to lane-0
            spans=[]
            for i,v in enumerate(arr):
              if not spans or v!=spans[-1][0]:spans.append([v,-58+2*i,-58+2*i])
              else:spans[-1][2]=-58+2*i
            print('COURSE',d['d'],'P',round(d['x'],1),round(d['y'],1),'N',d['nx'],d['ny'],
              'RAIL0',color(d['x'],d['y']), 'SEG',';'.join(f"{x[0]}[{x[1]},{x[2]}]" for x in spans),flush=True)
          PY
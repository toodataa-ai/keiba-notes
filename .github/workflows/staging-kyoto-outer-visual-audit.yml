name: Kyoto course separator raster audit
on:
  push:
    paths:
      - '.github/workflows/staging-kyoto-outer-visual-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detect white inner/outer separator and overlay points
        shell: bash
        run: |
          set -eu
          python3 -m pip install -q Pillow
          node - <<'JS' > /tmp/projections.json
          const fs=require('fs'),vm=require('vm'),w={};
          for(const name of ['race-course-geometry-v1.js','race-umapot-overlay-v1.js'])
            vm.runInNewContext(fs.readFileSync('docs/staging/'+name,'utf8').replace('setup();',''),{window:w,globalThis:w,document:{getElementById:()=>null,querySelector:()=>null}});
          const c=w.RaceCourseGeometry.get('kyoto_turf_outer_1400');
          console.log(JSON.stringify(Array.from({length:41},(_,i)=>{const d=500+i*10;return {d,p:w.RaceUmapotOverlay.point(c,d,0),p4:w.RaceUmapotOverlay.point(c,d,4)}})));
          JS
          python3 - <<'PY'
          from PIL import Image
          import urllib.request,io,json,collections
          raw=urllib.request.urlopen(urllib.request.Request('https://umapot.com/data/powerpoint/kyoto_couse/kyoto_couse_1.jpg',headers={'User-Agent':'Mozilla/5.0'}),timeout=16).read()
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          print('IMG',im.size,flush=True)
          for y in list(range(105,331,8)):
            colors=[]
            for x in range(495,619):
              r,g,b=im.getpixel((x,y))
              if r>205 and g>205 and b>205:k='W'
              elif g>r*1.22 and g>b*1.08 and g>80:k='G'
              elif r>g*1.16 and r>70:k='B'
              else:k='.'
              colors.append(k)
            # split significant W and G spans > 3px
            spans=[]
            for i,k in enumerate(colors):
              if spans and spans[-1][0]==k:spans[-1][2]=495+i
              else:spans.append([k,495+i,495+i])
            major=[s for s in spans if s[2]-s[1]>=3]
            print('SCAN_Y',y,' '.join(f"{s[0]}:{s[1]}-{s[2]}" for s in major),flush=True)
          for row in json.load(open('/tmp/projections.json')):
            d=row['d']; p=row['p'];x=round(p['x']);y=round(p['y']);print('HORSE',d,'x',x,'y',y, 'pixel',im.getpixel((max(0,min(619,x)),max(0,min(429,y)))),flush=True)
          PY
name: JRA clock HTML PDF staging preview (no public changes)
on:
  pull_request:
    paths:
      - '.github/scripts/jra-clock-stage-view-v1.py'
      - '.github/scripts/jra_clock_v1.py'
      - '.github/workflows/jra-clock-stage-preview-v1.yml'
permissions:
  contents: read
jobs:
  stage-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK JP' | grep -i 'Noto'
          python3 -m pip install -q weasyprint==68.0 pymupdf==1.26.4
      - name: Create immutable-source-derived stage HTML only
        run: python3 .github/scripts/jra-clock-stage-view-v1.py --output stage/jra-clock-view
      - name: Render PDFs and check corrected text, pages, and provenance
        shell: bash
        run: |
          set -euo pipefail
          for src in stage/jra-clock-view/*.html; do
            target="$(echo "$src" | sed 's/\.html$/.pdf/')"
            python3 -m weasyprint "$src" "$target"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,fitz
          m=json.loads(Path('stage/jra-clock-view/clockview-stage-manifest.json').read_text())
          assert sum(x['clock_change_count'] for x in m['reports'])==31
          registry=json.loads(Path('docs/data/races.json').read_text())
          page_map={r['id']:r['full_report_pages'] for r in registry['races'] if 'full_report_pages' in r}
          for r in m['reports']:
              p=Path(r['stage_html']).with_suffix('.pdf')
              assert p.is_file() and p.stat().st_size>10000
              pdf=fitz.open(p)
              assert len(pdf)==page_map[r['race_id']], (p,len(pdf),page_map[r['race_id']])
              content=' '.join(page.get_text() for page in pdf)
              sample=r['clock_changes'][0]['clock']
              assert sample in content,(p,sample)
              assert all(c['clock'] in content for c in r['clock_changes']),p
              assert '予想' in content,('Japanese PDF glyph extraction failed',p)
              print('STAGE_PDF_OK',r['race_id'],len(pdf),'pages',r['clock_change_count'],'corrections')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jra-clock-corrected-html-pdf-stage
          path: stage/jra-clock-view/
          retention-days: 14

name: JRA v3.12 live odds recovery smoke (no publication)
on:
  push:
    branches: [feature/jra-v312-odds-portfolio-audit]
    paths:
      - '.github/workflows/jra-v312-live-quote-smoke-20261011.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover only missing live exact odds without changing any predictions
        run: |
          set -euo pipefail
          python -m pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('e2e_validation/inputs/2026-10-11-ireland-trophy.json')
          o=json.loads(p.read_text(encoding='utf-8'))
          o['prompt_version']='v3.12'
          Path('/tmp/ireland-v312-staging.json').write_text(json.dumps(o,ensure_ascii=False),encoding='utf-8')
          print('PREREACE INPUT',o['race_id'],'observed_quotes',len(o['market_quotes']),'planned_modes',len(o['strategies']))
          PY
          python3 - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://sports.yahoo.co.jp/keiba/race/odds/st/2605040411?ninki=0'
          r=requests.get(u,timeout=20);r.raise_for_status()
          s=BeautifulSoup(r.content,'html.parser')
          print('SOURCE_FORMS',len(s.select('form')),'HTML_BYTES',len(r.content))
          import re
          scripts=s.select('script')
          print('SOURCE_SCRIPTS',len(scripts))
          for script in scripts:
              body=script.string or script.get_text()
              markers=[w for w in ['__NEXT_DATA__','__INITIAL_STATE__','race/odds','trifecta','sanrentan','3-10-16'] if w in body]
              if markers or len(body)>2000:
                  print('SCRIPT_STRUCTURE',script.get('id'),script.get('type'),script.get('src'),'BYTES',len(body),'MARKERS',markers,'PREFIX',body[:220].replace('\\n',' '))
          print('ODDS_SELECTS',[(n,s.select_one('#'+n).get_text(' ',strip=True)[:320] if s.select_one('#'+n) else 'missing') for n in ['js-umaBan','js-position']])
          print('SCRIPT_SRCS',[sc.get('src') for sc in scripts if sc.get('src')])
          for sc in scripts:
              body=sc.string or sc.get_text()
              if 'new window.sn.hr.searchBox' in body:print('ODDS_SEARCH_CONFIG',body[:1600])
          for h in s.select('[data-testid],[data-reactroot]')[:8]:
              print('ROOT_STRUCTURE',h.name,h.get('data-testid'),h.get('id'),h.get('class'))
          for f in s.select('form'):
              opts=[]
              for sel in f.select('select'):
                  option=sel.select('option')
                  opts.append({'name':sel.get('name'),'options':len(option),
                     'sample':[(o.get('value'),o.get_text(' ',strip=True)[:15]) for o in option[:5]]})
              print('FORM',f.get('method'),f.get('action'),'SELECTS',opts)
          PY
          python3 .github/scripts/jra-odds-recovery-v312.py \
            --input /tmp/ireland-v312-staging.json \
            --output /tmp/ireland-v312-recovered.json \
            --evidence-dir e2e_validation/quote-evidence/2026-10-11-ireland-trophy/v312-live-smoke
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ireland-v312-recovered.json').read_text())
          print('RECOVERY SUCCESS original unchanged. Total exact quotes:',len(d['market_quotes']))
          PY

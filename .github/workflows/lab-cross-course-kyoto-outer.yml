name: LAB cross-course Kyoto outer 1400 source-mask gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab-cross-course-kyoto-outer.yml"
      - "docs/lab/race-lab-cross-course-v1.*"
      - "docs/lab/race-lab-source-mask-v1.js"
      - "docs/lab/race-lab-course-rollout-v1.js"
      - "docs/lab/race-marker-visibility-v1.js"
      - "docs/lab/race-broadcast-pose-filter-v1.js"
      - "docs/lab/race-finish-broadcast-v2.js"
permissions: {contents: read}
jobs:
  source-turf-and-full-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Static reuse check
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const dir='docs/lab/';
          const html=fs.readFileSync(dir+'race-lab-cross-course-v1.html','utf8');
          const app=fs.readFileSync(dir+'race-lab-cross-course-v1.js','utf8');
          const mask=fs.readFileSync(dir+'race-lab-source-mask-v1.js','utf8');
          const rg=fs.readFileSync(dir+'race-lab-course-rollout-v1.js','utf8');
          assert.equal((html.match(/kyoto-umapot-course-clean-v8.svg/g)||[]).length,2);
          for(const key of ['RaceLabSourceMask.build','RaceSimEngine.create',
            'RaceFrameInterpolator.interpolate','RaceBroadcastHud.render',
            'RaceLabCourseRollout.assertCanAnimate',
            'markerVisibility.layout','markerTimeDriven:true',
            'broadcastPose.apply','cameraPose.apply',
            'RaceFinishBroadcastV2.render'])assert.ok(app.includes(key),key);
          assert.ok(mask.includes('badDiscs:bad'), 'Current common turf-mask failure counter');
          assert.ok(mask.includes('maxProjectedStep'), 'Continuous image-motion audit');
          assert.ok(mask.includes('corridorFromOriginalSvg:true'), 'Preserve original green-turf source');
          assert.ok(mask.includes('new Path2D('), 'Use original source path identity');
          assert.ok(rg.includes('svgGreenPathIndices:[0]'), 'Outer path must be registered');
          assert.ok(rg.includes("blocked_svg_missing"));
          assert.ok(!html.includes('race-overview-distance-labels-v1.js'),
           'Unsupported distance labels must not be loaded');
          assert.ok(!app.includes('RaceOverviewDistanceLabels.draw'),
           'No distance overlay on source overview');
          assert.ok(!app.includes('h.anchorX,h.anchorY'),
           'Never draw branch/twig connector lines on the race numbers');
          const vm=require('node:vm'),context={};
          vm.runInNewContext(fs.readFileSync(dir+'race-marker-visibility-v1.js','utf8'),
           {window:context});
          const visibility=context.RaceMarkerVisibility.create();
          const near=Array.from({length:18},(_,i)=>({number:i+1,
           x:160+(i%6)*8,y:110+Math.floor(i/6)*6}));
          const norm=()=>({x:0,y:1});
          const first=visibility.layout(near,{normalAt:norm,timeSeconds:0});
          const baseline=visibility.metrics();
          for(let i=0;i<25;i++){
           const again=visibility.layout(near,{normalAt:norm,timeSeconds:0});
           assert.deepEqual(again.map(x=>[x.x,x.y,x.labelOffset]),
            first.map(x=>[x.x,x.y,x.labelOffset]),
            'Repeated painting at the same virtual time must not move numbers');
          }
          assert.equal(visibility.metrics().solverRuns,1);
          assert.ok(baseline.after.penalty<baseline.base.penalty);
          const later=visibility.layout(near,{normalAt:norm,timeSeconds:.1});
          for(let i=0;i<later.length;i++)
           assert.ok(Math.abs(later[i].labelOffset-first[i].labelOffset)<=1.21,
            'Position offsets must be bounded by elapsed simulation time');
          assert.equal(context.RaceMarkerVisibility.paintIdempotent,true);
          const poseApi={};
          vm.runInNewContext(fs.readFileSync(dir+'race-broadcast-pose-filter-v1.js','utf8'),
           {window:poseApi});
          const pose=poseApi.RaceBroadcastPoseFilter.create();
          const input=Array.from({length:18},(_,i)=>({number:i+1,x:10+i*.5,y:20+i*.7}));
          const original=JSON.stringify(input);
          const poseA=pose.apply(input,{timeSeconds:0,containsDisc:()=>true});
          for(let i=0;i<30;i++){
           const same=pose.apply(input,{timeSeconds:0,containsDisc:()=>true});
           assert.deepEqual(same,poseA,'Source image poses must not change at paused clock');
          }
          const moved=input.map(p=>({...p,x:p.x+1.5,y:p.y+.2}));
          const poseB=pose.apply(moved,{timeSeconds:.06,containsDisc:()=>true});
          assert.ok(poseB.every((p,i)=>
            Math.hypot(p.x-moved[i].x,p.y-moved[i].y)<=1.1501),
           'Smoothing must be bounded by maximum safe physical image offset');
          assert.equal(JSON.stringify(input),original,'Physical input must not mutate');
          const finish={};
          vm.runInNewContext(fs.readFileSync(dir+'race-finish-broadcast-v2.js','utf8'),
           {window:finish});
          assert.equal(finish.RaceFinishBroadcastV2.transitionRemainingM,100);
          assert.equal(finish.RaceFinishBroadcastV2.sourceGeometryIndependent,true);
          assert.ok(fs.readFileSync(dir+'race-finish-broadcast-v2.js','utf8')
           .includes("bezierCurveTo"), 'Green white goal arch must be curved');
          assert.equal(poseApi.RaceBroadcastPoseFilter.courseIndependent,true);
          console.log('PASS_COURSE_COMMON_COMPONENTS_NO_SOURCE_REDRAW');
          JS
      - name: Install Safari and Chrome tools
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps webkit
          python3 -m http.server 8801 --directory docs >/tmp/lab-outer-server.log 2>&1 &
          sleep 2
          mkdir -p /tmp/lab-outer-screens
      - name: Gate source-turf safety and verify 1400m race
        run: |
          python3 - <<'PY'
          import json,shutil
          from playwright.sync_api import sync_playwright
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          assert chrome,'CHROME_NOT_FOUND'
          with sync_playwright() as p:
           for name in ['chromium','webkit']:
            browser=(p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox'])
              if name=='chromium' else p.webkit.launch(headless=True))
            page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=3)
            errors=[];page.on('pageerror',lambda err:errors.append(str(err)))
            page.goto('http://127.0.0.1:8801/lab/race-lab-cross-course-v1.html?v=1',
              wait_until='load',timeout=40000)
            page.wait_for_function("window.CrossCoursePilot && CrossCoursePilot.inspect().ready || CrossCoursePilot.inspect().blocked",
              timeout=25000)
            snapshot=page.evaluate("() => ({inspection:CrossCoursePilot.inspect(),route:CrossCoursePilot.routeReport(),speed:document.querySelector('#speed').value})")
            print('CROSS_COURSE_BOOT',name,json.dumps(snapshot,ensure_ascii=False))
            assert not errors,errors
            assert snapshot['inspection']['ready'],snapshot
            assert not snapshot['inspection']['blocked'],snapshot
            assert snapshot['route']['badDiscs']==0,snapshot
            assert snapshot['route']['strictOriginalPathTopology'] is True,snapshot
            assert snapshot['route']['sourcePathIndices']==[0],snapshot
            assert snapshot['route']['maxProjectedStep']<=2,snapshot
            assert snapshot['speed']=='2'
            assert snapshot['inspection']['sharedVisualMode'] is True
            assert page.evaluate("() => typeof RaceMarkerVisibility.create")== 'function'
            assert page.evaluate("() => RaceMarkerVisibility.paintIdempotent") is True
            assert page.evaluate("() => RaceBroadcastPoseFilter.courseIndependent") is True
            assert page.evaluate("() => RaceFinishBroadcastV2.transitionRemainingM")==100
            assert snapshot['inspection']['finishCameraThreshold']==100
            assert not snapshot['inspection']['finishCameraActive']
            assert snapshot['inspection']['markerTimeDriven'] is True
            assert not page.evaluate("() => 'RaceOverviewDistanceLabels' in window")
            # Explicit 3C/4C snapshot gate, not just 'green pixels anywhere'.
            # It uses the same physical engine and the same outer source stroke.
            for metres in (600,720,850,950):
             reached=page.evaluate("(metres) => CrossCoursePilot.seekTo(metres)",metres)
             assert reached>=metres and not errors,(name,metres,reached,errors)
             first_preview=page.evaluate("""() => ({
               metric:CrossCoursePilot.previewFrame(),
               image:document.querySelector('#liveCourseImage').style.transform
             })""")
             for _ in range(20):
              page.evaluate("() => CrossCoursePilot.previewFrame()")
             visible=page.evaluate("() => CrossCoursePilot.visualMetrics()")
             last_transform=page.evaluate("() => document.querySelector('#liveCourseImage').style.transform")
             assert first_preview['metric']==visible,(name,metres,'PAINT_JITTER')
             assert last_transform==first_preview['image'],(name,metres,'CAMERA_JITTER')
             assert visible['solverRuns']==1,(name,metres,'REPLANNED_WITHOUT_TIME')
             print('CROSS_COURSE_LABEL_VISIBILITY',name,metres,json.dumps(visible))
             assert visible['physicalPositionsUnchanged'] is True
             assert visible['maxShiftPx']<=18.01
             stabilized=page.evaluate("() => CrossCoursePilot.broadcastPoints()")
             assert len(stabilized)==18
             assert max((((h['x']-h['rawX'])**2+(h['y']-h['rawY'])**2)**.5)
              for h in stabilized)<=1.151
             assert visible['after']['penalty'] <= visible['base']['penalty']*1.1+1
             assert page.evaluate("() => document.querySelector('.race-overview-view .status').textContent.includes('距離目盛りなし')")
             page.locator('#broadcastStage').screenshot(
               path=f'/tmp/lab-outer-screens/{name}-outer-{metres}m.png')
            assert page.evaluate("() => CrossCoursePilot.routeReport().sourcePathIndices")==[0]
            before=page.evaluate("() => CrossCoursePilot.seekTo(1290)")
            assert before>=1290
            assert page.evaluate("() => CrossCoursePilot.inspect().finishCameraActive") is False
            after=page.evaluate("() => CrossCoursePilot.seekTo(1319)")
            assert after>=1319
            close=page.evaluate("""() => ({
             inspect:CrossCoursePilot.inspect(),
             view:CrossCoursePilot.finishView(),
             opacity:getComputedStyle(document.querySelector('#goalCamera')).opacity,
             fontSize:getComputedStyle(document.querySelector('#clock')).fontSize
            })""")
            print('CROSS_COURSE_FINISH_CAMERA_100M',name,json.dumps(close,ensure_ascii=False))
            assert close['inspect']['finishCameraActive'] is True
            assert close['view']['mode']=='finish-100m-camera'
            assert close['view']['venueLabel']=='KYOTO'
            assert float(close['opacity'])>=.99
            assert close['view']['visible']>=1
            page.locator('#broadcastStage').screenshot(
              path=f'/tmp/lab-outer-screens/{name}-last-80m-goal-arch.png')
            page.locator('#resetBtn').click()
            clock_font=page.evaluate("() => getComputedStyle(document.querySelector('#clock')).fontSize")
            assert float(clock_font.replace('px',''))<=22,clock_font
            page.locator('#broadcastStage').screenshot(path='/tmp/lab-outer-screens/'+name+'-start.png')
            page.locator('#speed').select_option('4')
            page.locator('#startBtn').click()
            page.wait_for_function("CrossCoursePilot.state()?.finished===true",timeout=40000)
            result=page.evaluate("""() => ({
             finish:CrossCoursePilot.state().firstFinishTime,
             split:CrossCoursePilot.state().splitTime,
             rows:document.querySelectorAll('#resultsBody tr').length,
             icao:document.querySelector('#clock').textContent,
             podium:document.querySelector('#finishPodium').textContent
            })""")
            print('CROSS_COURSE_FINISH',name,json.dumps(result,ensure_ascii=False))
            assert result['finish']>0 and result['split']>0
            assert result['rows']==18 and '1着' in result['podium'] and '3着' in result['podium']
            page.locator('#fullResults').screenshot(path='/tmp/lab-outer-screens/'+name+'-finish.png')
            if name=='chromium':
             wide=browser.new_page(viewport={'width':1100,'height':800})
             wide.goto('http://127.0.0.1:8801/lab/race-lab-cross-course-v1.html?v=34',wait_until='load')
             wide.wait_for_function("CrossCoursePilot.inspect().ready || CrossCoursePilot.inspect().blocked",timeout=25000)
             layout=wide.evaluate("""() => {
               const a=document.querySelector('.race-broadcast-view').getBoundingClientRect();
               const b=document.querySelector('.race-overview-view').getBoundingClientRect();
               return {leftRight:a.right,rightLeft:b.left,liveWidth:a.width,mapWidth:b.width,
                 label:document.querySelector('.race-overview-view .status').textContent,
                 viewGrid:getComputedStyle(document.querySelector('.race-view-grid')).gridTemplateColumns};
             }""")
             print('CROSS_COURSE_DESKTOP_LAYOUT',json.dumps(layout))
             assert abs(layout['leftRight']-layout['rightLeft'])<=2,layout
             assert layout['liveWidth']>layout['mapWidth'],layout
             assert '距離目盛りなし' in layout['label'],layout
             wide.screenshot(path='/tmp/lab-outer-screens/chromium-desktop-v31.png',full_page=True)
             wide.close()
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-course-kyoto-outer-1400
          path: /tmp/lab-outer-screens
          retention-days: 7

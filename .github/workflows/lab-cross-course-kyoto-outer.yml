name: LAB cross-course Kyoto outer 1400 source-mask gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab-cross-course-kyoto-outer.yml"
      - "docs/lab/race-lab-cross-course-v1.*"
      - "docs/lab/race-lab-source-mask-v1.js"
      - "docs/lab/race-lab-course-rollout-v1.js"
      - "docs/lab/race-marker-visibility-v1.js"
      - "docs/lab/race-trackside-furniture-v1.js"
      - "docs/lab/race-broadcast-pose-filter-v1.js"
      - "docs/lab/race-finish-broadcast-v2.js"
      - "docs/lab/race-finish-fixed-camera-v1.js"
      - "docs/lab/race-native-broadcast-v1.js"
permissions: {contents: read}
jobs:
  source-turf-and-full-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Static reuse check
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const dir='docs/lab/';
          const html=fs.readFileSync(dir+'race-lab-cross-course-v1.html','utf8');
          const app=fs.readFileSync(dir+'race-lab-cross-course-v1.js','utf8');
          const mask=fs.readFileSync(dir+'race-lab-source-mask-v1.js','utf8');
          const rg=fs.readFileSync(dir+'race-lab-course-rollout-v1.js','utf8');
          assert.equal((html.match(/kyoto-umapot-course-clean-v8.svg/g)||[]).length,2);
          for(const key of ['RaceLabSourceMask.build','RaceSimEngine.create',
            'RaceFrameInterpolator.interpolate','RaceBroadcastHud.render',
            'RaceLabCourseRollout.assertCanAnimate',
            'markerVisibility.layout','markerTimeDriven:true',
            'fixedFinish.render','RaceNativeBroadcast.create',
            'RaceTracksideFurniture.startGate',
            'nativeCamera.frame'])assert.ok(app.includes(key),key);
          assert.ok(mask.includes('badDiscs:bad'), 'Current common turf-mask failure counter');
          assert.ok(mask.includes('maxProjectedStep'), 'Continuous image-motion audit');
          assert.ok(mask.includes('corridorFromOriginalSvg:true'), 'Preserve original green-turf source');
          assert.ok(mask.includes('new Path2D('), 'Use original source path identity');
          assert.ok(rg.includes('svgGreenPathIndices:[0]'), 'Outer path must be registered');
          assert.ok(rg.includes("blocked_svg_missing"));
          assert.ok(!html.includes('race-overview-distance-labels-v1.js'),
           'Unsupported distance labels must not be loaded');
          assert.ok(!app.includes('RaceOverviewDistanceLabels.draw'),
           'No distance overlay on source overview');
          assert.ok(!app.includes('h.anchorX,h.anchorY'),
           'Never draw branch/twig connector lines on the race numbers');
          const vm=require('node:vm'),context={};
          vm.runInNewContext(fs.readFileSync(dir+'race-marker-visibility-v1.js','utf8'),
           {window:context});
          const visibility=context.RaceMarkerVisibility.create();
          const near=Array.from({length:18},(_,i)=>({number:i+1,
           x:160+(i%6)*8,y:110+Math.floor(i/6)*6}));
          const norm=()=>({x:0,y:1});
          const first=visibility.layout(near,{normalAt:norm,timeSeconds:0});
          const baseline=visibility.metrics();
          for(let i=0;i<25;i++){
           const again=visibility.layout(near,{normalAt:norm,timeSeconds:0});
           assert.deepEqual(again.map(x=>[x.x,x.y,x.labelOffset]),
            first.map(x=>[x.x,x.y,x.labelOffset]),
            'Repeated painting at the same virtual time must not move numbers');
          }
          assert.equal(visibility.metrics().solverRuns,1);
          assert.ok(baseline.after.penalty<baseline.base.penalty);
          const later=visibility.layout(near,{normalAt:norm,timeSeconds:.1});
          for(let i=0;i<later.length;i++)
           assert.ok(Math.abs(later[i].labelOffset-first[i].labelOffset)<=1.21,
            'Position offsets must be bounded by elapsed simulation time');
          assert.equal(context.RaceMarkerVisibility.paintIdempotent,true);
          const steady=context.RaceMarkerVisibility.create({lockAfterFirstPlan:true});
          steady.layout(near,{normalAt:norm,timeSeconds:0});
          const initialLocked=steady.metrics();
          for(let sec=0.2;sec<=24;sec+=.2)
           steady.layout(near,{normalAt:norm,timeSeconds:sec});
          assert.equal(steady.metrics().solverRuns,1,
           'No further marker assignment after initial formation');
          assert.equal(steady.metrics().assignmentsFrozen,true);
          assert.ok(initialLocked.after.penalty<initialLocked.base.penalty);
          const poseApi={};
          vm.runInNewContext(fs.readFileSync(dir+'race-broadcast-pose-filter-v1.js','utf8'),
           {window:poseApi});
          const pose=poseApi.RaceBroadcastPoseFilter.create();
          const input=Array.from({length:18},(_,i)=>({number:i+1,x:10+i*.5,y:20+i*.7}));
          const original=JSON.stringify(input);
          const poseA=pose.apply(input,{timeSeconds:0,containsDisc:()=>true});
          for(let i=0;i<30;i++){
           const same=pose.apply(input,{timeSeconds:0,containsDisc:()=>true});
           assert.deepEqual(same,poseA,'Source image poses must not change at paused clock');
          }
          const moved=input.map(p=>({...p,x:p.x+1.5,y:p.y+.2}));
          const poseB=pose.apply(moved,{timeSeconds:.06,containsDisc:()=>true});
          assert.ok(poseB.every((p,i)=>
            Math.hypot(p.x-moved[i].x,p.y-moved[i].y)<=1.1501),
           'Smoothing must be bounded by maximum safe physical image offset');
          assert.equal(JSON.stringify(input),original,'Physical input must not mutate');
          const finish={};
          vm.runInNewContext(fs.readFileSync(dir+'race-finish-broadcast-v2.js','utf8'),
           {window:finish});
          assert.equal(finish.RaceFinishBroadcastV2.transitionRemainingM,100);
          assert.equal(finish.RaceFinishBroadcastV2.sourceGeometryIndependent,true);
          const spread=finish.RaceFinishBroadcastV2.packCamera({
           points:[{d:1380},{d:1358}],distance:1400,width:368,turn:'右'});
          assert.equal(spread.gap,22);
          assert.ok(spread.gap*spread.pxPerMetre>=115,
           '22m physical gap must occupy >=115px on mobile, not compressed to 40px');
          assert.equal(spread.cameraMode,'tracking-pack');
          const nearBoard=finish.RaceFinishBroadcastV2.packCamera({
           points:[{d:1395},{d:1373}],distance:1400,width:368,turn:'右'});
          assert.equal(nearBoard.cameraMode,'fixed-finish');
          assert.equal(finish.RaceFinishBroadcastV2.physicalGapScaleLinear,true);
          const fixed={};
          vm.runInNewContext(fs.readFileSync(dir+'race-finish-fixed-camera-v1.js','utf8'),
            {window:fixed});
          const api=fixed.RaceFinishFixedCamera;
          assert.equal(api.backgroundStatic,true);
          assert.equal(api.transitionRemainingM,60);
          assert.equal(api.courseIndependent,true);
          const furniture={};
          vm.runInNewContext(fs.readFileSync(dir+'race-trackside-furniture-v1.js','utf8'),
           {window:furniture});
          const furnish=furniture.RaceTracksideFurniture;
          assert.equal(furnish.courseIndependent,true);
          const ops=['save','restore','beginPath','moveTo','lineTo',
           'bezierCurveTo','stroke','fillRect','fillText',
           'roundRect','fill'];
          const dummy={};ops.forEach(name=>dummy[name]=()=>{});
          const rail=furnish.goal(dummy,{x:80,innerRailY:114,
           outerRailY:308,height:336,venueLabel:'KYOTO',railSide:'inner'});
          assert.ok(rail.outsideTurf);
          assert.ok(rail.bodyMaxY<rail.innerRailY,
           'Goal BOARD must sit beyond rail, never in mid turf');
          const railOuter=furnish.goal(dummy,{x:80,innerRailY:27,
           outerRailY:215,height:336,venueLabel:'TOKYO',railSide:'outer'});
          assert.ok(railOuter.outsideTurf&&railOuter.bodyMinY>railOuter.outerRailY);
          const routePt=(d,l)=>({x:100+d*.2,y:50+l*2});
          const proj=p=>p;
          const gate0=furnish.gateGeometry({point:routePt,project:proj});
          assert.equal(gate0.stalls,18);
          assert.ok(furnish.startGate(dummy,{point:routePt,project:proj,
            leaderD:0,overview:false})?.drawn);
          assert.equal(furnish.startGate(dummy,{point:routePt,project:proj,
            leaderD:30,overview:false}),null);
          assert.ok(!app.includes('RaceFinishBroadcastV2.render({canvas'),
           'Moving goal camera must never render in LAB fixed finish');
          const imageFrame=api.layout({width:340,height:336,turn:'右'});
          const p1=api.project({number:1,d:1350,lane:4},
           {distance:1400,frame:imageFrame});
          const p2=api.project({number:1,d:1370,lane:4},
           {distance:1400,frame:imageFrame});
          assert.ok(Math.abs((p1.x-p2.x)-
           20*imageFrame.pixelsPerMetre)<.00001,
           'Fixed image, equal physical metres must have equal screen spacing');
          assert.equal(p1.y,p2.y,'Horse lane remains fixed');
          assert.equal(imageFrame.boardX,340*.22,
           'Finish line is anchored to immutable fixed image');
          assert.ok(api.project({number:1,d:1340,lane:4},
            {distance:1400,frame:imageFrame}).x<340,
            'Leader should be visible at camera switch');
          assert.ok(api.project({number:18,d:1319,lane:5},
            {distance:1400,frame:imageFrame}).x<=340,
            'Rear horse should remain visible when camera begins');
          assert.ok(fs.readFileSync(dir+'race-finish-broadcast-v2.js','utf8')
           .includes("bezierCurveTo"), 'Green white goal arch must be curved');
          assert.equal(poseApi.RaceBroadcastPoseFilter.courseIndependent,true);
          const native={};
          vm.runInNewContext(fs.readFileSync(dir+'race-native-broadcast-v1.js','utf8'),
           {window:native});
          assert.equal(native.RaceNativeBroadcast.courseIndependent,true);
          assert.equal(native.RaceNativeBroadcast.sourceImageUnwarped,true);
          assert.equal(native.RaceNativeBroadcast.physicalPositionsUnchanged,true);
          assert.ok(fs.readFileSync(dir+'race-native-broadcast-v1.js','utf8')
             .includes('points.reduce('),'Follow whole field, not changing lead horse');
          assert.ok(fs.readFileSync(dir+'race-native-broadcast-v1.js','utf8')
             .includes('constantZoom:true'),'No zoom pumping');
          assert.ok(app.includes('lockAfterFirstPlan:true'));
          assert.ok(fs.readFileSync(dir+'race-native-broadcast-v1.js','utf8')
           .includes('ctx.drawImage(image,left,top,620*zoom,430*zoom)'),
            'TV must paint complete original SVG without raster strip replacement');
          assert.ok(!html.includes('race-distance-broadcast-v1.js'),
           'Invalid green-only ribbon must not be loaded by LAB');
          assert.ok(!app.includes('ribbonCamera.frame'),
           'Never reinstate synthetic green-only camera during last bend');
          console.log('PASS_COURSE_COMMON_COMPONENTS_NO_SOURCE_REDRAW');
          JS
      - name: Install Safari and Chrome tools
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps webkit
          python3 -m http.server 8801 --directory docs >/tmp/lab-outer-server.log 2>&1 &
          sleep 2
          mkdir -p /tmp/lab-outer-screens
      - name: Gate source-turf safety and verify 1400m race
        run: |
          python3 - <<'PY'
          import json,shutil
          from playwright.sync_api import sync_playwright
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          assert chrome,'CHROME_NOT_FOUND'
          with sync_playwright() as p:
           for name in ['chromium','webkit']:
            browser=(p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox'])
              if name=='chromium' else p.webkit.launch(headless=True))
            page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=3)
            errors=[];page.on('pageerror',lambda err:errors.append(str(err)))
            # This QA tests course rendering, not third-party visit analytics.
            # Mock only that external endpoint; retain all real app JS errors.
            page.route('**/counterapi.com/**',
              lambda route: route.fulfill(status=200,
                content_type='application/json',
                headers={'access-control-allow-origin':'*'},
                body='{"value":0,"count":0}'))
            page.goto('http://127.0.0.1:8801/lab/race-lab-cross-course-v1.html?v=43',
              wait_until='load',timeout=40000)
            page.wait_for_function("window.CrossCoursePilot && CrossCoursePilot.inspect().ready || CrossCoursePilot.inspect().blocked",
              timeout=25000)
            snapshot=page.evaluate("() => ({inspection:CrossCoursePilot.inspect(),route:CrossCoursePilot.routeReport(),speed:document.querySelector('#speed').value})")
            print('CROSS_COURSE_BOOT',name,json.dumps(snapshot,ensure_ascii=False))
            assert not errors,errors
            assert snapshot['inspection']['ready'],snapshot
            assert not snapshot['inspection']['blocked'],snapshot
            assert snapshot['route']['badDiscs']==0,snapshot
            assert snapshot['route']['strictOriginalPathTopology'] is True,snapshot
            assert snapshot['route']['sourcePathIndices']==[0],snapshot
            assert snapshot['route']['maxProjectedStep']<=2,snapshot
            assert snapshot['speed']=='2'
            assert snapshot['inspection']['sharedVisualMode'] is True
            assert snapshot['inspection']['atomicSvgCanvas'] is True
            assert page.evaluate("() => RaceNativeBroadcast.courseIndependent") is True
            assert snapshot['inspection']['nativeOriginalSvg'] is True
            assert snapshot['inspection']['startGateShown'] is True
            assert page.evaluate("() => CrossCoursePilot.startGate().broadcast") is True
            assert snapshot['inspection']['visibilityMetrics']['assignmentsFrozen'] is True
            assert snapshot['inspection']['visibilityMetrics']['solverRuns']==1
            assert snapshot['inspection']['ribbonCameraActive'] is False
            assert not page.evaluate("() => 'RaceDistanceBroadcast' in window")
            assert page.evaluate("() => getComputedStyle(document.querySelector('#liveCourseImage')).visibility")=='hidden'
            assert page.evaluate("() => typeof RaceMarkerVisibility.create")== 'function'
            assert page.evaluate("() => RaceMarkerVisibility.paintIdempotent") is True
            assert page.evaluate("() => RaceBroadcastPoseFilter.courseIndependent") is True
            assert page.evaluate("() => RaceFinishFixedCamera.transitionRemainingM")==60
            assert page.evaluate("() => RaceFinishFixedCamera.backgroundStatic") is True
            assert snapshot['inspection']['finishCameraThreshold']==60
            assert page.evaluate("() => RaceTracksideFurniture.courseIndependent") is True
            assert not snapshot['inspection']['finishCameraActive']
            assert snapshot['inspection']['markerTimeDriven'] is True
            assert not page.evaluate("() => 'RaceOverviewDistanceLabels' in window")
            # Dense source-path sample checks for a sudden fractional-metre
            # zigzag invisible to the earlier whole-metre validator.
            curve=page.evaluate("""() => {
             let maxQuarterStep=0,spikeCount=0,corr=0;
             for(const lane of [0,2,4,8,11,14]){
              let prev=CrossCoursePilot.sourcePoint(0,lane);
              for(let i=1;i<=1400*4;i++){
               const now=CrossCoursePilot.sourcePoint(i*.25,lane);
               const step=Math.hypot(now.x-prev.x,now.y-prev.y);
               maxQuarterStep=Math.max(step,maxQuarterStep);
               if(step>.5)spikeCount++;
               if(now.corrected>0)corr++;
               prev=now;
              }
             }
             return {maxQuarterStep,spikeCount,correctedSamples:corr};
            }""")
            print('CROSS_COURSE_QUARTER_METRE',name,json.dumps(curve))
            assert curve['spikeCount']==0,curve
            # Explicit 3C/4C snapshot gate, not just 'green pixels anywhere'.
            # It uses the same physical engine and the same outer source stroke.
            # Exact user-supplied regression point: screen at ~992m.
            for metres in (600,720,850,950,992):
             reached=page.evaluate("(metres) => CrossCoursePilot.seekTo(metres)",metres)
             assert reached>=metres and not errors,(name,metres,reached,errors)
             first_preview=page.evaluate("""() => ({
               metric:CrossCoursePilot.previewFrame(),
               image:document.querySelector('#liveCourseImage').style.transform
             })""")
             for _ in range(20):
              page.evaluate("() => CrossCoursePilot.previewFrame()")
             visible=page.evaluate("() => CrossCoursePilot.visualMetrics()")
             last_transform=page.evaluate("() => document.querySelector('#liveCourseImage').style.transform")
             assert first_preview['metric']==visible,(name,metres,'PAINT_JITTER')
             assert last_transform==first_preview['image'],(name,metres,'CAMERA_JITTER')
             assert visible['solverRuns']==1,(name,metres,'REPLANNED_WITHOUT_TIME')
             print('CROSS_COURSE_LABEL_VISIBILITY',name,metres,json.dumps(visible))
             assert visible['physicalPositionsUnchanged'] is True
             assert visible['maxShiftPx']<=18.01
             stabilized=page.evaluate("() => CrossCoursePilot.broadcastPoints()")
             assert len(stabilized)==18
             assert max((((h['x']-h['rawX'])**2+(h['y']-h['rawY'])**2)**.5)
              for h in stabilized)<=1.151
             assert visible['after']['penalty'] <= visible['base']['penalty']*1.1+1
             camera=page.evaluate("() => CrossCoursePilot.nativeCamera()")
             assert camera and camera['mode']=='native-original-svg'
             assert camera['unwarpedSourceImage'] is True
             assert camera['physicalPositionsUnchanged'] is True
             assert camera['cameraTarget']=='all-runners-mean'
             assert camera['constantZoom'] is True
             assert visible['assignmentsFrozen'] is True
             assert visible['solverRuns']==1
             assert page.evaluate("() => CrossCoursePilot.startGate().overview") is False
             assert camera['truePhysicalGapM']>21
             assert 8.3<=camera['zoom']<=11.01
             # Read the ACTUAL canvas pixels, not the JavaScript mode label.
             # A solid-green ribbon lacks the brown / white native track
             # context; that was the user-visible v41 regression.
             colors=page.evaluate("""() => {
              const el=document.querySelector('#broadcast'),
               ctx=el.getContext('2d'),w=el.width,h=el.height,
               raw=ctx.getImageData(0,0,w,h).data;
              let green=0,brown=0,opaque=0;
              for(let y=Math.floor(h*.18);y<h;y+=9)
               for(let x=Math.floor(w*.07);x<w*.93;x+=9){
                const i=(y*w+x)*4,r=raw[i],g=raw[i+1],
                 b=raw[i+2],a=raw[i+3];
                if(a<245)continue;
                opaque++;
                if(g>r*1.25&&g>b*1.18&&g>82)green++;
                if(r>g*1.25&&g>b*1.2&&r>90&&g>54)brown++;
               }
              return {green,brown,opaque,greenRatio:green/Math.max(1,opaque)};
             }""")
             print('CROSS_COURSE_REAL_TRACK_COLORS',name,metres,json.dumps(colors))
             assert colors['opaque']>300,colors
             assert colors['green']>15,colors
             assert colors['greenRatio']<.95,colors
             assert camera['sourceSvgDimensions']==[620,430]
             assert page.evaluate("() => CrossCoursePilot.distanceCamera()") is None
             assert page.evaluate("() => document.querySelector('.race-overview-view .status').textContent.includes('距離目盛りなし')")
             page.locator('#broadcastStage').screenshot(
               path=f'/tmp/lab-outer-screens/{name}-outer-{metres}m.png')
            assert page.evaluate("() => CrossCoursePilot.routeReport().sourcePathIndices")==[0]
            before=page.evaluate("() => CrossCoursePilot.seekTo(1335)")
            assert before>=1335
            assert page.evaluate("() => CrossCoursePilot.inspect().finishCameraActive") is False
            after=page.evaluate("() => CrossCoursePilot.seekTo(1343)")
            assert after>=1343
            fixed1=page.evaluate("""() => ({
              info:CrossCoursePilot.inspect(),
              result:CrossCoursePilot.finishView(),
              opacity:getComputedStyle(document.querySelector('#goalCamera')).opacity
            })""")
            print('FIXED_FINISH_BEGIN',name,json.dumps({
              'position':after,'boardX':fixed1['result']['boardX'],
              'visible':fixed1['result']['visible'],
              'backgroundBuilds':fixed1['result']['backgroundBuilds']
            },ensure_ascii=False))
            assert fixed1['info']['finishCameraActive'] is True
            assert fixed1['info']['fixedFinishBackground'] is True
            assert fixed1['result']['mode']=='fixed-finish-background'
            assert fixed1['result']['backgroundFixed'] is True
            assert fixed1['result']['backgroundBuilds']==1
            assert fixed1['result']['boardOutsideRail'] is True
            assert fixed1['result']['goalPostSide']=='inner'
            assert fixed1['result']['innerRailY']>100
            assert fixed1['result']['visible']>=17
            assert len(fixed1['result']['projected'])==18
            assert .2<=float(fixed1['opacity'])<=1, 'Fixed background crossfades over four metres'
            # Painting the SAME clock repeatedly must not repaint the backdrop.
            page.evaluate("() => Array.from({length:20},()=>CrossCoursePilot.previewFrame())")
            same=page.evaluate("() => CrossCoursePilot.finishView()")
            assert same['backgroundBuilds']==1
            assert same['boardX']==fixed1['result']['boardX']
            assert same['backgroundKey']==fixed1['result']['backgroundKey']
            assert same['projected']==fixed1['result']['projected']
            page.locator('#broadcastStage').screenshot(
             path=f'/tmp/lab-outer-screens/{name}-static-finish-57m.png')
            reached=page.evaluate("() => CrossCoursePilot.seekTo(1370)")
            assert reached>=1370
            fixed2=page.evaluate("() => CrossCoursePilot.finishView()")
            assert fixed2['backgroundBuilds']==1
            assert fixed2['boardX']==fixed1['result']['boardX']
            assert fixed2['backgroundKey']==fixed1['result']['backgroundKey']
            assert fixed2['pixelsPerMetre']==fixed1['result']['pixelsPerMetre']
            pfirst={p['number']:p for p in fixed1['result']['projected']}
            for runner in fixed2['projected']:
             assert runner['x']<=pfirst[runner['number']]['x']+.001
             assert abs((runner['x']-pfirst[runner['number']]['x'])+
              (runner['d']-pfirst[runner['number']]['d'])*fixed2['pixelsPerMetre'])<.001
            page.locator('#broadcastStage').screenshot(
             path=f'/tmp/lab-outer-screens/{name}-static-finish-30m.png')
            reached=page.evaluate("() => CrossCoursePilot.seekTo(1391)")
            assert reached>=1391
            fixed3=page.evaluate("() => CrossCoursePilot.finishView()")
            assert fixed3['backgroundBuilds']==1
            assert fixed3['boardX']==fixed1['result']['boardX']
            assert fixed3['visible']>=12
            assert len(fixed3['projected'])==18
            page.locator('#broadcastStage').screenshot(
             path=f'/tmp/lab-outer-screens/{name}-static-finish-9m.png')
            page.locator('#resetBtn').click()
            clock_font=page.evaluate("() => getComputedStyle(document.querySelector('#clock')).fontSize")
            assert float(clock_font.replace('px',''))<=22,clock_font
            page.locator('#broadcastStage').screenshot(path='/tmp/lab-outer-screens/'+name+'-start.png')
            page.locator('#speed').select_option('4')
            page.locator('#startBtn').click()
            page.wait_for_function("CrossCoursePilot.state()?.finished===true",timeout=40000)
            result=page.evaluate("""() => ({
             finish:CrossCoursePilot.state().firstFinishTime,
             split:CrossCoursePilot.state().splitTime,
             rows:document.querySelectorAll('#resultsBody tr').length,
             icao:document.querySelector('#clock').textContent,
             podium:document.querySelector('#finishPodium').textContent
            })""")
            print('CROSS_COURSE_FINISH',name,json.dumps(result,ensure_ascii=False))
            assert result['finish']>0 and result['split']>0
            assert result['rows']==18 and '1着' in result['podium'] and '3着' in result['podium']
            page.locator('#fullResults').screenshot(path='/tmp/lab-outer-screens/'+name+'-finish.png')
            if name=='chromium':
             wide=browser.new_page(viewport={'width':1100,'height':800})
             wide.goto('http://127.0.0.1:8801/lab/race-lab-cross-course-v1.html?v=34',wait_until='load')
             wide.wait_for_function("CrossCoursePilot.inspect().ready || CrossCoursePilot.inspect().blocked",timeout=25000)
             layout=wide.evaluate("""() => {
               const a=document.querySelector('.race-broadcast-view').getBoundingClientRect();
               const b=document.querySelector('.race-overview-view').getBoundingClientRect();
               return {leftRight:a.right,rightLeft:b.left,liveWidth:a.width,mapWidth:b.width,
                 label:document.querySelector('.race-overview-view .status').textContent,
                 viewGrid:getComputedStyle(document.querySelector('.race-view-grid')).gridTemplateColumns};
             }""")
             print('CROSS_COURSE_DESKTOP_LAYOUT',json.dumps(layout))
             assert abs(layout['leftRight']-layout['rightLeft'])<=2,layout
             assert layout['liveWidth']>layout['mapWidth'],layout
             assert '距離目盛りなし' in layout['label'],layout
             wide.screenshot(path='/tmp/lab-outer-screens/chromium-desktop-v31.png',full_page=True)
             wide.close()
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:

name: Inspect official plane maps (stage only)
on:
  push:
    paths:
      - '.github/workflows/staging-jra-plan-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Emit reduced source plan previews for reference drawing, no image upload
        run: |
          python3 -m pip install -q Pillow
          python3 - <<'PY'
          from PIL import Image
          import urllib.request,base64,io,collections
          for venue in ('tokyo','kyoto'):
            url='https://www.jra.go.jp/facilities/race/'+venue+'/course/img/pic_course_heimenzu.gif'
            try:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CourseGeometryStage/1.0'}),timeout=20).read()
              im=Image.open(io.BytesIO(data)).convert('RGB')
              print('SOURCE',venue,im.size,flush=True)
              print('TOP_COLORS',venue,collections.Counter(im.getdata()).most_common(14),flush=True)
              im.thumbnail((565,380))
              out=io.BytesIO();im.save(out,format='PNG',optimize=True)
              s=base64.b64encode(out.getvalue()).decode('ascii')
              print('PREVIEW_'+venue.upper()+'_START',flush=True)
              print(s,flush=True)
              print('PREVIEW_'+venue.upper()+'_END',flush=True)
            except Exception as ex:print('MAP_PREVIEW_FAILED',venue,str(ex),flush=True)
          PY
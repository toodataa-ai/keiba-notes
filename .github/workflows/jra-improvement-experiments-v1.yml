name: JRA pre-registered challenger experiments (research only, no promotion)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jra-improvement-experiments-v1.yml'
      - 'docs/data/races.json'
      - 'e2e_validation/results/**'
      - 'e2e_validation/predictions/**'
      - 'e2e_validation/improvement_experiments_v1.json'
      - 'e2e_validation/experiment_runner_v1.py'
      - 'e2e_validation/portfolio_eval_v1.py'
      - 'e2e_validation/test_portfolio_v1.py'
      - 'e2e_validation/quote-evidence/**'
      - 'e2e_validation/challengers/**'
      - 'e2e_validation/improvement_cycle_v1.py'
      - 'e2e_validation/test_experiment_runner_v1.py'
  schedule:
    # 22:23 JST daily: picks up results and E2E entries committed by bot workflows
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  # Shares the group with the postrace E2E publisher: both rewrite jra_improvement_cycle_v1.json
  group: jra-postrace-e2e-public-v1
  cancel-in-progress: false
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test challenger code pin, scoring and non-promotion
        run: |
          python -m unittest e2e_validation.test_experiment_runner_v1 -v
          python -m unittest e2e_validation.test_improvement_cycle_v1 -v
          python -m unittest e2e_validation.test_portfolio_v1 -v
      - name: Score registered challengers against the sealed formal STEP1
        run: |
          python e2e_validation/experiment_runner_v1.py
          python e2e_validation/improvement_cycle_v1.py
          python3 - <<'PY'
          import json
          x=json.load(open('docs/data/jra_experiment_status_v1.json'))
          assert x['automatic_promotion'] is False and not x['errors'], x['errors']
          c=json.load(open('docs/data/jra_improvement_cycle_v1.json'))
          assert c['gates']['automated_prompt_change'] is False
          for e in x['experiments']:
              print('EXPERIMENT', e['id'], 'prospective', e['prospective'].get('pairs'), 'remaining', e['remaining_prospective_pairs'], 'replay', e['replay_support_only'].get('pairs'))
          PY
      - name: Commit derived experiment records only (regenerate on latest main, never rebase derived files)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python e2e_validation/experiment_runner_v1.py
            python e2e_validation/improvement_cycle_v1.py
            git add docs/data/jra_experiment_status_v1.json docs/data/jra_improvement_cycle_v1.json e2e_validation/experiments/
            if git diff --cached --quiet; then echo 'No experiment changes'; exit 0; fi
            git commit -q -m 'Score pre-registered JRA challenger experiments (research only)'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*3))
          done
          echo 'Could not push experiment records'; exit 1
      - name: Open one approval-review Issue per experiment that reached the paired minimum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python e2e_validation/experiment_ready_issue_v1.py > "$RUNNER_TEMP/ready.jsonl"
          if [ ! -s "$RUNNER_TEMP/ready.jsonl" ]; then echo 'No experiment ready for review'; exit 0; fi
          gh label create experiment-ready --color 0E8A16 --description '新旧比較が規定件数に到達（手動A/B/C判定待ち）' 2>/dev/null || true
          while IFS= read -r line; do
            title=$(printf '%s' "$line" | jq -r .title)
            id=$(printf '%s' "$line" | jq -r .experiment_id)
            existing=$(gh issue list --state all --label experiment-ready --limit 200 --json title --jq "[.[]|select(.title|contains(\"$id\"))]|length")
            if [ "$existing" != "0" ]; then echo "Issue already exists for $id"; continue; fi
            printf '%s' "$line" | jq -r .body > "$RUNNER_TEMP/body.md"
            gh issue create --title "$title" --label experiment-ready --body-file "$RUNNER_TEMP/body.md"
          done < "$RUNNER_TEMP/ready.jsonl"

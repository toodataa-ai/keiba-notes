name: Local Racing Shadow Publish Audit
on:
  schedule:
    - cron: '7 0-14 * * *' # 09:07-23:07 JST, UTC
    - cron: '7 23 * * *'   # 08:07 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-racing-shadow-publish
  cancel-in-progress: false
jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and mirror committed Shadow research data
        run: python local_racing_shadow_v1/publish_audit.py
      - name: Commit only local Shadow public artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/local-racing-shadow docs/data/local_racing_shadow_public.json docs/data/local_racing_shadow_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish audited local racing Shadow data"
            git push
          fi

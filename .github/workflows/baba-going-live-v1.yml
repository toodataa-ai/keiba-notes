name: Baba going prediction - race-day morning (record only)
# Fukushima and Hanshin (user decision 2026-11-03: adopt; Hanshin added the same day). Saves a record; it does NOT change any official prediction.
on:
  schedule:
    - cron: '45 23 * * 5,6,0'   # 08:45 JST Sat/Sun/Mon
  workflow_dispatch:
    inputs:
      date: {description: 'JST date YYYY-MM-DD (blank = today)', required: false, default: ''}
      track: {description: 'blank = fukushima and hanshin; or one track name (testing)', required: false, default: ''}
permissions:
  contents: write
concurrency:
  group: baba-going-live-v1
  cancel-in-progress: false
jobs:
  predict:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        track: [fukushima, hanshin]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Skip this track when a single track was requested
        env:
          WANT: ${{ inputs.track }}
          MINE: ${{ matrix.track }}
        run: |
          if [ -n "${WANT:-}" ] && [ "$WANT" != "$MINE" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "skip $MINE"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with: {ref: main}
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with: {python-version: '3.12'}
      - if: env.SKIP != '1'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 numpy pandas scikit-learn
      - name: Tests
        if: env.SKIP != '1'
        working-directory: baba_models_v2
        run: python -W ignore -m unittest test_jra_going_now test_going_predict_live
      - name: Refresh the last few race days' official results (previous-day features)
        if: env.SKIP != '1'
        working-directory: baba_models_v2
        run: |
          D="${{ inputs.date }}"; if [ -z "$D" ]; then D=$(TZ=Asia/Tokyo date +%F); fi
          T="${{ matrix.track }}"
          echo "DAY=$D" >> "$GITHUB_ENV"; echo "TRACK=$T" >> "$GITHUB_ENV"
          python - <<PY
          import datetime as dt
          d=dt.date.fromisoformat("$D"); a=(d.replace(day=1)-dt.timedelta(days=1)).strftime('%Y%m'); b=d.strftime('%Y%m')
          open('/tmp/range','w').write(a+' '+b)
          PY
          read A B < /tmp/range || true
          python jra_going_labels.py index --start $A --end $B --out /tmp/days.json
          python - <<PY
          import json, datetime as dt
          d=dt.date.fromisoformat("$D"); lo=(d-dt.timedelta(days=5)).isoformat(); hi=(d-dt.timedelta(days=1)).isoformat()
          TJ={'fukushima':'福島','tokyo':'東京','kyoto':'京都','nakayama':'中山','hanshin':'阪神','niigata':'新潟','chukyo':'中京','kokura':'小倉','sapporo':'札幌','hakodate':'函館'}['$T']
          x=json.load(open('/tmp/days.json',encoding='utf-8'))
          x['days']=[r for r in x['days'] if lo<=r['date']<=hi and r['track']==TJ]
          print('recent Fukushima days', [r['date'] for r in x['days']])
          json.dump(x,open('/tmp/days_recent.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          mkdir -p going_labels/recent
          python jra_going_labels.py collect --days /tmp/days_recent.json --year "${D:0:4}" --out going_labels/recent/recent.csv || true
      - name: Predict (record only)
        if: env.SKIP != '1'
        working-directory: baba_models_v2
        run: python -W ignore going_predict_live.py --track "$TRACK" --date "$DAY"
      - name: Commit the record
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baba_models_v2/live
          git commit -m "Going prediction record (Fukushima) $DAY" || exit 0
          for i in 1 2 3 4 5; do git fetch origin main && git rebase origin/main && git push origin HEAD:main && break; sleep 3; done

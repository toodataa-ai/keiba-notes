name: LAB v24 real-time clock and steady shared marker motion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-v24-clock-and-motion-qa.yml'
      - 'docs/lab/race-frame-interpolator-v1.js'
      - 'docs/lab/race-clean-course-app-v1.js'
      - 'docs/lab/race-clean-course-v1.html'
      - 'tools/test_race_clean_course_v1.cjs'
permissions: {contents: read}
jobs:
  motion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate original engine, source SVG, shared timeline and fixed-step interpolation
        run: |
          node tools/test_race_clean_course_v1.cjs
      - name: Start Chrome and iPhone WebKit
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps webkit
          python3 -m http.server 8799 --directory docs >/tmp/lab-v24-http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/lab-v24-screenshots
      - name: Measure physical simulation rate and frame-to-frame motion with real 17 runners and 18 fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,shutil,math
          from playwright.sync_api import sync_playwright
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          assert chrome,'CHROME_MISSING'
          with sync_playwright() as p:
           for engine in ['chromium','webkit']:
            browser=(p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
             if engine=='chromium' else p.webkit.launch(headless=True))
            for width in ([390,1024] if engine=='chromium' else [390]):
             context=browser.new_context(viewport={'width':width,'height':844},
               device_scale_factor=3 if width==390 else 2)
             page=context.new_page()
             errors=[]
             page.on('pageerror',lambda ex:errors.append(str(ex)))
             url='http://127.0.0.1:8799/lab/race-clean-course-v1.html?trial=shuka2026&checkpoint=1200&v=24'
             page.goto(url,wait_until='load',timeout=45000)
             page.wait_for_function("window.CleanLab?.inspect()?.sharedGeometryEnabled===true",timeout=40000)
             initial=page.evaluate("""() => ({
              speed:document.querySelector('#speed').value,
              trial:CleanLab.trial(),motion:CleanLab.inspect().motionModel,
              field:CleanLab.getState().horses.length,
              currentImage:document.querySelector('#liveCourseImage').getAttribute('src'),
              originalImage:document.querySelector('#realCourseImage').getAttribute('src'),
              sourceError:CleanLab.inspect().turfError
             })""")
             print('LAB_V24_INITIAL',engine,width,json.dumps(initial,ensure_ascii=False))
             assert initial['speed']=='1'
             assert initial['motion']=='fixed-pose-interpolation'
             assert initial['field']==17
             assert initial['currentImage']==initial['originalImage']=='assets/kyoto-umapot-course-clean-v8.svg'
             assert not initial['sourceError'] and not errors,errors
             page.locator('#startBtn').click()
             # Sample each browser paint using requestAnimationFrame. Also measure
             # the virtual clock against MONOTONIC wall time for the 1x default.
             metrics=page.evaluate("""async () => {
              const history=[];
              return await new Promise(resolve=>{
                const begin=performance.now();
                function poll(now){
                  const sample=CleanLab.frameSample();
                  const state=CleanLab.getState();
                  const horse=sample.horses.find(h=>h.number===13);
                  if(horse)history.push([now-begin,horse.d,sample.motionAlpha,state.t]);
                  if(now-begin<1100)requestAnimationFrame(poll);
                  else resolve({wall:now-begin,history,clock:state.t});
                }
                requestAnimationFrame(poll);
              });
             }""")
             d=[z[1] for z in metrics['history']]
             wall=metrics['wall']/1000
             step=metrics['history'][-1][3]-metrics['history'][0][3]
             changes=[b-a for a,b in zip(d,d[1:])]
             # A stable tick interpolator may have a startup hold, but has no
             # backward pose jumps or artificial >1 m leap per painted frame.
             rate=step/wall
             print('LAB_V24_MOTION_SAMPLE',engine,width,json.dumps({
               'wall':wall,'clock_delta':step,'clock_rate':rate,
               'frames':len(d),'max_forward':max(changes),'min_forward':min(changes),
               'source':initial['currentImage']}))
             assert len(d)>=30,('TOO_FEW_PAINT_SAMPLES',len(d))
             assert 0.65<=rate<=1.25,('CLOCK_RATE_NOT_1X',rate)
             assert min(changes)>=-1e-5,('JITTER_REVERSE_DISPLACEMENT',min(changes))
             assert max(changes)<2.0,('JITTER_UNBOUNDED_JUMP',max(changes))
             page.locator('#pauseBtn').click()
             paused=page.evaluate("() => CleanLab.getState().t")
             page.wait_for_timeout(250)
             assert abs(page.evaluate("() => CleanLab.getState().t")-paused)<.005
             page.locator('#broadcastStage').screenshot(path=f'/tmp/lab-v24-screenshots/{engine}-{width}-steady.png')
             page.locator('#trialMode').select_option('synthetic')
             assert page.evaluate("() => CleanLab.getState().horses.length")==18
             assert page.evaluate("() => CleanLab.inspect().motionModel")=='fixed-pose-interpolation'
             assert not errors,errors
             print('PASS_LAB_V24_REAL_TIME_DEFAULT_AND_SHARED_MOTION',engine,width)
             context.close()
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-v24-marker-and-clock-qa
          path: /tmp/lab-v24-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

name: Race list update v1 (add newly held JRA races every day, then start the crawlers; no Claude usage)
on:
  workflow_dispatch:
  schedule:
    # 毎日 06:10 JST（前日までの開催分を足す。GitHub の定時は遅れることがある＝Claude の朝の起動役からも起動する）
    - cron: '10 21 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: going-labels-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest test_jra_going_labels
        working-directory: baba_models_v2
      - name: Add newly held races to the per-year lists (only days before today, only days not yet listed)
        id: upd
        run: |
          set -euo pipefail
          python baba_models_v2/jra_going_labels.py update --dir baba_models_v2/going_labels --work "$RUNNER_TEMP" | tee "$RUNNER_TEMP/upd.txt"
          echo "new=$(sed -n 's/.*new races \([0-9]*\).*/\1/p' "$RUNNER_TEMP/upd.txt" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Commit the list
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baba_models_v2/going_labels
          git diff --cached --quiet && { echo 'nothing new'; exit 0; }
          git commit -q -m "取得対象のレース一覧に、新しく開催された分を追加（自動）"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i*3)); done
      - name: Start the crawlers (horses and race pages) now instead of waiting for their 6-hour schedule
        if: ${{ steps.upd.outputs.new != '' && steps.upd.outputs.new != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in sire-db-crawl-v1 race-pages-crawl-v1; do
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/$w.yml/dispatches" -f ref=main && echo "started $w" || echo "could not start $w (the 6-hour schedule will pick it up)"
          done

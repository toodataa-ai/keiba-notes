name: Validate JRA v3.15 value column on actual full PDF (staging)
on:
  push:
    branches:
      - staging/jra-v315-value-column-guard-20261101
    paths:
      - '.github/scripts/jra-v315-value-column-v1.py'
      - '.github/scripts/test-jra-v315-value-column-v1.py'
      - '.github/workflows/validate-jra-v315-value-column-v1.yml'
  pull_request:
    paths:
      - '.github/scripts/jra-v315-value-column-v1.py'
      - '.github/scripts/test-jra-v315-value-column-v1.py'
      - '.github/workflows/validate-jra-v315-value-column-v1.yml'
permissions:
  contents: read
jobs:
  full-pdf-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact approved PDF environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
          python3 -m pip install -q weasyprint==68.0 pymupdf==1.26.4
      - name: Unit regression for value-column contract
        run: python3 .github/scripts/test-jra-v315-value-column-v1.py -v
      - name: Test both real 2026-11-01 published formal files without changing history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          registry=json.loads(Path('docs/data/races.json').read_text())['races']
          for rid in ('2026-11-01-mahoroba-stakes','2026-11-01-tenno-sho-autumn'):
            r=next(x for x in registry if x['id']==rid)
            assert r['purchase_strategy_version']=='v3.15'
            plan=Path(r['e2e_prediction'])
            p=json.loads(plan.read_text())
            source=Path(p['source_prediction_path'])
            html=Path('docs')/r['report']
            pdf=Path('docs')/r['pdf']
            out_html=Path('/tmp')/(rid+'-value-staging.html')
            out_pdf=Path('/tmp')/(rid+'-value-staging.pdf')
            subprocess.run(['python3','.github/scripts/jra-v315-value-column-v1.py',
              '--plan',str(plan),'--source',str(source),
              '--html-input',str(html),'--pdf-input',str(pdf),
              '--html-output',str(out_html),'--pdf-output',str(out_pdf)],check=True)
            print('STAGING_VALUE_COLUMN_REAL_PDF_PASS',rid,flush=True)
          PY
      - name: Assert repository original bytes were untouched
        run: |
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard | grep -v '^.github/scripts/__pycache__/' || true)"
          echo 'PASS_NO_PREDICTION_BET_PDF_HISTORICAL_FILE_MODIFICATION'
      - name: Save both real reviewed PDF and HTML previews for staging approval
        uses: actions/upload-artifact@v4
        with:
          name: jra-v315-value-column-staging-2026-11-01
          path: |
            /tmp/2026-11-01-mahoroba-stakes-value-staging.html
            /tmp/2026-11-01-mahoroba-stakes-value-staging.pdf
            /tmp/2026-11-01-tenno-sho-autumn-value-staging.html
            /tmp/2026-11-01-tenno-sho-autumn-value-staging.pdf
          retention-days: 7
